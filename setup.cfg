[flake8]
extend-ignore = E203,E741
max-line-length = 88
per-file-ignores =
    __init__.py:F401
    samantha/components/ctiga/*:E501
    samantha/models/ctiga/*:E501
exclude =
    # Ignore these recipes from flake8 check
    # since they are working in progress
    recipes/*

[isort]
multi_line_output=3
include_trailing_comma=True
force_grid_wrap=0
use_parentheses=True
line_length=88
