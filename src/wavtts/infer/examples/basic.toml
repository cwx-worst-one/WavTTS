# Model and checkpoint
model = "WavTTS"
ckpt_file = ""  # Leave empty to download the default Hugging Face checkpoint.
vocab_file = "infer/examples/vocab.txt"

# Reference prompt and generation text
ref_audio = "infer/examples/basic_ref_en.wav"
ref_text = "Some call me nature, others call me mother nature."
gen_text = "I don't really care what you call me. I've been a silent spectator, watching species evolve, empires rise and fall."
gen_file = ""  # If set, this file is used instead of gen_text.

# Output
output_dir = "output"
output_file = "infer_cli_basic.wav"
remove_silence = false

# Sampling
nfe_step = 50
cfg_strength = 3.0
timestep_mapping = "power"
timestep_power = 2.0
shift = 3.0
speed = 1.0
