# WavTTS config name or provide model_cfg explicitly
model = "WavTTS_scale_9_16k"
# Optional: leave empty to download the default WavTTS checkpoint from Hugging Face.
ckpt_file = ""
vocab_file = "infer/examples/vocab.txt"
ref_audio = "infer/examples/basic_ref_en.wav"
# If an empty "", transcribes the reference audio automatically.
ref_text = "Some call me nature, others call me mother nature."
gen_text = "I don't really care what you call me. I've been a silent spectator, watching species evolve, empires rise and fall. But always remember, I am mighty and enduring."
# File with text to generate. Ignores the text above.
gen_file = ""
output_dir = "output"
output_file = "infer_cli_basic.wav"
remove_silence = false

nfe_step = 50
cfg_strength = 3.0
timestep_mapping = "power"
timestep_power = 2.0
shift = 3.0
speed = 1.0
