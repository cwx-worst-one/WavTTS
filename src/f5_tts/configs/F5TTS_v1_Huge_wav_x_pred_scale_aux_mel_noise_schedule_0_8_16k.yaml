hydra:
  run:
    dir: ckpts/${model.name}_${model.mel_spec.mel_spec_type}_${model.tokenizer}_${datasets.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}

datasets:
  name: Emilia_ZH_EN  # dataset name
  batch_size_per_gpu: 22400  # 8 GPUs, 8 * 38400 = 307200
  batch_size_type: frame  # frame | sample
  max_samples: 64  # max sequences per batch if use frame-wise batch_size. we set 32 for small models, 64 for base models
  num_workers: 16

optim:
  epochs: 686
  learning_rate: 7.5e-5
  num_warmup_updates: 20000  # warmup updates
  grad_accumulation_steps: 1  # note: updates = steps / grad_accumulation_steps
  max_grad_norm: 1.0  # gradient clipping
  bnb_optimizer: False  # use bnb 8bit AdamW optimizer or not

model:
  name: F5TTS_v1_Huge_wav  # model name
  tokenizer: pinyin  # tokenizer type
  tokenizer_path: null  # if 'custom' tokenizer, define the path want to use (should be vocab.txt)
  backbone: DiT
  wav_input: True
  cfm:
    prediction: x_pred         # flow | x_pred
    loss_space: v         # flow | v   (x_pred 模式下一般用 v)
    t_sampling: logistic_normal      # uniform | logistic_normal
    P_mean: -0.8          # config from JiT
    P_std: 0.8
    t_eps: 0.02
    noise_scale: 1.0
    latents_scale: 10.0
    use_aux_mel_loss: True
    aux_mel_loss_weight: 0.05
    sample_rate: 16000
  arch:
    dim: 1280
    depth: 32
    heads: 16
    ff_mult: 4
    text_dim: 512
    text_mask_padding: True
    qk_norm: null  # null | rms_norm
    conv_layers: 4
    pe_attn_head: null
    attn_backend: torch  # torch | flash_attn
    attn_mask_enabled: False
    checkpoint_activations: False  # recompute activations and save memory for extra compute
    use_audio_proj: True
    audio_proj_dim: 1024
    audio_proj_hidden: 768
  mel_spec:
    target_sample_rate: 16000
    n_mel_channels: 160   # equal to wav_frame_len in F5-TTS_wav
    hop_length: 160  # 240 @24k = 100Hz or 160 @16k = 100Hz
    win_length: 1024
    n_fft: 1024
    mel_spec_type: no_vocoder  # vocos | bigvgan | no_vocoder
    return_wav_only: True
    wav_frame_len: 160  # 240 @24k = 100Hz or 160 @16k = 100Hz
  vocoder:
    is_local: False  # use local offline ckpt or not
    local_path: null  # local vocoder path

ckpts:
  logger: wandb  # wandb | tensorboard | null
  log_samples: True  # infer random sample per save checkpoint. wip, normal to fail with extra long samples
  save_per_updates: 50000  # save checkpoint per updates 50000
  keep_last_n_checkpoints: -1  # -1 to keep all, 0 to not save intermediate, > 0 to keep last N checkpoints
  last_per_updates: 5000  # save last checkpoint per updates 5000
  exp_name: ${model.name}_${model.mel_spec.mel_spec_type}_${model.tokenizer}_${datasets.name}
  save_dir: ckpts/${model.name}_${model.mel_spec.mel_spec_type}_${model.tokenizer}_${datasets.name}
