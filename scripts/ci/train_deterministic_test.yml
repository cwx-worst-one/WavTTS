.auto-wrapper: &auto-wrapper
  only:
    - develop
    - master

.manual-wrapper: &manual-wrapper
  when: manual
  except:
    - develop
    - master

.asr-deterministic-test: &asr-deterministic-test
  stage: train_deterministic_test
  script:
    - echo "begin batch test"
    - pwd
    - git log --oneline -n 3
    - export CUDA_VISIBLE_DEVICES=6,7
    - export DOLPHIN_DISTRIBUTED_FRAMEWORK=torch
    - ps x -o pid,ppid,tty,stat,rss,rsz,time,command
    - bash -x tests/batch_test/do_asr_batch_test.sh
  tags:
    - gpu
  artifacts:
    expire_in: 2 hrs

auto-asr-deterministic-test:
  <<: *auto-wrapper
  <<: *asr-deterministic-test

manual-asr-deterministic-test:
  <<: *manual-wrapper
  <<: *asr-deterministic-test
