deploy_scm_test:
  stage: deploy
  script:
    - python3 scripts/ci/scm_deploy.py
  tags:
    - cpu
  only:
    - master
    - develop

deploy_docs:
  stage: deploy
  script:
    - echo "begin deploy docs"
    - pwd
    - bash -x docs/build_api_docs.sh
    - cd docs/build/
    - tar -cvzf dolphin.tar.gz html/
  tags:
    - cpu
  artifacts:
    expire_in: 2 hrs
  only:
    - master
    - /.*deploy_doc.*/
