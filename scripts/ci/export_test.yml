.auto-wrapper: &auto-wrapper
  only:
    - develop
    - master

.manual-wrapper: &manual-wrapper
  when: manual
  except:
    - develop
    - master

.asr-export-test: &asr-export-test
  stage: export_test
  script:
    - echo "begin asr export test"
    - pwd
    - git log --oneline -n 3
    - export CUDA_VISIBLE_DEVICES=6,7
    - export DOLPHIN_DISTRIBUTED_FRAMEWORK=torch
    - ps x -o pid,ppid,tty,stat,rss,rsz,time,command
    - free -h
    - python3 -u tests/export_test/export_onnx_test.py asr

  tags:
    - gpu
  artifacts:
    expire_in: 2 hrs


.sid-export-test: &sid-export-test
  stage: export_test
  script:
    - echo "begin sid export test"
    - pwd
    - git log --oneline -n 3
    - export CUDA_VISIBLE_DEVICES=6,7
    - export DOLPHIN_DISTRIBUTED_FRAMEWORK=torch
    - ps x -o pid,ppid,tty,stat,rss,rsz,time,command
    - free -h
    - python3 -u tests/export_test/export_onnx_test.py sid
  tags:
    - gpu
  artifacts:
    expire_in: 2 hrs


auto-asr-export-test:
  <<: *auto-wrapper
  <<: *asr-export-test

manual-asr-export-test:
  <<: *manual-wrapper
  <<: *asr-export-test

auto-sid-export-test:
  <<: *auto-wrapper
  <<: *sid-export-test

manual-sid-export-test:
  <<: *manual-wrapper
  <<: *sid-export-test