.auto-wrapper: &auto-wrapper
  only:
    - develop
    - master

.manual-wrapper: &manual-wrapper
  when: manual
  except:
    - develop
    - master

.unit-test: &unit-test
  stage: unit_test
  script:
    - echo "begin unit test"
    - pip3 install pytest --trusted-host bytedpypi.byted.org
    - pwd
    - git log --oneline -n 3
    - export CUDA_VISIBLE_DEVICES=6,7
    - export DOLPHIN_DISTRIBUTED_FRAMEWORK=torch
    - pip3 install pybind11
    - pip3 install warp_rnnt==0.6.0 openfst_python --trusted-host bytedpypi.byted.org
    - ps x -o pid,ppid,tty,stat,rss,rsz,time,command
    - python3 -m pytest -v -s --cov=core tests/unit_test/
  tags:
    - gpu
  artifacts:
    expire_in: 2 hrs

auto-unit-test:
  <<: *auto-wrapper
  <<: *unit-test

manual-unit-test:
  <<: *manual-wrapper
  <<: *unit-test
