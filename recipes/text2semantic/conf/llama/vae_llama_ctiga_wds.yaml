---

################################################################################
##########                       BASIC CONFIGURATION                  ##########
################################################################################

seed: 1996
__set_seed: !apply:pytorch_lightning.seed_everything [!ref <seed>]

################################################################################
##########                    TRAINING CONFIGURATION                  ##########
################################################################################
run_opts:
    log_dir: logs
    hdfs_path: None
    fast_dev_run: False
    tensorboard_dir: !ref <run_opts[log_dir]>
    log_name: semantic
    version: 1.0
    precision: bf16
    accelerator: auto
    strategy: ddp # deepspeed_stage_2_offload, ddp_find_unused_parameters_false
    cache_dir: ./.cache_dir
    profiler: simple
    flash_attn: null
    num_epochs: 100
    batch_size: 16
    num_workers: 8
    learning_rate: 0.0003
    weight_decay: 0.1
    checkpointing: False
    n_step_save: 2000
    phone_tokens_num: 7370
    speaker_tokens_num: 8192
    batch_total_tokens: 5000
    use_phoneme_loss: False
    simulated_cycle_rate: 0.0
    
llama_config: !new:recipes.text2semantic.modules.continuous_vae_llama_ctiga.ModelArgs
    dim: 1024
    n_layers: 24
    n_heads: 16
    vocab_size: 15565 # vocab_size = hp.phone_tokens_num(7370) + speaker_num(4096) + 3
    out_dim: 32
    multiple_of: 256
    norm_eps: 0.000001
    max_batch_size: 32
    max_seq_len: 4096
    attn_pdrop: 0.1
    resid_pdrop: 0.1
    sparse: false
    checkpointing: !ref <run_opts[checkpointing]>

train_dataset: !new:recipes.text2semantic.datasets.continuous_wds_dataset.ContinuousTTSDataset
    wds_urls: !ref <run_opts[urls]>
    phone_tokens_num: !ref <run_opts[phone_tokens_num]>
    speaker_tokens_num: !ref <run_opts[speaker_tokens_num]>
    return_full_seq: !ref <run_opts[return_full_seq]>
    simulated_cycle_rate: !ref <run_opts[simulated_cycle_rate]>
    batcher_config:
        buckets: !apply:eval ["list(range(0, 4096, 100))"]  # [0, 100, 200 ... 4000] 4000以上的可以先丢掉
        dynamic_batch: True
        maximum_bucket_size: !ref <run_opts[batch_total_tokens]>
        length_fn: !apply:eval ["lambda x: x[2].shape[0]"]  # seq.shape

collator: !new:recipes.text2semantic.datasets.continuous_dataset.ContinuousCollator
    tokenizer_pad: 0

# dataloader configuration
train_dataloader: !new:torch.utils.data.DataLoader
    dataset: !ref <train_dataset>
    num_workers: !ref <run_opts[num_workers]>
    batch_size: null
    collate_fn: !ref <collator>
    pin_memory: True

# datamodule configuration
pl_datamodule: !new:recipes.text2semantic.lit_modules.DataModule
    train_dataloader: !ref <train_dataloader>

# model configuration
model_cls: !name:recipes.text2semantic.modules.continuous_vae_llama_ctiga.LLaMa
    params: !ref <llama_config>
    provider: ctiga

# training module configuration
#optimizer_cls: !name:torch.optim.AdamW
optimizer_cls: !name:deepspeed.ops.adam.FusedAdam # FusedAdam, DeepSpeedCPUAdam
    lr: !ref <run_opts[learning_rate]>
    weight_decay: !ref <run_opts[weight_decay]>
    betas: [0.9, 0.95]
    eps: 0.00000001

_steps_per_epoch: !apply:operator.length_hint [!ref <train_dataloader>]
_world_size: !apply:samantha.utils.envs.getenv_int ["WORLD_SIZE", 1]
scheduler_cls: !name:recipes.bark.lr_schedulers.musiclm_lr_scheduler.WarmupCosine
    init_lr: !ref <run_opts[learning_rate]>
    warmup_steps: 2000
    cycle_steps: 300000
    min_lr: !ref <run_opts[learning_rate]> * 0.1

# lightning model setting
pl_module: !new:recipes.text2semantic.lit_modules.llama.lit_vae_t2s_ctiga.VAET2SModule
    model_cls: !ref <model_cls>
    optimizer_cls: !ref <optimizer_cls>
    scheduler_cls: !ref <scheduler_cls>
    logits_criterion_cls: !name:recipes.text2semantic.modules.loss.MaskedCrossEntropy
    dense_criterion_cls: !name:recipes.text2semantic.modules.loss.MaskedKLLossPP
    tokenizer_len: !ref <run_opts[phone_tokens_num]>
    n_semantic: !ref <run_opts[speaker_tokens_num]>
    checkpointing: !ref <run_opts[checkpointing]>
    use_phoneme_loss: !ref <run_opts[use_phoneme_loss]>
    required_modules: {}

logger:
    - !new:pytorch_lightning.loggers.TensorBoardLogger
      save_dir: !ref <run_opts[tensorboard_dir]>
      name: !ref <run_opts[log_name]>
      version: !ref <run_opts[version]>
    - !new:pytorch_lightning.loggers.wandb.WandbLogger
      save_dir: !ref <run_opts[tensorboard_dir]>
      project: !ref <run_opts[log_name]>
      name: !ref <run_opts[version]>

callbacks:
    - !new:samantha.callbacks.HDFSModelCheckpoint
    #   dirpath: !ref <run_opts[log_dir]>/checkpoints
      hdfs_path: !ref <run_opts[hdfs_path]>
      every_n_train_steps: !ref <run_opts[n_step_save]>
      mode: min
      save_last: True
      save_top_k: 10
      save_on_train_epoch_end: True
      verbose: True
      monitor: kl_loss
      filename: "{epoch:02d}-{step}-{kl_loss:.2f}"
    - !new:pytorch_lightning.callbacks.LearningRateMonitor
      logging_interval: 'step'
    - !new:samantha.callbacks.timer.Timer

plugins:
    - !new:samantha.plugins.LargeTorchCheckpointIO

trainer: !new:pytorch_lightning.Trainer
    fast_dev_run: !ref <run_opts[fast_dev_run]>
    logger: !ref <logger>
    accelerator: !ref <run_opts[accelerator]>
    devices: 'auto'
    num_nodes: !apply:os.getenv ["ARNOLD_WORKER_NUM", 1]
    deterministic: False  # warning: setting to True can cause slowdowns
    enable_model_summary: True
    log_every_n_steps: 1
    strategy: !ref <run_opts[strategy]>
    max_epochs: !ref <run_opts[num_epochs]>
    #limit_train_batches: 100 # debug
    precision: !ref <run_opts[precision]>
    profiler: !ref <run_opts[profiler]>
    callbacks: !ref <callbacks>
    gradient_clip_val: 1.0
    benchmark: true
    plugins: !ref <plugins>

ckpt_path: null
