---

################################################################################
##########                       BASIC CONFIGURATION                  ##########
################################################################################

seed: 2023
__set_seed: !apply:pytorch_lightning.seed_everything [!ref <seed>]

# running parameters
log_dir: hdfs://harunava/home/byte_speech_sv/weitsung.lu/mulan_exp #!apply:os.getenv ["ARNOLD_OUTPUT", "logs"]
run_opts:
    fast_dev_run: False
    tensorboard_dir: !ref <log_dir>
    log_name: MuLan_large
    log_every_n_steps: 10
    version: g4
    precision: 16
    num_workers: 4
    accelerator: auto
    strategy: ddp_find_unused_parameters_false
    enable_activation_ckpt: True
    num_steps: 600000
    val_check_interval: 800
    batch_size: 72
    sample_buffer_size: 600
    val_batch_size: 128
    spec_aug: True
    text_encoder: bert
    music_encoder: mut
    emb_dim: 512
    learning_rate: 4.e-5
    weight_decay: 5.e-4
    temperature: 0.1  # temperature in Multiview Coding loss

################################################################################
##########                    TRAINING CONFIGURATION                  ##########
################################################################################


short_form_dataset: !new:recipes.mulan.dataset.short_form.ShortFormDataset
    resampled: True

long_form_dataset: !new:recipes.mulan.dataset.long_form.LongFormDataset
    resampled: True

audioset_dataset: !new:recipes.mulan.dataset.audioset.AudioSetDataset
    resampled: True

ecals_dataset: !new:recipes.mulan.dataset.ecals.ECALSDataset
    resampled: True

karaoke_dataset: !new:recipes.mulan.dataset.karaoke.KaraokeDataset
    resampled: True

playlist_dataset: !new:recipes.mulan.dataset.playlist.PlaylistDataset
    resampled: True

mcc_gpt_dataset: !new:recipes.mulan.dataset.mcc.MCCGPTGenDataset
    resampled: True

aed_gpt_dataset: !new:recipes.mulan.dataset.mcc.AEDGPTGenDataset
    resampled: True

mcc_n2m_dataset: !new:recipes.mulan.dataset.mcc.MCCN2MDataset
    resampled: True

tt_query_dataset: !new:recipes.mulan.dataset.tt_query.TTQueryDataset
    resampled: True

train_datasets:
    short_form: !ref <short_form_dataset>
    long_form: !ref <long_form_dataset>
    audio_set: !ref <audioset_dataset>
    ecals: !ref <ecals_dataset>
    karaoke: !ref <karaoke_dataset>
    playlist: !ref <playlist_dataset>
    mcc_gpt: !ref <mcc_gpt_dataset>
    aed_gpt: !ref <aed_gpt_dataset>
    mcc_n2m: !ref <mcc_n2m_dataset>
    tt_query: !ref <tt_query_dataset>

selected_dataset_names: [mcc_n2m]
weights: [1]

train_dataset: !new:samantha.dataio.dataset.MultiIterableDataset
    datasets: !apply:recipes.mulan.dataset.utils.select_datasets
        - !ref <train_datasets>
        - !ref <selected_dataset_names>
    weights: !ref <weights>
    num_samples: 10_000_000
    seed: !ref <seed>

kaggle_val_0: !new:recipes.mulan.dataset.val.TextMusicDataset
    path: data/kaggle
    csv_name: kaggle_val_meta.csv
    text_key: text

kaggle_val_1: !new:recipes.mulan.dataset.val.TextMusicDataset
    path: data/kaggle
    csv_name: kaggle_val_meta.csv
    text_key: aspect_list

short_form_val: !new:recipes.mulan.dataset.val.TextMusicDataset
    path: data/sf
    csv_name: sf_val_meta.csv
    text_key: text

val_dataset: [!ref <kaggle_val_0>, !ref <kaggle_val_1>, !ref <short_form_val>]

# datamodule configuration
pl_datamodule: !new:recipes.mulan.modules.pl_datamodule.MuLanDataModule
    train_dataset: !ref <train_dataset>
    batch_size: !ref <run_opts[batch_size]>
    sample_buffer_size: !ref <run_opts[sample_buffer_size]>
    val_dataset: !ref <val_dataset>
    val_batch_size: !ref <run_opts[val_batch_size]>

pl_module: !new:recipes.mulan.modules.pl_module.LitMuLanModule
    music_encoder: !ref <run_opts[music_encoder]>
    text_encoder: !ref <run_opts[text_encoder]>
    emb_dim: !ref <run_opts[emb_dim]>
    spec_aug: !ref <run_opts[spec_aug]>
    lr: !ref <run_opts[learning_rate]>
    weight_decay: !ref <run_opts[weight_decay]>
    temperature: !ref <run_opts[temperature]>

logger: !new:pytorch_lightning.loggers.TensorBoardLogger
    save_dir: !ref <run_opts[tensorboard_dir]>
    name: !ref <run_opts[log_name]>
    version: !ref <run_opts[version]>

callbacks:
    - !new:pytorch_lightning.callbacks.LearningRateMonitor
      logging_interval: step
    - !new:pytorch_lightning.callbacks.ModelCheckpoint
      save_top_k: 5
      monitor: median_rank_0
      mode: min
      filename: mulan-{step:06d}-{median_rank_0:.0f}-kaggle
    - !new:pytorch_lightning.callbacks.ModelCheckpoint
      save_top_k: 5
      monitor: median_rank_1
      mode: min
      filename: mulan-{step:06d}-{median_rank_1:.0f}-kaggle
    - !new:pytorch_lightning.callbacks.ModelCheckpoint
      save_top_k: 5
      monitor: median_rank_2
      mode: min
      filename: mulan-{step:06d}-{median_rank_2:.0f}-kaggle
    - !new:recipes.mulan.modules.ema.EMA
      decay: 0.999

plugins:
    - !new:samantha.plugins.torch_io.LargeTorchCheckpointIO

trainer: !new:pytorch_lightning.Trainer
    fast_dev_run: !ref <run_opts[fast_dev_run]>
    accelerator: !ref <run_opts[accelerator]>
    devices: auto
    num_nodes: !apply:os.getenv ["ARNOLD_WORKER_NUM", 1]
    deterministic: True
    strategy: !ref <run_opts[strategy]>
    enable_model_summary: True
    max_steps: !ref <run_opts[num_steps]>
    val_check_interval: !ref <run_opts[val_check_interval]>
    use_distributed_sampler: False
    logger: !ref <logger>
    log_every_n_steps: !ref <run_opts[log_every_n_steps]>
    precision: !ref <run_opts[precision]>
    callbacks: !ref <callbacks>
    plugins: !ref <plugins>

