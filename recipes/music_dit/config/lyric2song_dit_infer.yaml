---

################################################################################
##########                       BASIC CONFIGURATION                  ##########
################################################################################

seed: 1996
__set_seed: !apply:pytorch_lightning.seed_everything [!ref <seed>]

################################################################################
##########                    TRAINING CONFIGURATION                  ##########
################################################################################
run_opts:
    log_dir: logs
    hdfs_path: hdfs://haruna/home/byte_data_seed/lf_lq/speech/user/renyi/samantha_ckpts
    fast_dev_run: False
    tensorboard_dir: !ref <run_opts[log_dir]>
    log_name: unified_diffusion
    version: 1.0
    precision: bf16
    accelerator: auto
    strategy: ddp_find_unused_parameters_false # deepspeed_stage_2_offload, ddp_find_unused_parameters_false
    cache_dir: ./.cache_dir
    profiler: simple
    flash_attn: null
    num_epochs: 100
    learning_rate: 0.00005
    weight_decay: 0.001
    checkpointing: False
    n_step_save: 5000
    batch_total_tokens: 20000
    urls: null
    data_id: 2314
    val_data_id: 2314
    accumulate_grad_batches: 1
    resume_ckpt_path:
    use_url_lst: False
    use_textprefix: True
    use_prompt: False
    use_unet_style_skip_connect: true
    val_output_samples_dir: generated_samples
    val_check_interval: 10000
    limit_val_batches: 5
    max_length: 400         # max second, example longer than this will be drop

    batch_size: 16
    shuffle_buffer: 0       # 100
    buckets_in_sec: [30, 40, 50, 60]
    use_dynamic_batch: true
    max_seg_per_track: 3
    segment_method: "random"
    infer_structure_tags: False
    read_structure_tags: True
    region: "CN"
    lyrics_field: "lyrics"
    lyrics_confidence: 0.1  # Force Alignment confidence
    lyrics_tokenizer: "tts_chinese_frontend_model"
    segment_max_phone_len: 1000
    parquet_dataset_ids: [1527]
    parquet_dataset_weights: [1]
    sinking_threshold: 0.51
    quality_filter: True
    num_workers: 8
    prefetch_factor: 12
    melae_ckpt_path: hdfs://haruna/home/byte_data_seed/lf_lq/speech/user/renyi/samantha_ckpts/melae_kl/0418_melaekl2_beta1em2_lat32_g8_1/checkpoints/step=0395000.ckpt

extra_params:
    sample_rate: 24000
    lyrics_codebook_size: 2000
    speaker_codebook_size: 100
    train_conditions: "style_category,speaker_id,lyrics_tokens"
    input_embedders:
        prefix: [multitags_categorical, speaker_id, lyrics_tokens]
        temporal_aligned: []
        xattn: []
    tag_taxonomy_lang: "SA"             # Switch to "SA_unified" after CN vocal V3 merge
    tag_dropout_rate: 0.1
    prefix_hidden_size: 256             # Set this if using prefix input
    temporal_aligned_hidden_size: 0     # Set this if using temporal aligned input
    xattn_hidden_size: 0                # Set this if using xattn input
    semantic_frame_rate: 12.5           # Melae
    latent_dims: 32

    # infer
    diffusion_nfe: 20
    diffusion_sampler: "ddim"
    text_cfg_w: 4
    cache_dir: !ref <run_opts[cache_dir]>
    duration: 60
    prefix_emb_cfg_dropout_rate: [0.15, 0, 0]    # zero means no cfg

    # prediction dataset
    rewrite_target: "sa_tag"
    disable_multitag: True # Use first tag in prompt if True, https://bytedance.us.larkoffice.com/docx/PddVdJ0ScoLqjExc87Luh0Mjs0c#part-E3sadoTLdoodGbxXrP8uggCestg
    prompt_path: "tmp/zh_prompt_1m.csv"
    inference_conditions: style_category,speaker_id,lyrics_tokens # style_text|style_audio,lyrics_tokens,vocal_audio|vocal_text,chroma|speaker_id
    max_items: null
    run_combinations: False
    use_reranker: False
    dataset_mode: truncate_length
    lyrics_max_seq_len: !ref <run_opts[segment_max_phone_len]>
    lyrics_lang: "zh_phone" # en | zh_phone | zh_wp
    output_dir: !ref <run_opts[version]>

model_config: !new:recipes.music_dit.model.llama_ldm.ModelArgs
    in_channels: !ref <extra_params[latent_dims]>
    out_channels: !ref <extra_params[latent_dims]>
    llama_provider: ctiga
    local_cond_dim: 256
    time_embed_dim: 256
    prefix_hidden_size: !ref <extra_params[prefix_hidden_size]>
    temporal_aligned_hidden_size: !ref <extra_params[temporal_aligned_hidden_size]>
    xattn_hidden_size: !ref <extra_params[xattn_hidden_size]>
    encoder_dim: 1536
    encoder_n_layers: 24
    encoder_n_heads: 16
    causal: False
    local_cond_project_type: linear
    use_unet_style_skip_connect: !ref <run_opts[use_unet_style_skip_connect]>

pl_datamodule: !new:recipes.bigmusic.datasets.lyrics.LyricsDataModule
    predict_dataset: !ref <predict_dataset>
    num_workers: 0

predict_dataset:
    !apply:recipes.bigmusic.datasets.inference.inference_dataset_from_prompt
    prompt_path: !ref <extra_params[prompt_path]>
    conditions: !ref <extra_params[inference_conditions]>
    max_items: !ref <extra_params[max_items]>
    batch_size: 1
    run_combinations: !ref <extra_params[run_combinations]>
    lyrics_max_seq_len: !ref <extra_params[lyrics_max_seq_len]>
    dataset_mode: !ref <extra_params[dataset_mode]>
    lang: !ref <extra_params[lyrics_lang]>
    enable_punctuation: True
    rewrite_target: !ref <extra_params[rewrite_target]>
    disable_multitag: !ref <extra_params[disable_multitag]>
    extra_params: !ref <extra_params>

model_cls: !name:recipes.music_dit.model.llama_ldm.LlamaDiffusion
    hp: !ref <model_config>

optimizer_cls: !name:deepspeed.ops.adam.FusedAdam
    lr: !ref <run_opts[learning_rate]>
    weight_decay: !ref <run_opts[weight_decay]>
    betas: [0.9, 0.95]
    eps: 0.0000001

scheduler_cls: !name:recipes.bark.lr_schedulers.musiclm_lr_scheduler.WarmupCosine
    init_lr: !ref <run_opts[learning_rate]>
    warmup_steps: 8000
    cycle_steps: 500000
    min_lr: !ref <run_opts[learning_rate]> * 0.1

# lightning model setting
pl_module: !new:recipes.music_dit.lit_module.lit_diffusion_voicebox.Lyric2songInferenceModule
    model_cls: !ref <model_cls>
    optimizer_cls: !ref <optimizer_cls>
    scheduler_cls: !ref <scheduler_cls>
    checkpointing: !ref <run_opts[checkpointing]>
    resume_ckpt_path: !ref <run_opts[resume_ckpt_path]>
    criterions: ["l1"]
    required_modules:
        melae:
            hpath: !ref <run_opts[melae_ckpt_path]>
            initializer: !name:recipes.umm.requires.model_initializer.init_melae
                cache_dir: !ref <run_opts[cache_dir]>
    val_output_samples_dir: !ref <run_opts[log_dir]>/<run_opts[log_name]>/<run_opts[version]>/generated
    extra_params: !ref <extra_params>

logger:
    - !new:pytorch_lightning.loggers.TensorBoardLogger
      save_dir: !ref <run_opts[tensorboard_dir]>
      name: !ref <run_opts[log_name]>
      version: !ref <run_opts[version]>
#    - !new:pytorch_lightning.loggers.wandb.WandbLogger
#      save_dir: !ref <run_opts[tensorboard_dir]>
#      project: !ref <run_opts[log_name]>
#      name: !ref <run_opts[version]>

# separating out additional_callbacks so auto_eval can disable metrics
additional_callbacks:
    - !new:recipes.bigmusic.callbacks.wer_metrics.WERMetricsSAOnlineCallback
      asr_model_path: zh-CN
    - !new:recipes.bigmusic.callbacks.mir_metrics.MIRTagMetricsSAOnlineCallback
      # - !new:recipes.bigmusic.callbacks.mcs_metrics.MCSMetricsCallback  # avoid loading mulan
      # - !new:recipes.bigmusic.callbacks.save_outputs.NormVolumeCallback
      # - !new:recipes.bigmusic.callbacks.mir_offline_metrics.MIROfflineCallback  # MIR metrics (key, tempo)

    - !new:recipes.bigmusic.callbacks.save_outputs.SaveVideoCallback
callbacks:
    - !new:recipes.bigmusic.callbacks.save_outputs.SaveOutputsCallback

plugins:
    - !new:samantha.plugins.LargeTorchCheckpointIO

trainer: !new:pytorch_lightning.Trainer
    fast_dev_run: !ref <run_opts[fast_dev_run]>
    logger: !ref <logger>
    accelerator: !ref <run_opts[accelerator]>
    devices: 'auto'
    num_nodes: !apply:os.getenv ["ARNOLD_WORKER_NUM", 1]
    deterministic: False  # warning: setting to True can cause slowdowns
    enable_model_summary: True
    log_every_n_steps: 50
    strategy: !ref <run_opts[strategy]>
    max_epochs: !ref <run_opts[num_epochs]>
    precision: !ref <run_opts[precision]>
    profiler: !ref <run_opts[profiler]>
    callbacks:
        !apply:operator.add [!ref <additional_callbacks>, !ref <callbacks>]
    gradient_clip_val: 0.2
    benchmark: false
    accumulate_grad_batches: !ref <run_opts[accumulate_grad_batches]>
    plugins: !ref <plugins>
    limit_val_batches: !ref <run_opts[limit_val_batches]>
    val_check_interval: !ref <run_opts[val_check_interval]>
    num_sanity_val_steps: 5
    limit_train_batches: 10000


ckpt_path: last
