---

################################################################################
##########                       BASIC CONFIGURATION                  ##########
################################################################################

seed: 1995
__set_seed: !apply:pytorch_lightning.seed_everything [!ref <seed>]
__set_float32_matmul_precision: !apply:torch.set_float32_matmul_precision ['high']

extra_params:
    gt_infer_mode: "semantic->coarse->fine"  # ["mulan->semantic->coarse->fine", "semantic->coarse->fine", "coarse->fine"]
    output_dir: generated_output/plastic_gt_infer_coarse_pgc600k_semantic
    semantic_ckpt: "/mnt/bn/audio-diffusion/ckpts/musiclm/semantic_flash_llama/karaoke_and_playlist/checkpoints/last.ckpt"
    # coarse_ckpt: "/mnt/bn/zongyu-lq/logs/coarse_flash_llama/pgc600k_wav2vec/checkpoints/step=040000-tr_loss=4.0335-val_loss_0=4.0697.ckpt"
    coarse_ckpt: "/mnt/bn/zongyu-lq/logs/coarse_flash_llama/pgc600k_best_rq_cb1024/checkpoints/step=040000-tr_loss=3.9867-val_loss_0=4.1129.ckpt"
    # coarse_ckpt: "/mnt/bn/zongyu-lq/logs/coarse_flash_llama/pgc600k_best_rq_cb8192/checkpoints/step=040000-tr_loss=4.1411-val_loss_0=4.0975.ckpt"
    fine_ckpt: "/mnt/bn/zongyu-lq/logs/fine_flash_llama/mcc40m_324m/checkpoints/step=110000-tr_loss=4.3135-val_loss_0=4.9265.ckpt"
    sample_rate: 24000
    duration: 10
    num_rounds: 1
    semantic_duration: 10
    coarse_duration: 10
    fine_duration: 4
    semantic_stride: 5
    coarse_stride: 5
    fine_stride: 3
    wav2vec_codebook_size: 1024
    mulan_codebook_size: 1024
    mulan_num_rvq: 12
    soundstream_codebook_size: 1024
    wav2vec_frame_rate: 25
    soundstream_frame_rate: 50
    num_coarse: 4
    num_fine: 8
    semantic_temperatue: 1.0
    coarse_temperature: 0.9
    fine_temperature: 0.8
    sample_mode: "gumbel"

run_opts:
    fast_dev_run: False
    precision: 32
    accelerator: auto
    strategy: ddp_find_unused_parameters_false
    cache_dir: .module_cache/musiclm
    batch_size: 10
    num_workers: 1

################################################################################
##########                    TRAINING CONFIGURATION                  ##########
################################################################################

# Non-vocal
# predict_dataset: !new:recipes.musiclm.datasets.karaoke.KaraokeDataset
#     urls: "pipe:hdfs dfs -cat hdfs://harunava/home/byte_speech_sv/data/karaoke_for_singsong/shards-0131.tar"
#     nodesplitter: !name:recipes.musiclm.datamodules.webdataset.return_self
#     sample_rate: !ref <extra_params[sample_rate]>
#     duration: !ref <extra_params[duration]>
#     audio_key: "acc.npy"
#     sample_range_key: "acc_sample_range.npy"
#     min_volume_threshold: 0.05

# pl_datamodule: !new:recipes.musiclm.datamodules.webdataset.DataModule
#     predict_dataset: !ref <predict_dataset>
#     batch_size: !ref <run_opts[batch_size]>
#     num_workers: !ref <run_opts[num_workers]>
#     pin_memory: True

# Vocal
predict_dataset: !new:recipes.musiclm.datasets.plastic.PlasticDataset

predict_dataloader: !new:torch.utils.data.DataLoader
    dataset: !ref <predict_dataset>
    batch_size: !ref <run_opts[batch_size]>
    num_workers: !ref <run_opts[num_workers]>
    shuffle: False
    drop_last: False
    pin_memory: False

pl_datamodule: !new:recipes.musiclm.datamodules.lit_datamodule.DataModule
    predict_dataloader: !ref <predict_dataloader>

pl_module: !new:recipes.musiclm.lightning.inference.InferenceGTModule
    extra_params: !ref <extra_params>
    required_modules:
        mulan:
            - hdfs://harunava/home/byte_speech_sv/weitsung.lu/mulan_exp/MuLan_large/g4/checkpoints/mulan-step=044800-median_rank_1=170-kaggle.ckpt
            - !name:recipes.musiclm.requires.model_initializer.init_mulan
              cache_dir: !ref <run_opts[cache_dir]>
              version: "g4"
        mulan_centers:
            - hdfs://harunava/home/byte_speech_sv/zongyu.yin/ckpts/mulan/kmeans_minibatch_codebook-mulan1b_g4_170-1024x12.npy
            - !name:recipes.musiclm.requires.model_initializer.init_mulan_centers
              cache_dir: !ref <run_opts[cache_dir]>
        wav2vec:
            - hdfs://harunava/home/byte_speech_sv/zongyu.yin/ckpts/w2v/2.1/semantic.jit.pt
            - !name:recipes.musiclm.requires.model_initializer.init_wav2vec
              cache_dir: !ref <run_opts[cache_dir]>
        best_rq:
            - /mnt/bn/audio-diffusion/ckpts/best_rq/step=055000.pt
            - !name:recipes.musiclm.requires.model_initializer.init_best_rq
              cache_dir: !ref <run_opts[cache_dir]>
        semantic_centers:
            - hdfs://harunava/home/byte_speech_sv/zongyu.yin/ckpts/w2v/2.1/centroids_epoch_10.npy
            # - hdfs://harunava/home/byte_speech_sv/zongyu.yin/kmeans/best_rq_1x8192_cb1024/centroids_epoch_10.npy
            # - hdfs://harunava/home/byte_speech_sv/zongyu.yin/kmeans/best_rq_1x8192_cb8192/centroids_epoch_10.npy
            - !name:recipes.musiclm.requires.model_initializer.init_semantic_centers
              cache_dir: !ref <run_opts[cache_dir]>
        semantic_cmvn:
            - hdfs://harunava/home/byte_speech_sv/zongyu.yin/kmeans/best_rq_1x8192_cb1024/global.cmvn.npy
            # - hdfs://harunava/home/byte_speech_sv/zongyu.yin/kmeans/best_rq_1x8192_cb8192/global.cmvn.npy
            - !name:recipes.musiclm.requires.model_initializer.init_semantic_cmvn
              cache_dir: !ref <run_opts[cache_dir]>
        soundstream:
            - hdfs://harunava/home/byte_speech_sv/zongyu.yin/ckpts/soundstream/190k
            - !name:recipes.musiclm.requires.model_initializer.init_soundstream
              cache_dir: !ref <run_opts[cache_dir]>
        soundstream_dec:
            - hdfs://harunava/home/byte_speech_sv/zongyu.yin/ckpts/soundstream/190k
            - !name:recipes.musiclm.requires.model_initializer.init_soundstream_decoder
              cache_dir: !ref <run_opts[cache_dir]>

trainer: !new:pytorch_lightning.Trainer
    fast_dev_run: !ref <run_opts[fast_dev_run]>
    accelerator: !ref <run_opts[accelerator]>
    devices: 'auto'
    num_nodes: !apply:os.getenv ["ARNOLD_WORKER_NUM", 1]
    deterministic: False
    enable_model_summary: True
    strategy: !ref <run_opts[strategy]>
    precision: !ref <run_opts[precision]>
