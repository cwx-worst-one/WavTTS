---

################################################################################
##########                       BASIC CONFIGURATION                  ##########
################################################################################

seed: 555
__set_seed: !apply:pytorch_lightning.seed_everything [!ref <seed>]

################################################################################
##########                    TRAINING CONFIGURATION                  ##########
################################################################################

hp:
    sample_rate: 24000
    duration: 10
    semantic_duration: 10
    coarse_duration: 10
    fine_duration: 4
    semantic_stride: 5
    coarse_stride: 5
    fine_stride: 3
    wav2vec_codebook_size: 1024
    mulan_codebook_size: 1024
    soundstream_codebook_size: 1024
    wav2vec_frame_rate: 25
    soundstream_frame_rate: 50
    mulan_codebook_shared: False
    num_coarse: 4
    num_fine: 8
    semantic_temperatue: 0.1
    coarse_temperature: 0.9
    fine_temperature: 0.8
    sample_mode: "gumbel"
    seed: !ref <seed>
    prompt_path: "/mnt/bn/audio-diffusion/data/google_prompts/google_prompts.csv"
    output_dir: ./generated_output/google_prompts
    semantic_ckpt: "/mnt/bn/zongyu-lq/logs/semantic_sparse/mulan_g4/checkpoints/step=035216-val_accu_0=35.57.ckpt"
    coarse_ckpt: "/mnt/bn/zongyu-lq/logs/coarse_sparse/mulan_g4/checkpoints/step=070680-val_accu_0=28.99.ckpt"
    fine_ckpt: "/mnt/bn/zongyu-lq/ckpts/musiclm/epoch=03-step=193000-accu=18.92.ckpt"

run_opts:
    fast_dev_run: False
    precision: 32
    accelerator: auto
    strategy: ddp_find_unused_parameters_false
    cache_dir: /mnt/bn/zongyu-lq/.module_cache/musiclm
    batch_size: 20
    num_rounds: 1
    num_workers: 8

predict_dataset: !new:recipes.musiclm.datasets.inference.InferenceDataset
    prompt_path: !ref <hp[prompt_path]>

# dataloader configuration
predict_dataloader: !new:torch.utils.data.DataLoader
    dataset: !ref <predict_dataset>
    batch_size: !ref <run_opts[batch_size]>
    num_workers: !ref <run_opts[num_workers]>
    shuffle: False
    drop_last: False
    pin_memory: False

# datamodule configuration
pl_datamodule: !new:recipes.musiclm.datamodules.lit_datamodule.DataModule
    predict_dataloader: !ref <predict_dataloader>

pl_module: !new:recipes.musiclm.lightning.inference.InferenceModule
    extra_params: !ref <hp>
    required_modules:
        mulan:
            - hdfs://harunava/home/byte_speech_sv/weitsung.lu/mulan_exp/MuLan_large/g4/checkpoints/mulan-step=044800-median_rank_1=170-kaggle.ckpt
            - !name:recipes.musiclm.requires.model_initializer.init_mulan
              cache_dir: !ref <run_opts[cache_dir]>
              version: "g4"
        mulan_centers:
            - hdfs://harunava/home/byte_speech_sv/zongyu.yin/ckpts/mulan/kmeans_minibatch_codebook-mulan1b_g4_170-1024x12.npy
            - !name:recipes.musiclm.requires.model_initializer.init_mulan_centers
              cache_dir: !ref <run_opts[cache_dir]>
        soundstream:
            - hdfs://harunava/home/byte_speech_sv/zongyu.yin/ckpts/soundstream/190k
            - !name:recipes.musiclm.requires.model_initializer.init_soundstream_decoder
              cache_dir: !ref <run_opts[cache_dir]>

trainer: !new:pytorch_lightning.Trainer
    fast_dev_run: !ref <run_opts[fast_dev_run]>
    accelerator: !ref <run_opts[accelerator]>
    devices: 'auto'
    num_nodes: !apply:os.getenv ["ARNOLD_WORKER_NUM", 1]
    deterministic: False  # warning: setting to True can cause slowdowns
    enable_model_summary: True
    strategy: !ref <run_opts[strategy]>
    max_epochs: !ref <run_opts[num_rounds]>
    precision: !ref <run_opts[precision]>
