---

################################################################################
##########                       BASIC CONFIGURATION                  ##########
################################################################################

ckpt_path: null

seed: 555
__set_seed: !apply:pytorch_lightning.seed_everything [!ref <seed>]
__set_float32_matmul_precision: !apply:torch.set_float32_matmul_precision ['high']
_checkpointing: False

extra_params:
    sample_rate: 24000
    duration: 10
    semantic_duration: 10
    semantic_stride: 5
    wav2vec_codebook_size: 1024
    wav2vec_frame_rate: 25
    mulan_codebook_size: 1024
    mulan_num_rvq: 12
    ce_weight: 0.1
    seq_weight: 50
    beam_size: 2
    semantic_temperature: 1.0
    diffusion_steps: 25
    sample_mode: "gumbel"
    semantic_type: "wav2vec"
    decoder_type: "diffusion"
    mulan_force_cfg: 1 # 1 = mulan context is not used for diffusion inference. 0 = use mulan context
    rewards:
        "mulan_sim": 1.0
        "energy_std": 1.0
    # To use text reward, set dataset_return_keys: audio,text
    dataset_return_keys: audio
    log_num_val_samples: 1
    log_num_val_beam_samples: null

# running parameters
run_opts:
    fast_dev_run: False
    log_dir: !apply:os.getenv ["ARNOLD_OUTPUT", "logs"]
    log_name: semantic_flash_llama_rlhf
    version: mcc40m_filtered_vad_seqtrain_diffusion
    cache_dir: .module_cache/musiclm
    precision: "bf16-mixed"
    num_workers: 8
    accelerator: auto
    val_check_interval: 500
    max_steps: 1000000
    batch_size: 22
    learning_rate: 6.0e-6  # Adjust according to batch size
    warmup_steps: 3000
    cycle_steps: 50000
    weight_decay: 0.01
    min_volume_threshold: 0.05
    loudness_ratio_threshold: 0.2
    shuffle_buffer: 256
    gradient_clip_val: 1.0

################################################################################
##########                    TRAINING CONFIGURATION                  ##########
################################################################################

# ar_filtering: !new:recipes.musiclm.transforms.musiclm.ARFiltering
#     genre_stats_fname: "/mnt/bn/audio-diffusion/data/non_vocal_mcc_npy.filtered+audio_metrics_good/genre_quantile_stats.pkl"
#     semantic_diversity_range: (10, 90)
#     semantic_probs_range: (10, 90)

train_dataset: !new:recipes.musiclm.datasets.mcc.WrappedMCC40MDataset
    # find full list here: hdfs dfs -ls -R hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/mcc/indexes/ | grep ".txt" | awk '{print $8}'
    url2index_list:
        - hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/mcc/indexes/nonvocal-A-alternative-indie+alternative-rock+experimental+indie-pop+latin+metal+r-b-soul+reggae+sertanejo+trap-rap.txt
        - hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/mcc/indexes/nonvocal-A-alternative-indie.txt
        - hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/mcc/indexes/nonvocal-A-alternative-rock.txt
        - hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/mcc/indexes/nonvocal-A-blues+childhood+country+devotional+k-pop+soundtrack+trance+world-music.txt
        - hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/mcc/indexes/nonvocal-A-blues.txt
        - hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/mcc/indexes/nonvocal-A-childhood.txt
        - hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/mcc/indexes/nonvocal-A-classical.txt
        - hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/mcc/indexes/nonvocal-A-country.txt
        - hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/mcc/indexes/nonvocal-A-devotional.txt
        - hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/mcc/indexes/nonvocal-A-easy-listening.txt
        - hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/mcc/indexes/nonvocal-A-electronic+techno.txt
        - hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/mcc/indexes/nonvocal-A-electronic.txt
        - hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/mcc/indexes/nonvocal-A-experimental.txt
        - hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/mcc/indexes/nonvocal-A-folk+indie-folk.txt
        - hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/mcc/indexes/nonvocal-A-folk.txt
        - hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/mcc/indexes/nonvocal-A-hip-hop-rap.txt
        - hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/mcc/indexes/nonvocal-A-indie-folk.txt
        - hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/mcc/indexes/nonvocal-A-indie-pop.txt
        - hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/mcc/indexes/nonvocal-A-jazz.txt
        - hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/mcc/indexes/nonvocal-A-k-pop.txt
        - hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/mcc/indexes/nonvocal-A-latin.txt
        - hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/mcc/indexes/nonvocal-A-metal.txt
        - hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/mcc/indexes/nonvocal-A-new-age.txt
        - hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/mcc/indexes/nonvocal-A-others.txt
        - hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/mcc/indexes/nonvocal-A-pop.txt
        - hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/mcc/indexes/nonvocal-A-r-b-soul.txt
        - hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/mcc/indexes/nonvocal-A-reggae.txt
        - hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/mcc/indexes/nonvocal-A-rock.txt
        - hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/mcc/indexes/nonvocal-A-sertanejo.txt
        - hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/mcc/indexes/nonvocal-A-soundtrack.txt
        - hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/mcc/indexes/nonvocal-A-techno.txt
        - hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/mcc/indexes/nonvocal-A-traditional-chinese-folk.txt
        - hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/mcc/indexes/nonvocal-A-trance.txt
        - hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/mcc/indexes/nonvocal-A-trap-rap.txt
        - hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/mcc/indexes/nonvocal-A-world-music.txt
    sample_rate: !ref <extra_params[sample_rate]>
    duration: !ref <extra_params[duration]>
    audio_key: "audio.npy"
    # min_volume_threshold: !ref <run_opts[min_volume_threshold]>
    # loudness_ratio_threshold: !ref <run_opts[loudness_ratio_threshold]>
    # ar_filtering: !ref <ar_filtering>
    max_num_crops: 10
    avoid_vocal: False
    aed_filtered: False
    resampled: True
    shardshuffle: True
    use_pipe: True
    seed: !ref <seed>

validation_dataset: !new:recipes.musiclm.datasets.karaoke.KaraokeDataset
    urls: "pipe:hdfs dfs -cat hdfs://haruna/home/byte_data_seed/lf_lq/speech/music/karaoke_for_singsong/shards-0131.tar"
    nodesplitter: !name:recipes.musiclm.datamodules.webdataset.return_self
    sample_rate: !ref <extra_params[sample_rate]>
    duration: !ref <extra_params[duration]>
    min_volume_threshold: !ref <run_opts[min_volume_threshold]>

pl_datamodule: !new:recipes.musiclm.datamodules.webdataset.DataModule
    train_dataset: !ref <train_dataset>
    validation_dataset: !ref <validation_dataset>
    batch_size: !ref <run_opts[batch_size]>
    shuffle_buffer_size: !ref <run_opts[shuffle_buffer]>
    num_workers: !ref <run_opts[num_workers]>
    train_keys: !ref <extra_params[dataset_return_keys]>
    val_keys: !ref <extra_params[dataset_return_keys]>
    predict_keys: !ref <extra_params[dataset_return_keys]>
    return_dict: True
    pin_memory: True

model_config: !new:transformers.LlamaConfig
    vocab_size: !ref <extra_params[wav2vec_codebook_size]> + <extra_params[mulan_num_rvq]> * <extra_params[mulan_codebook_size]> + 1
    hidden_size: 1536
    intermediate_size: 4608
    num_hidden_layers: 24
    num_attention_heads: 12
    hidden_act: "silu"
    max_position_embeddings: !ref <extra_params[mulan_num_rvq]> + <extra_params[wav2vec_frame_rate]> * <extra_params[duration]>
    initializer_range: 0.02
    rms_norm_eps: 1e-6
    use_cache: False
    num_logits: !ref <extra_params[wav2vec_codebook_size]>

model_cls: !name:samantha.models.flash_llama.LlamaForCausalLM
    config: !ref <model_config>

optimizer_cls: !name:torch.optim.AdamW
    lr: !ref <run_opts[learning_rate]>
    weight_decay: !ref <run_opts[weight_decay]>
    betas: [0.9, 0.96]
    eps: 0.00000001

scheduler_cls: !name:recipes.musiclm.optim.lr_scheduler.warmup_cosine_lr.WarmupCosine
    init_lr: !ref <run_opts[learning_rate]>
    warmup_steps: !ref <run_opts[warmup_steps]>
    cycle_steps: !ref <run_opts[cycle_steps]>
    min_lr: !ref <run_opts[learning_rate]> * 0.1

pl_module: !new:recipes.musiclm.lightning.rlhf.SemanticSequenceTrainingModule
    checkpointing: !ref <_checkpointing>
    model_cls: !ref <model_cls>
    optimizer_cls: !ref <optimizer_cls>
    scheduler_cls: !ref <scheduler_cls>
    extra_params: !ref <extra_params>
    seed_model: "hdfs://haruna/home/byte_speech_sv/andrew.shaw/data/rlhf/semantic/step=091000-tr_loss=2.4243-val_loss_0=2.8712.ckpt"
    # seed_model: "hdfs://haruna/home/byte_speech_sv/andrew.shaw/data/rlhf/semantic/step=074000-tr_loss=2.4663-val_loss_0=2.8524.ckpt"
    # seed_model: null
    required_modules:
        mulan:
            - hdfs://haruna/home/byte_speech_sv/andrew.shaw/data/rlhf/mulan/mulan-step=036000-median_rank_0=127-kaggle.ckpt
            - !name:recipes.musiclm.requires.model_initializer.init_mulan
              cache_dir: !ref <run_opts[cache_dir]>
              version: "g4"
        mulan_centers:
            - hdfs://haruna/home/byte_speech_sv/andrew.shaw/data/rlhf/mulan/kmeans_minibatch_codebook-mulan1b_g4_mix_127-1024x12.npy
            - !name:recipes.musiclm.requires.model_initializer.init_mulan_centers
              cache_dir: !ref <run_opts[cache_dir]>
        diffusion:
            - hdfs://haruna/home/byte_speech_sv/andrew.shaw/data/rlhf/diffusion/diffusion-step=459999.ckpt
            - !name:recipes.diffusion.rl_inference.init_diffusion
              cache_dir: !ref <run_opts[cache_dir]>
        vocoder:
            - hdfs://haruna/home/byte_speech_sv/andrew.shaw/data/rlhf/diffusion/soundstream-step=592799-val_sdr=12.1354.ckpt
            - !name:recipes.diffusion.rl_inference.init_vocoder
              cache_dir: !ref <run_opts[cache_dir]>
        wav2vec:
            - hdfs://haruna/home/byte_speech_sv/andrew.shaw/data/rlhf/wav2vec/semantic.jit.pt
            - !name:recipes.musiclm.requires.model_initializer.init_wav2vec
              cache_dir: !ref <run_opts[cache_dir]>
        semantic_centers:
            - hdfs://haruna/home/byte_speech_sv/andrew.shaw/data/rlhf/wav2vec/centroids_epoch_10.npy
            - !name:recipes.musiclm.requires.model_initializer.init_semantic_centers
              cache_dir: !ref <run_opts[cache_dir]>

logger:
    - !new:pytorch_lightning.loggers.tensorboard.TensorBoardLogger
      save_dir: !ref <run_opts[log_dir]>
      name: !ref <run_opts[log_name]>
      version: !ref <run_opts[version]>
      default_hp_metric: False
    - !new:pytorch_lightning.loggers.wandb.WandbLogger
      save_dir: !ref <run_opts[log_dir]>
      project: !ref <run_opts[log_name]>
      name: !ref <run_opts[version]>


hdfs_model_ckpt: !new:samantha.callbacks.HDFSModelCheckpoint
    monitor: step
    save_top_k: 50
    every_n_train_steps: !ref <run_opts[val_check_interval]>
    mode: max
    filename: "{step:06d}"

callbacks:
    - !new:pytorch_lightning.callbacks.ModelCheckpoint
      monitor: step
      save_top_k: 50
      every_n_train_steps: !ref <run_opts[val_check_interval]>
      mode: max
      filename: "{step:06d}"
    - !ref <hdfs_model_ckpt>
    - !new:recipes.musiclm.callbacks.checkpoints.ModelCheckpointSaveStep0
    - !new:pytorch_lightning.callbacks.LearningRateMonitor
      logging_interval: 'step'
    - !new:recipes.musiclm.callbacks.loggers.LogGradientScalerCallback

plugins:
    - !new:samantha.plugins.torch_io.LargeTorchCheckpointIO

trainer: !new:pytorch_lightning.Trainer
    strategy: "ddp_find_unused_parameters_false"
    fast_dev_run: !ref <run_opts[fast_dev_run]>
    logger: !ref <logger>
    accelerator: !ref <run_opts[accelerator]>
    devices: 'auto'
    num_nodes: !apply:os.getenv ["ARNOLD_WORKER_NUM", 1]
    deterministic: False
    enable_model_summary: True
    log_every_n_steps: 10
    max_steps: !ref <run_opts[max_steps]>
    precision: !ref <run_opts[precision]>
    accumulate_grad_batches: 1
    gradient_clip_val: !ref <run_opts[gradient_clip_val]>
    val_check_interval: !ref <run_opts[val_check_interval]>
    check_val_every_n_epoch: null
    num_sanity_val_steps: 0
    callbacks: !ref <callbacks>
    plugins: !ref <plugins>
