---
################################################################################
##########                       BASIC CONFIGURATION                  ##########
################################################################################

data_params:
    sample_rate: 24000
    audio_segment_length_seconds: 10
    frame_rate: 80
    n_output_frames: 800  # NOTE: manually update with audio_segment_length_seconds * frame_rate
    n_audio_samples: 240000  # NOTE: manually update with audio_segment_length_seconds * sample_rate
    n_validation_samples: 60
    semantic_frame_rate: 25
    n_semantic_frames: 250  # NOTE: manually update with audio_segment_length_seconds * w2v_frame_rate(25)
    shard_lists:
        ["/mnt/bn/audio-diffusion/data/resso_mss_mulan149_shard_list.v3.txt"]
    shard_list_probs: [1.0]

# training parameters
training_params:
    max_steps: 1000000
    batch_size: 2
    valid_batch_size: 1
    base_lr: 0.0004
    warmup_steps: 5000
    hold_steps: 50000
    decay_steps: 3000000
    weight_decay: 0.01
    shuffle_buffer: 200

soundstream_params:
    start_channel: 0
    end_channel: 2

ckpt_path: null

# running parameters
log_dir: !apply:os.getenv ["ARNOLD_OUTPUT", "logs"]
run_opts:
    fast_dev_run: False
    tensorboard_dir: !ref <log_dir>
    log_name: "singsong"
    version: "s2sa"
    precision: 32
    num_workers: 4
    accelerator: "auto"

seed: 0
__set_seed: !apply:pytorch_lightning.seed_everything [!ref <seed>]

################################################################################
##########                    TRAINING CONFIGURATION                  ##########
################################################################################
demo_params:
    num_demos: 2
    max_demos_per_step: 1
    temperature: 0.8

encoder_transform:
    !new:recipes.audio_diffusion.modules.transforms.encoder.SoundStreamTransform
    sample_rate: !ref <data_params[sample_rate]>
    n_output_frames: !ref <data_params[n_output_frames]>

audio_transforms:
    !new:recipes.audio_diffusion.modules.transforms.singsong.SingSongTransforms
    audio_key: "acc.npy"
    audio_key2: "vocal.npy"
    semantic_key: "acc_semantic_tok.npy"
    semantic_key2: "vocal_semantic_tok.npy"
    sample_range_key: "acc_sample_range.npy"
    sample_range_key2: "vocal_sample_range.npy"
    sample_rate: !ref <data_params[sample_rate]>
    soundstream_frame_rate: !ref <data_params[frame_rate]>
    semantic_frame_rate: !ref <data_params[semantic_frame_rate]>
    n_samples: !ref <data_params[n_audio_samples]>
    include_emb: False
    # reasonable approximation to -25db peak RMS amplitude in the paper
    min_volume_threshold: 0.05
    # Original paper sets it to 0.01. Set to 0 for Karaoke as is not MSS, so we don't need to cover artifacts
    white_noise_amplitude_stddev: 0.00
    vocal_relative_gain_threshold: 1.77

preprocessor:
    !new:recipes.audio_diffusion.modules.preprocess.WebDatasetBufferPreprocessor
    sample_rate: !ref <data_params[sample_rate]>
    transforms: !ref <audio_transforms>

train_web_dataset:
    !new:recipes.audio_diffusion.modules.datasets.webdataset_ext.MultiWebDataset
    urls: !apply:recipes.audio_diffusion.conf.parse_shard_list.get_train_shards
        - !ref <data_params[shard_lists]>
    probs: !ref <data_params[shard_list_probs]>
validation_web_dataset: !new:webdataset.WebDataset
    urls:
        !apply:recipes.audio_diffusion.conf.parse_shard_list.get_validation_shards
        - !ref <data_params[shard_lists]>
    nodesplitter: !name:recipes.audio_diffusion.helper.return_self
    shardshuffle: False

test_web_dataset: !new:webdataset.WebDataset
    urls:
        !apply:recipes.audio_diffusion.conf.parse_shard_list.get_validation_shards
        - !ref <data_params[shard_lists]>
    nodesplitter: !name:recipes.audio_diffusion.helper.return_self
    shardshuffle: False

train_dataset: !apply:samantha.utils.webdataset.apply_webdataset_pipeline
    wds_dataset: !ref <train_web_dataset>
    pipeline:
        - !name:webdataset.WebDataset.shuffle
          - !ref <training_params[shuffle_buffer]>
        - !name:webdataset.WebDataset.decode
        - !name:webdataset.WebDataset.compose
          - !name:recipes.audio_diffusion.modules.preprocess.WebDatasetBufferPreprocessor.train_buffer_preprocessor
            - !ref <preprocessor>
        - !name:webdataset.WebDataset.to_tuple
          - "audio.npy"
          - "audio2.npy"
          - "semantic.npy"
          - "semantic2.npy"
          - "audio_mix.npy"
        - !name:webdataset.WebDataset.batched
          - !ref <training_params[batch_size]>

validation_dataset: !apply:samantha.utils.webdataset.apply_webdataset_pipeline
    wds_dataset: !ref <validation_web_dataset>
    pipeline:
        - !name:webdataset.WebDataset.decode
        - !name:webdataset.WebDataset.compose
          - !name:recipes.audio_diffusion.modules.preprocess.WebDatasetBufferPreprocessor.train_buffer_preprocessor
            - !ref <preprocessor>
        - !name:webdataset.WebDataset.to_tuple
          - "audio.npy"
          - "audio2.npy"
          - "semantic.npy"
          - "semantic2.npy"
          - "audio_mix.npy"
        - !name:webdataset.WebDataset.batched
          - !ref <training_params[valid_batch_size]>
        - !name:webdataset.WebDataset.with_epoch
          - !ref <data_params[n_validation_samples]>

test_dataset: !apply:samantha.utils.webdataset.apply_webdataset_pipeline
    wds_dataset: !ref <test_web_dataset>
    pipeline:
        - !name:webdataset.WebDataset.decode
        - !name:webdataset.WebDataset.compose
          - !name:recipes.audio_diffusion.modules.preprocess.WebDatasetBufferPreprocessor.train_buffer_preprocessor
            - !ref <preprocessor>
        - !name:webdataset.WebDataset.to_tuple
          - "audio2.npy"
          - "semantic2.npy"
        - !name:webdataset.WebDataset.batched
          - !ref <training_params[valid_batch_size]>
        - !name:webdataset.WebDataset.with_epoch
          - !ref <data_params[n_validation_samples]>

pl_datamodule: !new:recipes.audio_diffusion.modules.pl_datamodule.WebDataModule
    train_dataset: !ref <train_dataset>
    validation_dataset: !ref <validation_dataset>
    test_dataset: !ref <test_dataset>
    batch_size: !ref <training_params[batch_size]>
    num_workers: !ref <run_opts[num_workers]>
    pin_memory: True

# model configuration
acoustic_token_model:
    !new:recipes.audio_diffusion.modules.model_types.singsong_transformer.SingSong
    max_sequence_length: !ref <data_params[n_output_frames]>
    semantic_tokens_length: !ref <data_params[n_semantic_frames]>
    transformer_emb_dim: 1024
    transformer_heads: 16
    transformer_layers: 8
    transformer_ff_dim: 4096
    start_channel: !ref <soundstream_params[start_channel]>
    end_channel: !ref <soundstream_params[end_channel]>
    use_gpt: False
    use_t5: True
    use_cond: False
    use_semantic_tokens: True
    use_target_semantic: True

# training module configuration
optimizer_class: !name:torch.optim.AdamW
    lr: !ref <training_params[base_lr]>
    weight_decay: !ref <training_params[weight_decay]>
    betas: (0.9, 0.98)

scheduler_class: !name:recipes.audio_diffusion.modules.lr_scheduler.TriStageLR
    warmup_steps: !ref <training_params[warmup_steps]>
    hold_steps: !ref <training_params[hold_steps]>
    decay_steps: !ref <training_params[decay_steps]>

pl_module: !new:recipes.audio_diffusion.modules.pl_module.SingSongLitModule
    acoustic_token_model: !ref <acoustic_token_model>
    optimizer_class: !ref <optimizer_class>
    scheduler_class: !ref <scheduler_class>
    cuda_transforms: !ref <encoder_transform>

logger: !new:pytorch_lightning.loggers.TensorBoardLogger
    save_dir: !ref <run_opts[tensorboard_dir]>
    name: !ref <run_opts[log_name]>
    version: !ref <run_opts[version]>

checkpoint: !new:pytorch_lightning.callbacks.ModelCheckpoint
    monitor: "loss/valid"
    mode: "min"
    save_last: True

lr_monitor: !new:pytorch_lightning.callbacks.LearningRateMonitor
    logging_interval: "step"

generate_demo:
    !new:recipes.audio_diffusion.modules.demo_callbacks.singsong.GenerateDemo
    num_demos: !ref <demo_params[num_demos]>
    sample_rate: !ref <data_params[sample_rate]>
    sample_length: !ref <data_params[n_output_frames]>
    encoder: !ref <encoder_transform>
    start_channel: !ref <soundstream_params[start_channel]>
    end_channel: !ref <soundstream_params[end_channel]>
    max_demos_per_step: !ref <demo_params[max_demos_per_step]>
    temperature: !ref <demo_params[temperature]>

trainer: !new:pytorch_lightning.Trainer
    strategy: "ddp"
    fast_dev_run: !ref <run_opts[fast_dev_run]>
    logger: !ref <logger>
    accelerator: !ref <run_opts[accelerator]>
    devices: "auto"
    num_nodes: !apply:samantha.utils.envs.getenv_int ["ARNOLD_WORKER_NUM", 1]
    deterministic: False
    enable_model_summary: False
    log_every_n_steps: 20
    max_steps: !ref <training_params[max_steps]>
    precision: !ref <run_opts[precision]>
    accumulate_grad_batches: 1
    auto_scale_batch_size: None
    gradient_clip_val: 1.0
    val_check_interval: 500
    check_val_every_n_epoch: null  # required now that we use an IterableDataset
    track_grad_norm: 2
    # num_sanity_val_steps: -1
    callbacks:
        - !ref <checkpoint>
        - !ref <lr_monitor>
        # - !ref <generate_demo>

################################################################################
##########                    PREDICTION CONFIGURATION                ##########
################################################################################
# TBD

################################################################################
##########                      EXPORT CONFIGURATION                  ##########
################################################################################
# TBD

profiler:
    enabled: False
    max_steps: 30
