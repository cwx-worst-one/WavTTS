---

################################################################################
##########                       BASIC CONFIGURATION                  ##########
################################################################################

hp: !include:../hparams_x480.yaml

seed: 9527
__set_seed: !apply:pytorch_lightning.seed_everything [!ref <seed>]

################################################################################
##########                    TRAINING CONFIGURATION                  ##########
################################################################################
run_opts:
    log_dir: /mnt/bn/cyz-lq-nas/work_dir/audiogpt
    # log_dir: /tmp/audiogpt  # 多机时只能最多一台机写nas
    fast_dev_run: False
    tensorboard_dir: !ref <run_opts[log_dir]>
    log_name: test0420_utu
    version: 0.4
    precision: 16
    accelerator: auto
    strategy: ddp_find_unused_parameters_false
    cache_dir: .module_cache/musiclm_3ar_1024x12
    profiler: simple
    flash_attn: null
    num_epochs: 1000
    batch_size: 64 # A100
    # batch_size: 16 # 16卡V100， total_bs=512
    num_workers: 8
    learning_rate: 0.0001
    weight_decay: 0.1
    checkpointing: False
    mulan_token_sep: True
    hdfs_path: null
    use_offline_token: True  
_checkpointing: !ref <run_opts[checkpointing]>

# gpt hyper-config
gpt_config: !new:transformers.GPT2Config
    # self.bpe_tokenizer.vocab_size + audio_tokens_num + 3 + 50
    vocab_size: 2077
    # vocab_size: 1024  # tokens class num !!!!!!
    n_positions: 768
    n_ctx: 768
    n_embd: 1024
    n_layer: 24
    n_head: 16
    activation_function: gelu_new
    resid_pdrop: 0.0
    embd_pdrop: 0.0
    attn_pdrop: 0.1
    norm_fn: "rms_norm" # layer_norm, rms_norm
    layer_norm_epsilon: 0.00001
    initializer_range: 0.02
    c_attn_bias: False
    pos_type: "rope_attn" # learnable, rope, rope_attn
    qk_bias: False
    # train_len for block sparse attention
    train_len: 288  
    layout_fn: "semantic_10s_layout"
    mask_file: "semantic_10s_mask.npy"
    use_cache: !apply:operator.not_ [!ref <_checkpointing>]

train_dataset: !new:recipes.speech_qa.datasets.OfflineTokensTextDataset
    bpe_tokenizer_file: /mnt/bn/cyz-lq-nas/project/samantha/recipes/speech_qa/datasets/train960_bpe1000.json
    audio_tokens_num: 1024 # hubert units num
    minn_audio_split: 25
    text_paths:
        - /mnt/bn/cyz-lq-nas/data_dir/text/librilight_text_addpunc.txt
    meta_paths:
        # - /mnt/bn/cyz-lq-nas/data_dir/audiogpt/tokens_1400h_valle_metalist.txt
        - /mnt/bn/cyz-lq-nas/data_dir/audiogpt/tokens_libri_light_metalist_0.txt
        - /mnt/bn/cyz-lq-nas/data_dir/audiogpt/tokens_libri_light_metalist_1.txt
        - /mnt/bn/cyz-lq-nas/data_dir/audiogpt/tokens_libri_light_metalist_2.txt
        - /mnt/bn/cyz-lq-nas/data_dir/audiogpt/tokens_libri_light_metalist_3.txt
        - /mnt/bn/cyz-lq-nas/data_dir/audiogpt/tokens_libri_light_metalist_4.txt
        - /mnt/bn/cyz-lq-nas/data_dir/audiogpt/tokens_libri_light_metalist_5.txt
        - /mnt/bn/cyz-lq-nas/data_dir/audiogpt/tokens_libri_light_metalist_6.txt
        - /mnt/bn/cyz-lq-nas/data_dir/audiogpt/tokens_libri_light_metalist_7.txt
        # - /mnt/bn/cyz-lq-nas/data_dir/audiogpt/tokens_libri_light_metalist.txt
    maxn_tokens_num: 750 # 50hz * 15s
    minn_tokens_num: 300 # 50hz * 6s


# dataloader configuration
train_dataloader: !new:torch.utils.data.DataLoader
    dataset: !ref <train_dataset>
    batch_size: !ref <run_opts[batch_size]>
    num_workers: !ref <run_opts[num_workers]>
    shuffle: True
    drop_last: True
    pin_memory: True

# datamodule configuration
pl_datamodule: !new:recipes.speech_qa.lit_modules.DataModule
    train_dataloader: !ref <train_dataloader>

# model configuration
model_cls: !name:recipes.speech_qa.modules.sparse_gpt2.GPT2LMHeadSparseModel
    config: !ref <gpt_config>
    flash_attn: !ref <run_opts[flash_attn]>
    logit_num: !ref <gpt_config[vocab_size]>
    use_cond: False
    cond_dim: 128
    cond_type: linear

# training module configuration
optimizer_cls: !name:torch.optim.AdamW
    lr: !ref <run_opts[learning_rate]>
    weight_decay: !ref <run_opts[weight_decay]>
    betas: [0.9, 0.95]
    eps: 0.00000001

_steps_per_epoch: !apply:operator.length_hint [!ref <train_dataloader>]
_world_size: !apply:recipes.speech_qa.utils.env.getenv_int ["WORLD_SIZE", 1]
scheduler_cls: !name:recipes.speech_qa.lr_schedulers.musiclm_lr_scheduler.WarmupCosine
    init_lr: !ref <run_opts[learning_rate]>
    warmup_steps: 2000
    cycle_steps: 1000000
    min_lr: !ref <run_opts[learning_rate]> * 0.1

# coarse model setting
# for 3AR, it needs Mulan, W2V, SoundStream
# for 2AR, it needs Mulan, SoundStream
pl_module: !new:recipes.speech_qa.lit_modules.audiogpt.lit_audiogpt_utu.SemanticModule
    checkpointing: !ref <run_opts[checkpointing]>
    model_cls: !ref <model_cls>
    optimizer_cls: !ref <optimizer_cls>
    scheduler_cls: !ref <scheduler_cls>
    criterion_cls: !name:recipes.speech_qa.modules.MaskedCrossEntropy
    extra_params: !ref <hp>
    use_offline_token: !ref <run_opts[use_offline_token]>
    required_modules:
        hubert:
            - hdfs://haruna/home/byte_speech_sv/user/chenyuanzhe/hubert/mhubert_v1_1024/
            - !name:recipes.speech_qa.requires.model_initializer.init_hubert
              cache_dir: !ref <run_opts[cache_dir]>

        # bshall_hubert:
        #     - hdfs://haruna/home/byte_speech_sv/user/chenyuanzhe/audiogpt/bshall_hubert/
        #     - !name:recipes.speech_qa.requires.model_initializer.init_bshall_hubert
        #       cache_dir: !ref <run_opts[cache_dir]>
              

logger: !new:pytorch_lightning.loggers.TensorBoardLogger
    save_dir: !ref <run_opts[tensorboard_dir]>
    name: !ref <run_opts[log_name]>cd 
    version: !ref <run_opts[version]>

callbacks:
    - !new:pytorch_lightning.callbacks.ModelCheckpoint
      every_n_train_steps: 1000
      mode: max
      save_last: True
      save_top_k: 1000
      save_on_train_epoch_end: True
      verbose: True
      monitor: accu
      filename: "{epoch:02d}-{step}-{accu:.2f}"
    - !new:pytorch_lightning.callbacks.LearningRateMonitor
      logging_interval: 'step'
    - !new:recipes.speech_qa.callbacks.hdfs_callback.HdfsSavingCallback
      hdfs_path: !ref <run_opts[hdfs_path]>
      save_dir: !ref <run_opts[tensorboard_dir]>
      name: !ref <run_opts[log_name]>
      version: !ref <run_opts[version]>
      n_log: 1000

trainer: !new:pytorch_lightning.Trainer
    fast_dev_run: !ref <run_opts[fast_dev_run]>
    logger: !ref <logger>
    accelerator: !ref <run_opts[accelerator]>
    devices: 'auto'
    num_nodes: !apply:samantha.utils.envs.getenv_int ["ARNOLD_WORKER_NUM", 1]
    deterministic: False  # warning: setting to True can cause slowdowns
    enable_model_summary: True
    log_every_n_steps: 50
    strategy: !ref <run_opts[strategy]>
    max_epochs: !ref <run_opts[num_epochs]>
    precision: !ref <run_opts[precision]>
    profiler: !ref <run_opts[profiler]>
    callbacks: !ref <callbacks>
    gradient_clip_val: 1.0
    track_grad_norm: 2.0

ckpt_path: null
