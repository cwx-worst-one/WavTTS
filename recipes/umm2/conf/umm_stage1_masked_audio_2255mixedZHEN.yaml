---
# @hanoihantrakul 9APR2024
# This training config exists because Ren Yi, Qingqing and myself were trying to
# ablate the effectiveness of the ConformerUMM, ConvUMM and DualUMM on the 
# downstream ZH Lyrics2Song task.
# 
# We wanted to train from scratch Stage1, Stage2 and Stage3 model using new data
# from Parquet ID 2255. 
#
# In order to create this stage1 training YAML, I had to consult YAML's which I did not own or create.
# I used settings from `umm_stage1_sstk.yaml` and also cross checked with 
# `umm_stage1_zh.yaml` and `stage1_music.yaml`. These stage1 trainings
# do not have any tokenizers engaged because it is all just pre-training BEST-RQ
# Regardless of whether stage2 is instrumental or has vocals, stage1 is just masked
# pretraining. Hence, stage1 is the same regardless.
#
# Param count is 647M
#
### Implementation notes
# 12APR2024
# Devon Sun ran an analysis for me. 2255 contains only data from 0-60s. Nothing longer.
# pl_module.max_duration = 60
#
#
# 11APR2024
# Ran an ablation and recommend (see below for explanation)
# run_opts.batch_size = 8
# pl_module.max_duration = 90
# trainer.limit_train_batches: 5000
# run_opts.shuffle_buffer: 800
#
# 10APR2024
# I incorrectly understood the meaning of `batch_size` (which was badly named in the 
# dataloader), it actually means `total number of audio samples being loaded into memory`.
#
# batch_size: !ref <run_opts[batch_size]> * <pl_datamodule[max_duration]> * <extra_params[sample_rate]>
#
# The previous setting of batch_size=2 and max_duration=90 is actually the same as
# batch_size=4 and max_duration=45. The difference is not in the GPU memory, but how the dataloader
# `MixMSSDataModule` handles the data. If all your data is below 40s, then it makes sense to
# to use max_duration=45. If you have data that goes up to 60s, then data between
# 40s-60s will be filereted out when max_duration=45. If max_duation=90, then there will be buckets
# correctly allocated for the data in the range 40-60s. 
#
# Even when you correctly set batch_size=4 and max_duration=90, OOM can still happen.
# This is not related to GPU memory but system memory. You need to make sure:
#
# trainer.limit_train_batches: 10000 or 5000 to force memory to reset after epoch ends 
# run_opts.shuffle_buffer: 800 so that not too much audio data is held in memory
#
# 9APR2024 - ignore statement below, see above for why I was incorrect
# With `max_duration=45` and `batch_size=16` I can achieve a healthy `training/mem_gb=65.40`

################################################################################
##########                       BASIC CONFIGURATION                  ##########
################################################################################

ckpt_path: !ref last.ckpt

seed: 555
__set_seed: !apply:pytorch_lightning.seed_everything [!ref <seed>]
__set_float32_matmul_precision: !apply:torch.set_float32_matmul_precision ['high']

extra_params:
    sample_rate: 24000
    frame_rate: 25
    n_mels: 128
    n_fft: 2048
    win_length: 2048
    hop_length: 240
    feature_cmvn: "recipes/datasets/mcc/data_ids=794.stats.pt" # we need this because original mkii ConformerUMM normalized using these statistics
    tokenizer: null # Remember that stage1 training in mkii conformer is just BESTRQ applied to audio

# running parameters
run_opts:
    fast_dev_run: False
    cache_dir: .module_cache/umm
    hdfs_log_dir: "hdfs:///home/byte_speech_sv/ju-chiang.wang/logs"
    log_dir: logs
    log_name: umm2_conformer_2255mixedZHEN
    version: !ref stage1_masked_audio_<config[rq_codebook_size]>x<config[rq_codebook_dim]>x<config[rq_codebook_num]>
    precision: "16-mixed"
    num_workers: 4
    accelerator: auto
    warmup_steps: 2000
    max_steps: 10000000
    val_check_interval: 5000 # will be overrided by Trainer.limit_val_batches = 0
    ckpt_interval: 5000
    batch_size: 8 # See above comments on why I picked this number
    learning_rate: 3.0e-4
    cycle_steps: 200000
    weight_decay: 0.1
    shuffle_buffer: 800 # 8000 # See above comments on why I picked this number
    gradient_clip_val: 1.0
    checkpointing: False

################################################################################
##########                    TRAINING CONFIGURATION                  ##########
################################################################################

pl_datamodule: !new:recipes.datasets.mcc.mix_mkii.MixDataModule
    data_ids: [2255]
    val_data_id: 2255
    data_weights: [1]
    shuffle_buffer_size: !ref <run_opts[shuffle_buffer]>
    sample_rate: !ref <extra_params[sample_rate]>
    batch_size: !ref <run_opts[batch_size]> * <pl_datamodule[max_duration]> * <extra_params[sample_rate]>
    num_workers: !ref <run_opts[num_workers]>
    max_num_crops: null
    min_duration: 1
    max_duration: 60 # 12APR2024 Hanoi and Devon Sun and I manually verified this datasert only contains audio lengths between 0-60s.
    normalize_audio: False
    tokenizer: !ref <extra_params[tokenizer]>
    frame_rate: !ref <extra_params[frame_rate]>
    collate_fn: !name:recipes.datasets.mcc.mix.collate_audio

optimizer_cls: !name:torch.optim.AdamW
    lr: !ref <run_opts[learning_rate]>
    weight_decay: !ref <run_opts[weight_decay]>
    betas: [0.9, 0.96]
    eps: 0.00000001

scheduler_cls: !name:recipes.umm2.modules.lr_scheduler.WarmupCosine
    init_lr: !ref <run_opts[learning_rate]>
    warmup_steps: !ref <run_opts[warmup_steps]>
    cycle_steps: !ref <run_opts[cycle_steps]>
    min_lr: !ref <run_opts[learning_rate]> * 0.1

config: !new:recipes.umm2.models.config.UMMConfig
    feature_cmvn: !ref <extra_params[feature_cmvn]>
    sample_rate: !ref <extra_params[sample_rate]>
    n_mels: !ref <extra_params[n_mels]>
    n_fft: !ref <extra_params[n_fft]>
    win_length: !ref <extra_params[win_length]>
    hop_length: !ref <extra_params[hop_length]>
    hidden_size: 1024
    intermediate_size: 4096
    num_hidden_layers: 24
    num_attention_heads: 8
    max_source_positions: 2500
    mask_hop: 0.4
    mask_prob: 0.2
    rq_codebook_dim: 16
    rq_codebook_size: 4096
    rq_codebook_num: 8
    rq_input_layernorm: False
    add_vq: False
    vq_layer_idx: 12
    vq_codebook_size: 32768
    vq_codebook_dim: 32
    vq_decay: 0.99
    w_loss_mel: 1.0
    w_loss_chroma: 1.0
    w_loss_vq: 1.0
    w_loss_ctc: 1.0
    tokenizer: !ref <extra_params[tokenizer]>
    frame_rate: !ref <extra_params[frame_rate]>
    vocab_size: 105880
    ctc_blank_id: 105879
    ctc_zero_infinity: True
    use_bn: False
    mask_mel: False


stage1: !name:recipes.umm2.models.tasks.masked_rq_predict.Masked_RQ
    config: !ref <config>
    takes: [audio]
    provides: [mel, rq_logits, rq_target, accu] 

model: !name:recipes.umm2.models.base.PipelineModel
  input_names: [audio]
  output_names: [mel, rq_logits, rq_target, flops, loss, accu] 
  stages:
      - !ref <stage1>


pl_module: !new:recipes.umm2.modules.stages.stage1.Stage1
    checkpointing: !ref <run_opts[checkpointing]>
    config: !ref <config>
    model_cls: !ref <model>
    optimizer_cls: !ref <optimizer_cls>
    scheduler_cls: !ref <scheduler_cls>
    extra_params: !ref <extra_params>

logger:
    - !new:pytorch_lightning.loggers.wandb.WandbLogger
      save_dir: !ref <run_opts[log_dir]>
      project: !ref <run_opts[log_name]>
      name: !ref <run_opts[version]>

callbacks:
    - !new:samantha.callbacks.HDFSModelCheckpoint
      hdfs_path: !ref <run_opts[hdfs_log_dir]>/<run_opts[log_name]>/<run_opts[version]>
      monitor: step
      save_top_k: 10
      every_n_train_steps: !ref <run_opts[ckpt_interval]>
      mode: max
      filename: "{step:07d}"
      save_last: True
    - !new:pytorch_lightning.callbacks.LearningRateMonitor
      logging_interval: 'step'

plugins:
    - !new:samantha.plugins.LargeTorchCheckpointIO

trainer: !new:pytorch_lightning.Trainer
    strategy: "ddp_find_unused_parameters_false"
    fast_dev_run: !ref <run_opts[fast_dev_run]>
    logger: !ref <logger>
    accelerator: !ref <run_opts[accelerator]>
    devices: "auto"
    num_nodes: !apply:os.getenv ["ARNOLD_WORKER_NUM", 1]
    deterministic: False
    enable_model_summary: True
    log_every_n_steps: 100
    max_steps: !ref <run_opts[max_steps]>
    precision: !ref <run_opts[precision]>
    accumulate_grad_batches: 1 # TODO
    gradient_clip_val: !ref <run_opts[gradient_clip_val]>
    val_check_interval: !ref <run_opts[val_check_interval]>
    check_val_every_n_epoch: null
    num_sanity_val_steps: 0
    limit_val_batches: 0
    limit_train_batches: 5000 # 10000 # Consult Colin Wang: forces an epoch to end every 10k steps and prevent OOM # See above comments on why I picked this number
    sync_batchnorm: True
    benchmark: False
    callbacks: !ref <callbacks>
    plugins: !ref <plugins>
