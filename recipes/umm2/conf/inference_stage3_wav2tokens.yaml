---
################################################################################
##########                       BASIC CONFIGURATION                  ##########
################################################################################

seed: 555
__set_seed: !apply:pytorch_lightning.seed_everything [!ref <seed>]
__set_float32_matmul_precision: !apply:torch.set_float32_matmul_precision ['high']


audio:
    sampling_rate: 24000        # sampling rate for audio
    sample_len: 30.0            # for tagging model
    max_duration: 60            # for pretraining
    frame_rate: 25

# Copied over from `umm_stage3_mix.yaml` `config` setting.
config: !new:recipes.umm2.models.config.UMMConfig
    feature_cmvn: "recipes/datasets/mcc/data_ids=794.stats.pt"
    sample_rate: !ref <audio[sampling_rate]>
    sample_len: !ref <audio[sample_len]> # for tagging model
    n_mels: 128
    add_chroma: True
    add_ctc: True # There is a EN and CN speech. CTC turned on.
    n_chroma: 12
    n_fft: 2048
    win_length: 2048
    hop_length: 240
    hidden_size: 1024
    intermediate_size: 4096
    num_hidden_layers: 24
    num_attention_heads: 8
    max_source_positions: !ref <audio[frame_rate]> * <audio[max_duration]>
    add_vq: True
    vq_type: null # this will default to EMAVectorQuantizer()
    vq_proj_norm: "bn"
    vq_proj_noise: 10000
    vq_codebook_size: 32768
    vq_codebook_dim: 32
    vq_layer_idx: 12
    vq_decay: 0.99
    tokenizer: null
    frame_rate: !ref <audio[frame_rate]>
    vocab_size: 105880
    ctc_blank_id: 105879
    ctc_zero_infinity: True
    use_bn: False

# c_vq: !new:recipes.umm.models.tasks.vq_module.ClusteredVectorQuantizer
#     codebook_size: !ref <config[vq_codebook_size]>
#     codebook_dim: !ref <config[vq_codebook_dim]>
#     distance: "cos"

# fsq: !new:recipes.umm.models.tasks.vq_module.FiniteScalarQuantizer
#     codebook_size: !ref <config[vq_codebook_size]>

# lfq: !new:recipes.umm.models.tasks.vq_module.LookupFreeQuantizer
#     codebook_size: !ref <config[vq_codebook_size]>

# ema_entropy: !new:recipes.umm.models.tasks.vq_module.EMAVectorQuantizerEntropy
#     codebook_size: !ref <config[vq_codebook_size]>
#     codebook_dim: !ref <config[vq_codebook_dim]>
#     decay: !ref <config[vq_decay]>

ema_vq: !new:recipes.umm2.models.tasks.vq_module.EMAVectorQuantizer
    codebook_size: !ref <config[vq_codebook_size]>
    codebook_dim: !ref <config[vq_codebook_dim]>
    decay: !ref <config[vq_decay]>
    dist: False

vq_module: !new:recipes.umm2.models.tasks.vq_module.VQ  # BaseStage
    task: "vq"
    config: !ref <config>
    takes: [latent]
    provides: [latent, vq_ids]
    vq_scheme: !ref <ema_vq>

# IMPORTANT: pretrain and fietune ue different lengths
frontend: !new:recipes.mir2.models.umm_vq_frozen.AE_UMM # finetune post-vq layers
    config: !ref <config>
    takes: [audio]
    provides: [latent, vq_ids]
    loss_weight: null
    is_frozen: True
    is_train: False
    token_only: True
    pre_vq_latent: False
    insert_modules:
        12: !ref <vq_module> # at layer 12

required_modules:
    pretrained: 
        ckpt_path: "hdfs://haruna/home/byte_speech_sv/ju-chiang.wang/logs/umm2_conformer_2255mixedZHEN/stage3_hpss_onset_2255mixedZHEN_2375Speech_optim_mem_bert-base-multilingual-uncased_None32768x32/checkpoints/step=0325000.ckpt"
        loader: !name:recipes.umm2.loaders.stage3.ModelLoader
        cache_dir: ".module_cache/umm"

