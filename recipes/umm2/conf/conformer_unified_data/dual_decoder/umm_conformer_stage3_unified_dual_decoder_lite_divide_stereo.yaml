---
# @hanoihantrakul 18APR2024
# This training config exists because Ren Yi, Qingqing and myself were trying to
# ablate the effectiveness of the ConformerUMM, ConvUMM and DualUMM on the 
# downstream ZH Lyrics2Song task.
# 
# We wanted to train from scratch Stage1, Stage2 and Stage3 model using new data
# from Parquet ID 2255. 
#
# There are two configurations for this model:
# `umm_stage3_2255mixedZHEN.yaml` which trains on 2255mixedZHEN only <-- This config
# `umm_stage3_2255mixedZHEN+2375Speech.yaml` which takes trains on additional speech data. This makes the model more comparable to old MixUMM model.
#
# The associated stage2 config is `umm_stage2_2255mixedZHEN.yaml`
# This model has 723M params.
# With batch_size=6 and max_duration=60 I can get 66.20GB GPU utilization.
#


################################################################################
##########                       BASIC CONFIGURATION                  ##########
################################################################################

ckpt_path: !ref last.ckpt

seed: 555
__set_seed: !apply:pytorch_lightning.seed_everything [!ref <seed>]
__set_float32_matmul_precision: !apply:torch.set_float32_matmul_precision ['high']

extra_params:
    sample_rate: 24000
    frame_rate: 25
    n_mels: 128
    n_chroma: 12
    n_fft: 2048
    win_length: 2048
    hop_length: 240
    feature_cmvn: "recipes/datasets/mcc/data_ids=794.stats.pt" # we need this because original mkii ConformerUMM normalized using these statistics
    tokenizer: "bert-base-multilingual-uncased"
    ctc_downsample: true
    ctc_downsample_rate: 2
    ctc_downsample_type: temporal
    ctc_ignore_empty: true
    min_duration: 5
    max_duration: 60
    umm_pretrained: hdfs://haruna/home/byte_data_seed/lf_lq/speech/user/qinxin.025/logs/stage2/lite_fused_dual_decoder_SD6_AD12_orth1_VQproj_FixedSf0crmCTC_Amel_bucket1680k/checkpoints/step=0055000.ckpt
    pitchpdt: hdfs://harunawl/home/byte_data_seed_wl/speech/user/rui.xia/bigmusic/experiments/umm2/misc/perceptual_pitch_model_1_26_2024.pt
    use_consistency_loss: False
    consistency_loss_weight: 0.1
    consistency_chunk_ratio: 0.2
    vq_distance_type: "euclidean"  #["cosine", "euclidean", "dot_product"]
    vq_codebook_size: 16384
    num_segments: 3


# running parameters
run_opts:
    fast_dev_run: False
    cache_dir: .module_cache/umm
    hdfs_log_dir: "hdfs://harunawl/home/byte_data_seed_wl/speech/user/qinxin.025/logs/"
    log_dir: logs
    log_name: umm2_conformer_2255mixedZHEN
    version: !ref stage3_reg1_2255mixedZHEN_2375Speech_optim_mem_<extra_params[tokenizer]>_<config[vq_type]><config[vq_codebook_size]>x<config[vq_codebook_dim]>
    precision: "16-mixed"
    num_workers: 4
    accelerator: auto
    warmup_steps: 2000
    max_steps: 5000000
    val_check_interval: 5000 # 14APR2024 @hanoihantrakul set limit_train_val_batches=1 so that validation loop is called
    ckpt_interval: 5000
    batch_size: 5 # There are VQ params so have to reduce memory
    learning_rate: 3.0e-5
    cycle_steps: 30000
    weight_decay: 0.1
    shuffle_buffer: 10 #800 # 8000 # See above comments on why I picked this number
    gradient_clip_val: 1.0
    checkpointing: False
    use_fused_kernel: False
    # num_spectrogram_val_samples_for_plotting: 8 # As of 13APR2024 This new flag controls the number of spectrograms from the validation dataset to plot to Merlin

################################################################################
##########                    TRAINING CONFIGURATION                  ##########
################################################################################
data:
  save_ckpt_interval: 10000
  train_dataset_ids: ["CN:9824", "CN:9825", "CN:13588", "CN:9806", "CN:9807", "CN:2375"]
  #train_dataset_ids: [9824,9825,13588,9806,9807,2375]
  train_dataset_weights: [3,3,2,4,4,1]
  val_dataset_ids: ["CN:9407"]
  val_dataset_weights: [1]
  predict_dataset_ids: []
  predict_dataset_weights: []

  train_batcher:
    type: "HierarchicalTokenBucketBatcher"
    dynamic_batch: True
    bucket_schedule_key: "audio_shape"
    bucket_secondary_key: "text_length"
    instrumental_target_ratio: 6.0
    buckets:
      [
        120000,
        240000,
        360000,
        480000,
        600000,
        720000,
        840000,
        960000,
        1080000,
        1200000,
        1320000,
        1440000,
        1560000,
        1680000,
        1800000,
        1920000,
        2040000,
        2160000,
        2280000,
        2400000,
        2880000,
      ]
    maximum_bucket_size: 14400000 #  10min

  val_batcher:
    type: "HierarchicalTokenBucketBatcher"
    dynamic_batch: True
    bucket_schedule_key: "audio_shape"
    bucket_secondary_key: "text_length"
    instrumental_target_ratio: 6.0
    buckets:
      [
        120000,
        240000,
        360000,
        480000,
        600000,
        720000,
        840000,
        960000,
        1080000,
        1200000,
        1320000,
        1440000,
        1560000,
        1680000,
        1800000,
        1920000,
        2040000,
        2160000,
        2280000,
        2400000,
        2880000,
      ]
    maximum_bucket_size: 1440000 #  10min

  train_item_transform: # This is correctly indented
    - type: "ConvertMetaToDict"
    - type: "MusicParser"
      in_key: "audio"
      out_key: "audio"
      min_len: 1.0
      max_len: 800.0 #second
      stereo: True
    - type: "NormalizeAudioToFloat32"
      in_key: "audio"
      out_key: "audio"
    - type: "MusicWavResample"
      key: "audio"
      sample_rate: 24000
    - type: "CheckDataType"
      out_key: "data_type"
    - type: "UtteranceSegmentSampler"
      out_key: "audio_slice"
      num_segments: !ref <extra_params[num_segments]> # get number of data from one audio to
      full_song: True
      min_duration: !ref <extra_params[min_duration]> # min_duration 20 seconds
      max_duration: !ref <extra_params[max_duration]> # max_duration 2 min (2b conformer maxinput)
    - type: "SongSliceAudioCutWithMetaData"
      in_key: "audio_slice"
      out_key: "audio_slice"
      duration_leeway_in_s: 2.0
    - type: "MusicMetaRWTransform"
      in_key: "audio_slice"
      out_key: null
      overwrite_item: true
      maybe_return_list_output: true

    - type: "TextNormalizer"
      in_key: "text"

    - type: "SanityCheck"
      keys: ["uttid","audio","meta","data_type","text", "audio_shape"]

  train_batch_transform: # <-- This should be here, at the same level as train_item_transform
    - type: AudioCollate
      in_key: "audio"
      length_key: "audio_length" #output audio_length
      stereo: True  # here output stereo 24k audio data
      pad_value: 0.0

    - type: NestListCollate
      key_list: ["uttid","data_type","text","crs_filename"]
      to_tensor: False
    
    - type: MixTokenCollate
      in_key: "text"
      out_key: "token"
      bpe_tokenizer_path: "/opt/tiger/tokenizer/bert-base-multilingual-uncased"
  
  val_item_transform: # This is correctly indented
    - type: "ConvertMetaToDict"
    - type: "MusicParser"
      in_key: "audio"
      out_key: "audio"
      min_len: 1.0
      max_len: 800.0 #second
    - type: "NormalizeAudioToFloat32"
      in_key: "audio"
      out_key: "audio"
    - type: "MusicWavResample"
      key: "audio"
      sample_rate: 24000
    - type: "CheckDataType"
      out_key: "data_type"
    - type: "UtteranceSegmentSampler"
      out_key: "audio_slice"
      num_segments: 1 # get number of data from one audio
      full_song: True
      min_duration: !ref <extra_params[min_duration]> # min_duration 20 seconds
      max_duration: !ref <extra_params[max_duration]> # max_duration 2 min (2b conformer maxinput)
    - type: "SongSliceAudioCutWithMetaData"
      in_key: "audio_slice"
      out_key: "audio_slice"
      duration_leeway_in_s: 0.0
    - type: "MusicMetaRWTransform"
      in_key: "audio_slice"
      out_key: null
      overwrite_item: true
      maybe_return_list_output: true

    - type: "TextNormalizer"
      in_key: "text"

    - type: "SanityCheck"
      keys: ["uttid","audio","meta","data_type","text", "audio_shape"]


  val_batch_transform: # <-- This should be here, at the same level as train_item_transform
    - type: AudioCollate
      in_key: "audio"
      length_key: "audio_length" #output audio_length
      pad_value: 0.0

    - type: NestListCollate
      key_list: ["uttid","data_type","text","crs_filename"]
      to_tensor: False
    
    - type: MixTokenCollate
      in_key: "text"
      out_key: "token"
      bpe_tokenizer_path: "/opt/tiger/tokenizer/bert-base-multilingual-uncased"
  

pl_datamodule: !new:samantha.dataio.bigmusic.lite.MusicLiteDataModule
  train_dataset_ids: !ref <data[train_dataset_ids]>
  train_dataset_weights: !ref <data[train_dataset_weights]>
  train_item_transform: !ref <data[train_item_transform]>
  train_batcher: !ref <data[train_batcher]>
  train_batch_transform: !ref <data[train_batch_transform]>
  val_dataset_ids: !ref <data[val_dataset_ids]>
  val_dataset_weights: !ref <data[val_dataset_weights]>
  val_item_transform: !ref <data[val_item_transform]>
  val_batcher: !ref <data[val_batcher]>
  val_batch_transform: !ref <data[val_batch_transform]>
  save_ckpt_interval: null # using trainer val_check_interval


optimizer_cls: !name:torch.optim.AdamW
    lr: !ref <run_opts[learning_rate]>
    weight_decay: !ref <run_opts[weight_decay]>
    betas: [0.9, 0.96]
    eps: 0.00000001


scheduler_cls: !name:recipes.umm2.modules.lr_scheduler.WarmupCosine
    init_lr: !ref <run_opts[learning_rate]>
    warmup_steps: !ref <run_opts[warmup_steps]>
    cycle_steps: !ref <run_opts[cycle_steps]>
    min_lr: !ref <run_opts[learning_rate]> * 0.1

# Copied over from `umm_stage3_mix.yaml` `config` setting.
config: !new:recipes.umm2.models.config.UMMConfig
    feature_cmvn: !ref <extra_params[feature_cmvn]>
    sample_rate: !ref <extra_params[sample_rate]>
    n_mels: !ref <extra_params[n_mels]>
    add_chroma: True
    add_ctc: True # There is a EN and CN speech. CTC turned on.
    n_chroma: !ref <extra_params[n_chroma]>
    n_fft: !ref <extra_params[n_fft]>
    win_length: !ref <extra_params[win_length]>
    hop_length: !ref <extra_params[hop_length]>
    hidden_size: 1024
    intermediate_size: 4096
    num_hidden_layers: 24
    num_attention_heads: 8
    max_source_positions: 2500
    add_vq: True
    rvq: 2
    vq_type: "EMARPSimple"
    stale_tolerance: 100
    vq_proj_noise: 10000
    vq_codebook_size: !ref <extra_params[vq_codebook_size]>
    vq_codebook_dim: 32
    vq_layer_idx: 12
    vq_decay: 0.99
    vq_distance_type: !ref <extra_params[vq_distance_type]>
    use_consistency_loss: !ref <extra_params[use_consistency_loss]>
    consistency_loss_weight: !ref <extra_params[consistency_loss_weight]>
    consistency_chunk_ratio: !ref <extra_params[consistency_chunk_ratio]>
    w_loss_mel: 1.0
    w_loss_chroma: 1.0
    w_loss_vq: 1.0
    w_loss_ctc: 1.0
    w_loss_f0: 1.0
    tokenizer: !ref <extra_params[tokenizer]>
    frame_rate: !ref <extra_params[frame_rate]>
    vocab_size: 105880
    use_bn: False
    ### 5JUL2024 @hanoihantrakul According to the Merlin Job Li Tang uses the following settings `first_conformer`, `act_fn`, `mask_mel`, `rope_enhance_pos`
    first_conformer: True 
    act_fn: "gelu" 
    mask_mel: False  
    rope_enhance_pos: 7500 # 300s*25Hz
    rotary_embedding_base: 10000
    hidden_dropout: 0.0
    activation_dropout: 0.0
    attention_dropout: 0.0
    conformer_conv_dropout: 0.0
    ### for ctc loss
    ctc_loss_reduction: 'mean'
    head_output_norm: True
    ctc_downsample: !ref <extra_params[ctc_downsample]>
    ctc_downsample_rate: !ref <extra_params[ctc_downsample_rate]>
    ctc_downsample_type: !ref <extra_params[ctc_downsample_type]>
    ctc_blank_id: 105879
    ctc_zero_infinity: True
    ctc_ignore_empty: !ref <extra_params[ctc_ignore_empty]>
    ###
    use_fused_kernel: !ref <run_opts[use_fused_kernel]>

    # ============================== #
    ### for dual decoder ###
    semantic_decoder_num_hidden_layers: 4
    # here support 2 types of dual decoder quantization
    # 1) *separate VQ* for semantic decoder and acoustic decoder
    semantic_decoder_vq_type: "separate_EMARP" # divide by "_"
    # 2) *shared RVQ* for semantic decoder and acoustic decoder
    # semantic_decoder_vq_type: "shared_EMARPSimple"  
    semantic_decoder_rvq: 1
    w_loss_orthogonal: 1.0  # only used when semantic_decoder_vq_type is "separate_EMAEntropy"
    semantic_vq_codebook_size: 8192 # 13bit
    semantic_vq_codebook_dim: 32
    ctc_head_input_key: "semantic_latent"
    chroma_head_input_key: "semantic_latent"
    f0_vuv_head_input_key: "semantic_latent"
    # ============================== #


# stage1: prepare_feature (audio->mel), forward enc/dec layers (insert vq_module)
# stage1: !name:recipes.umm2.models.umm_fm.UMMModified
stage1: !name:recipes.umm2.models.dual.umm_dual_decoder.UMMDualDecoder
  config: !ref <config>
  takes: ['audio','audio_length']
  stereo: True
  stereo_mode: pre_quantization_concat # {concat, pre_quantization_concat}

mel_head: !name:recipes.umm2.models.tasks.mel_head.Mel_Head 
  task: "stereo_mel"
  loss_weight: !ref <config[w_loss_mel]>
  config: !ref <config>
  # takes: [mel, mel_len, latent]
  # provides: [mel, mel_out]

identity_head: !name:recipes.umm2.models.tasks.placeholder_head.Identity_Head # BaseStage
  task: "placeholder"
  config: !ref <config>

chroma_head: !name:recipes.umm2.models.tasks.chroma_head.Chroma_Head # BaseStage
  task: "stereo_chroma"
  loss_weight: !ref <config[w_loss_chroma]>
  config: !ref <config>
  # takes: [audio, mel_len, latent]
  # provides: [chroma, chroma_out]

f0_vuv_head: !name:recipes.umm2.models.tasks.f0_vuv_head.F0_VUV_Head_Pitchpdt # BaseStage
  task: "stereo_f0_vuv"
  loss_weight: !ref <config[w_loss_f0]>
  config: !ref <config>

ctc_head: !name:recipes.umm2.models.tasks.ctc_head.CTC_Head # BaseStage
    task: "ctc"
    loss_weight: !ref <config[w_loss_ctc]>
    config: !ref <config>

# stage2: prediction heads, based on the input latent, compute losses in corresponding head with the input ground truth
stage2: !name:recipes.umm2.models.base.SpanModel
    input_names: [audio, token, mel, latent]
    output_names: [mel, mel_out] 
    spans:
        mel: !ref <mel_head>

stage3: !name:recipes.umm2.models.base.SpanModel
    input_names: [audio, token, mel, semantic_latent]
    output_names: [text_ids, ctc_out, chroma, chroma_out, f0, vuv] 
    spans:
        ctc: !ref <ctc_head>
        chroma: !ref <chroma_head>
        pitch: !ref <f0_vuv_head>

model: !name:recipes.umm2.models.base.PipelineModel
  input_names: [audio]
  output_names: [loss, flops]
  stages:
      - !ref <stage1>
      - !ref <stage2>
      - !ref <stage3>

required_modules:
    pretrained: 
        ckpt_path: !ref <extra_params[umm_pretrained]>
        # loader: !name:recipes.umm2.loaders.stage2.DualDecoderModelLoaderCustomized
        #   map_list: [
        #       ['ctc', 'stages.1.spans.1.', 'stages.2.spans.0.'],
        #       ['chroma', 'stages.1.spans.2.', 'stages.2.spans.1.'],
        #       ['f0_vuv', 'stages.1.spans.3.', 'stages.2.spans.2.'],
        #   ]
        loader: !name:recipes.umm2.loaders.stage2.DualDecoderModelLoader
        cache_dir: !ref <run_opts[cache_dir]>
    pitchpdt: # @hanoihantrakul 28MAY2024: Use pitch detector trained on full mix to provide the ground truth signals.
        ckpt_path: !ref <extra_params[pitchpdt]>
        loader: !name:recipes.umm2.loaders.pitchpdt.ModelLoader
        cache_dir: !ref <run_opts[cache_dir]>
        model_position: # pitch model will be used at stage3 - head3
            stages: 2 
            spans: 2


pl_module: !new:recipes.umm2.modules.stages.stage2.Stage2
    config: !ref <config>
    checkpointing: !ref <run_opts[checkpointing]>
    model_cls: !ref <model>
    optimizer_cls: !ref <optimizer_cls>
    scheduler_cls: !ref <scheduler_cls>
    extra_params: !ref <extra_params>
    required_modules: !ref <required_modules>


logger:
    - !new:pytorch_lightning.loggers.wandb.WandbLogger
      save_dir: !ref <run_opts[log_dir]>
      project: !ref <run_opts[log_name]>
      name: !ref <run_opts[version]>

callbacks:
    - !new:samantha.callbacks.HDFSModelCheckpoint
      hdfs_path: !ref <run_opts[hdfs_log_dir]>/<run_opts[log_name]>/<run_opts[version]>
      monitor: step
      save_top_k: 5
      every_n_train_steps: !ref <run_opts[ckpt_interval]>
      mode: max
      filename: "{step:07d}"
      save_last: True
    - !new:pytorch_lightning.callbacks.LearningRateMonitor
      logging_interval: 'step'

plugins:
    - !new:samantha.plugins.LargeTorchCheckpointIO

trainer: !new:pytorch_lightning.Trainer
    strategy: "ddp_find_unused_parameters_false"
    fast_dev_run: !ref <run_opts[fast_dev_run]>
    logger: !ref <logger>
    accelerator: !ref <run_opts[accelerator]>
    devices: "auto"
    num_nodes: !apply:samantha.utils.envs.getenv_int ["ARNOLD_WORKER_NUM", 1]
    deterministic: False
    enable_model_summary: True
    log_every_n_steps: 100
    max_steps: !ref <run_opts[max_steps]>
    precision: !ref <run_opts[precision]>
    accumulate_grad_batches: 1 # TODO
    gradient_clip_val: !ref <run_opts[gradient_clip_val]>
    val_check_interval: !ref <run_opts[val_check_interval]>
    check_val_every_n_epoch: null
    num_sanity_val_steps: 0
    limit_val_batches: 0 # Turn on 1 batch so that spectrograms from validation dataloader can be plotted
    # limit_train_batches: 5000 # 10000 # Consult Colin Wang: forces an epoch to end every 10k steps and prevent OOM # See above comments on why I picked this number
    sync_batchnorm: True
    benchmark: False
    callbacks: !ref <callbacks>
    plugins: !ref <plugins>