---
# @rui.xia May10 2025
# This training config is to train from scratch
# The main changes are:
# 1. The dataloader is switched to litedataloader for robustness and easy configuration
# 2. All modules supports masking for taking out the padding for attention
# We wanted to train from scratch Stage1, Stage2 and Stage3 model using new data
# This model has 723M params.
# With maximum_bucket_size=17280000 (12min 24000 * 12 * 60) GPU utilization ~ 77G
#

################################################################################
##########                       BASIC CONFIGURATION                  ##########
################################################################################

ckpt_path: !ref last.ckpt

seed: 555
__set_seed: !apply:pytorch_lightning.seed_everything [!ref <seed>]
__set_float32_matmul_precision:
  !apply:torch.set_float32_matmul_precision ["high"]

extra_params:
  sample_rate: 24000
  frame_rate: 25
  n_mels: 128
  n_chroma: 12
  n_fft: 2048
  win_length: 2048
  hop_length: 240
  feature_cmvn: "recipes/datasets/mcc/data_ids=794.stats.pt" # we need this because original mkii ConformerUMM normalized using these statistics
  tokenizer: null

  num_seg_per_track: 1
  min_duration: 10 #second
  max_duration: 60 #second

# running parameters
run_opts:
  fast_dev_run: False
  cache_dir: .module_cache/umm
  hdfs_log_dir: "hdfs://haruna/home/byte_data_seed/lf_lq/speech/user/rui.xia/bigmusic/logs"
  log_dir: logs
  log_name: stage1
  version: !ref stage1_reg1_2255mixedZHEN_2375Speech_optim_mem_<extra_params[tokenizer]>_<config[vq_type]><config[vq_codebook_size]>x<config[vq_codebook_dim]>
  precision: "16-mixed"
  num_workers: 4
  accelerator: auto
  warmup_steps: 2000
  max_steps: 500000
  val_check_interval: 5000 # 14APR2024 @hanoihantrakul set limit_train_val_batches=1 so that validation loop is called
  ckpt_interval: 5000
  batch_size: 8
  learning_rate: 3.0e-4
  cycle_steps: 200000
  weight_decay: 0.1
  shuffle_buffer: 10 # 8000 # See above comments on why I picked this number
  gradient_clip_val: 1.0
  checkpointing: False
  use_fused_kernel: False
  use_causal_conformer: False
  conv_depthwise_kernel_size: 31
  # num_spectrogram_val_samples_for_plotting: 8 # As of 13APR2024 This new flag controls the number of spectrograms from the validation dataset to plot to Merlin

################################################################################
##########                    TRAINING CONFIGURATION                  ##########
################################################################################
data:
  save_ckpt_interval: 2000
  train_dataset_ids:
    [
      "CN:9498",
      "CN:9502",
      "CN:9408",
      "CN:9491",
      "CN:9495",
      "CN:9391",
      "CN:9392",
    ]
  train_dataset_weights: [4, 4, 1, 1, 2, 5, 5]
  val_dataset_ids: ["CN:9407"]
  val_dataset_weights: [1]

  train_batcher:
    type: "TokenBucketBatcher"
    dynamic_batch: True
    bucket_schedule_key: "audio_shape"
    buckets:
      [
        240000,
        480000,
        720000,
        960000,
        1200000,
        1440000,
        1680000,
        1920000,
        2160000,
        2400000,
        2640000,
        2880000,
      ]
    maximum_bucket_size: 17280000 #  12min 24000 * 12 * 60

  val_batcher:
    type: "TokenBucketBatcher"
    dynamic_batch: True
    bucket_schedule_key: "audio_shape"
    buckets:
      [
        240000,
        480000,
        720000,
        960000,
        1200000,
        1440000,
        1680000,
        1920000,
        2160000,
        2400000,
        2640000,
        2880000,
      ]
    maximum_bucket_size: 576000 #  4min

  train_item_transform: # This is correctly indented
    - type: "ConvertMetaToDict"
    - type: "MusicParser"
      in_key: "audio"
      out_key: "audio"
      min_len: 10.0
      max_len: 800.0 #second
    - type: "NormalizeAudioToFloat32"
      in_key: "audio"
      out_key: "audio"
    - type: "MusicWavResample"
      key: "audio"
      sample_rate: 24000
    - type: "UtteranceSegmentSamplerRandom"
      out_key: "audio_slice"
      num_segments: !ref <extra_params[num_seg_per_track]> # get number of data from one audio
      min_duration: !ref <extra_params[min_duration]> # min_duration 20 seconds
      max_duration: !ref <extra_params[max_duration]> # max_duration 2 min (2b conformer maxinput)
    - type: "SongSliceAudioCutWithMetaData"
      in_key: "audio_slice"
      out_key: "audio_slice"
      duration_leeway_in_s: 0.0
    - type: "MusicMetaRWTransform"
      in_key: "audio_slice"
      out_key: null
      overwrite_item: true
      maybe_return_list_output: true

    - type: "SanityCheck"
      keys: ["uttid", "audio", "text", "audio_shape"]

  train_batch_transform: # <-- This should be here, at the same level as train_item_transform
    - type: AudioCollate
      in_key: "audio"
      length_key: "audio_length" #output audio_length
      pad_value: 0.0

    - type: NestListCollate
      key_list: ["uttid"]
      to_tensor: False

  val_item_transform: # This is correctly indented
    - type: "ConvertMetaToDict"
    - type: "MusicParser"
      in_key: "audio"
      out_key: "audio"
      min_len: 10.0
      max_len: 800.0 #second
    - type: "NormalizeAudioToFloat32"
      in_key: "audio"
      out_key: "audio"
    - type: "MusicWavResample"
      key: "audio"
      sample_rate: 24000
    - type: "UtteranceSegmentSamplerRandom"
      out_key: "audio_slice"
      num_segments: 1 # get number of data from one audio
      min_duration: 10 # min_duration 20 seconds
      max_duration: 60 # max_duration 180 seconds
    - type: "SongSliceAudioCutWithMetaData"
      in_key: "audio_slice"
      out_key: "audio_slice"
      duration_leeway_in_s: 0.0
    - type: "MusicMetaRWTransform"
      in_key: "audio_slice"
      out_key: null
      overwrite_item: true
      maybe_return_list_output: true

    - type: "SanityCheck"
      keys: ["uttid", "audio", "text", "audio_shape"]

  val_batch_transform:
    - type: AudioCollate
      in_key: "audio"
      length_key: "audio_length" #output audio_length
      pad_value: 0.0

    - type: NestListCollate
      key_list: ["uttid"]
      to_tensor: False

pl_datamodule: !new:samantha.dataio.bigmusic.lite.MusicLiteDataModule
  train_dataset_ids: !ref <data[train_dataset_ids]>
  train_dataset_weights: !ref <data[train_dataset_weights]>
  train_item_transform: !ref <data[train_item_transform]>
  train_batcher: !ref <data[train_batcher]>
  train_batch_transform: !ref <data[train_batch_transform]>
  val_dataset_ids: !ref <data[val_dataset_ids]>
  val_dataset_weights: !ref <data[val_dataset_weights]>
  val_item_transform: !ref <data[val_item_transform]>
  val_batcher: !ref <data[val_batcher]>
  val_batch_transform: !ref <data[val_batch_transform]>
  save_ckpt_interval: null # using trainer val_check_interval

optimizer_cls: !name:torch.optim.AdamW
  lr: !ref <run_opts[learning_rate]>
  weight_decay: !ref <run_opts[weight_decay]>
  betas: [0.9, 0.96]
  eps: 0.00000001

scheduler_cls: !name:recipes.umm2.modules.lr_scheduler.WarmupCosine
  init_lr: !ref <run_opts[learning_rate]>
  warmup_steps: !ref <run_opts[warmup_steps]>
  cycle_steps: !ref <run_opts[cycle_steps]>
  min_lr: !ref <run_opts[learning_rate]> * 0.1

# Copied over from `umm_stage3_mix.yaml` `config` setting.
config: !new:recipes.umm2.models.config.UMMConfig
  feature_cmvn: !ref <extra_params[feature_cmvn]>
  sample_rate: !ref <extra_params[sample_rate]>
  n_mels: !ref <extra_params[n_mels]>
  add_chroma: False
  add_ctc: False
  n_fft: !ref <extra_params[n_fft]>
  win_length: !ref <extra_params[win_length]>
  hop_length: !ref <extra_params[hop_length]>
  hidden_size: 1024
  intermediate_size: 4096
  num_hidden_layers: 24
  num_attention_heads: 8
  max_source_positions: 2500
  add_vq: False
  vq_type: "EMAEntropy"
  vq_proj_noise: 10000
  vq_codebook_size: 32768
  vq_codebook_dim: 32
  vq_layer_idx: 12
  vq_decay: 0.99
  w_loss_mel: 1.0
  w_loss_chroma: 1.0
  w_loss_vq: 1.0
  w_loss_ctc: 1.0
  w_loss_f0: 1.0
  tokenizer: !ref <extra_params[tokenizer]>
  frame_rate: !ref <extra_params[frame_rate]>
  vocab_size: 105880
  ctc_blank_id: 105879
  ctc_zero_infinity: True
  use_bn: False
  ### 5JUL2024 @hanoihantrakul According to the Merlin Job Li Tang uses the following settings `first_conformer`, `act_fn`, `mask_mel`, `rope_enhance_pos`
  first_conformer: False
  act_fn: "gelu"
  mask_mel: True
  rope_enhance_pos: 7500 # 25 * 300
  ###
  hidden_dropout: 0.0
  activation_dropout: 0.0
  attention_dropout: 0.0
  conformer_conv_dropout: 0.0
  ###
  use_fused_kernel: !ref <run_opts[use_fused_kernel]>
  use_causal_conformer: !ref <run_opts[use_causal_conformer]>
  conv_depthwise_kernel_size: !ref <run_opts[conv_depthwise_kernel_size]>
  conformer_mask_topology: "[(1000000000000,1000000000000)]*24"
  conformer_chunk_conv: False
  enable_dyna_chunk: False

# stage1:
stage1: !new:recipes.umm2.models.tasks.bestrq.Best_RQ # BaseStage
  config: !ref <config>
  takes: [audio, audio_length]
  provides: [mel, mel_length, rq_logits, rq_target, accu]

model: !name:recipes.umm2.models.base.PipelineModel
  input_names: [audio, audio_length]
  output_names: [mel, mel_length, rq_logits, rq_target, flops, loss, accu]
  stages:
    - !ref <stage1>

pl_module: !new:recipes.umm2.modules.stages.stage1.Stage1
  checkpointing: !ref <run_opts[checkpointing]>
  config: !ref <config>
  model_cls: !ref <model>
  optimizer_cls: !ref <optimizer_cls>
  scheduler_cls: !ref <scheduler_cls>
  extra_params: !ref <extra_params>

logger:
  - !new:pytorch_lightning.loggers.wandb.WandbLogger
    save_dir: !ref <run_opts[log_dir]>
    project: !ref <run_opts[log_name]>
    name: !ref <run_opts[version]>

callbacks:
  - !new:samantha.callbacks.HDFSModelCheckpoint
    hdfs_path: !ref <run_opts[hdfs_log_dir]>/<run_opts[log_name]>/<run_opts[version]>
    monitor: step
    save_top_k: 5
    every_n_train_steps: !ref <run_opts[ckpt_interval]>
    mode: max
    filename: "{step:07d}"
    save_last: True
  - !new:pytorch_lightning.callbacks.LearningRateMonitor
    logging_interval: "step"
  - !new:recipes.umm2.modules.callbacks.dataloader_profile.DataLoaderTimer
    log_every_n_batches: 100 #print every 100 batches time

plugins:
  - !new:samantha.plugins.LargeTorchCheckpointIO

trainer: !new:pytorch_lightning.Trainer
  strategy: "ddp_find_unused_parameters_false"
  fast_dev_run: !ref <run_opts[fast_dev_run]>
  logger: !ref <logger>
  accelerator: !ref <run_opts[accelerator]>
  devices: "auto"
  num_nodes: !apply:samantha.utils.envs.getenv_int ["ARNOLD_WORKER_NUM", 1]
  deterministic: False
  enable_model_summary: True
  log_every_n_steps: 10
  max_steps: !ref <run_opts[max_steps]>
  precision: !ref <run_opts[precision]>
  accumulate_grad_batches: 1 # TODO
  gradient_clip_val: !ref <run_opts[gradient_clip_val]>
  val_check_interval: !ref <run_opts[val_check_interval]>
  check_val_every_n_epoch: null
  num_sanity_val_steps: 0
  #limit_train_batches: 5000 # 10000 # Consult Colin Wang: forces an epoch to end every 10k steps and prevent OOM # See above comments on why I picked this number
  limit_val_batches: 0
  sync_batchnorm: True
  benchmark: False
  callbacks: !ref <callbacks>
  plugins: !ref <plugins>
