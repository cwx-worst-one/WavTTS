---
#   | Name  | Type          | Params
# ----------------------------------------
# 0 | model | PipelineModel | 729 M 
# ----------------------------------------
# 729 M     Trainable params
# 0         Non-trainable params
# 729 M     Total params
# 2,918.922 Total estimated model params size (MB)

################################################################################
##########                       BASIC CONFIGURATION                  ##########
################################################################################

seed: 555
__set_seed: !apply:pytorch_lightning.seed_everything [!ref <seed>]
__set_float32_matmul_precision: !apply:torch.set_float32_matmul_precision ['high']


# running parameters
run_opts:
    fast_dev_run: False
    cache_dir: .module_cache/umm
    hdfs_log_dir: "hdfs:///home/byte_speech_sv/ju-chiang.wang/umm_tag"
    log_name: 'karaoke'
    version: 'umm_stage4_mix_all_mel_chroma_ctc_vq'
    log_dir: logs
    precision: 16-mixed
    num_workers: 12
    accelerator: auto
    warmup_steps: 2000
    max_steps: 10000000
    val_check_interval: 5000 
    ckpt_interval: 5000
    batch_size: 10
    learning_rate: 1.0e-4
    cycle_steps: 200000
    weight_decay: 0.1
    shuffle_buffer: 800 # 8000 # See above comments on why I picked this number
    gradient_clip_val: 1.0
    checkpointing: False
    # num_spectrogram_val_samples_for_plotting: 8 # As of 13APR2024 This new flag controls the number of spectrograms from the validation dataset to plot to Merlin

################################################################################
##########                    TRAINING CONFIGURATION                  ##########
################################################################################

bigmusic_tag_info:
    ARTIST:
        n_class: 162
        weight: 0.2
    GENRE: 
        n_class: 251
        weight: 0.1
        keyword: "genre"
    THEME:
        n_class: 68
        weight: 0.05
        keyword: "scene"
    MOOD:
        n_class: 23
        weight: 0.05
        keyword: "mood"
    GENDER:
        n_class: 8
        weight: 0.05
        keyword: "vocal_gender"
    TIMBRE:
        n_class: 15
        weight: 0.05
        keyword: "vocal_timbre"

mix_tag_types: !apply:recipes.mir2.parquet_dataset.utils.combine_tag_types
    datasets:
        - !apply:recipes.mir2.parquet_dataset.vocab_index.karaoke_tags
        - !ref <bigmusic_tag_info>

tag_type_to_id: !apply:recipes.mir2.parquet_dataset.utils.get_tag_type_to_id
    tag_types: !ref <mix_tag_types>

pl_datamodule: !new:recipes.datasets.mcc.mix_mir_alltags.MixDataModule
    data_ids: [6667, 5004, 5450]  # 
    data_weights: [2, 1, 1]
    val_data_ids: [6962, 4144] #, 5446]  # use three datasets for validation will get stuck
    shuffle_buffer_size: !ref <run_opts[shuffle_buffer]>
    sample_rate: 24000
    batch_size: !ref <run_opts[batch_size]> 
    num_workers: !ref <run_opts[num_workers]>
    max_num_crops: null
    min_duration: 1
    max_duration: 50
    normalize_audio: False
    tokenizer: "bert-base-multilingual-uncased" # stage2 apply language tokenizer to both EN and CN
    tag_types: !ref <mix_tag_types>
    tag_type_index: !ref <tag_type_to_id>
    frame_rate: 25
    # valid_nodesplitter: !name:webdataset.shardlists.split_by_node
    # collate_fn: !name:recipes.datasets.mcc.mix.collate_audio # 14APR2024 @hanoihantrakul Must turn this off for Stage2 because you need both `audio` and `token` to be passed by default collate_fn

optimizer_cls: !name:torch.optim.AdamW
    lr: !ref <run_opts[learning_rate]>
    weight_decay: !ref <run_opts[weight_decay]>
    betas: [0.9, 0.96]
    eps: 0.00000001

scheduler_cls: !name:recipes.umm2.modules.lr_scheduler.WarmupCosine
    warmup_steps: !ref <run_opts[warmup_steps]>
    cycle_steps: !ref <run_opts[cycle_steps]>
    min_lr: !ref <run_opts[learning_rate]> * 0.1

config: !new:recipes.umm2.models.config.UMMConfig
    feature_cmvn: "recipes/datasets/mcc/data_ids=794.stats.pt" # we need this because original mkii ConformerUMM normalized using these statistics
    sample_rate: !ref <pl_datamodule[sample_rate]>
    n_mels: 128
    n_chroma: 12
    n_fft: 2048
    win_length: 2048
    hop_length: 240
    hidden_size: 1024
    intermediate_size: 4096
    num_hidden_layers: 24
    num_attention_heads: 8
    max_source_positions: !ref <pl_datamodule[frame_rate]> * <pl_datamodule[max_duration]>
    vq_type: null # this will default to EMAVectorQuantizer()
    vq_proj_noise: 10000
    vq_codebook_size: 32768
    vq_codebook_dim: 32
    vq_decay: 0.99
    w_loss_mel: 1.0
    w_loss_chroma: 0.3
    w_loss_ctc: 0.6
    w_loss_vq: 0.5
    w_loss_tag: 1.0
    final_pooling: True
    tokenizer: !ref <pl_datamodule[tokenizer]>
    frame_rate: !ref <pl_datamodule[frame_rate]>
    vocab_size: 105880
    ctc_blank_id: 105879
    ctc_zero_infinity: True
    use_bn: False


tag_loss_weights:  # for non-bigmusic
    genres: 0.3
    instruments: 1.0
    key: 0.1
    tempo: 0.1
    year: 0.1

ema_vq: !new:recipes.umm2.models.tasks.vq_module.EMAVectorQuantizer
    codebook_size: !ref <config[vq_codebook_size]>
    codebook_dim: !ref <config[vq_codebook_dim]>
    decay: !ref <config[vq_decay]>

vq_module: !new:recipes.umm2.models.tasks.vq_module.VQ  # BaseStage
    task: "vq"
    loss_weight: !ref <config[w_loss_vq]>
    config: !ref <config>
    takes: [latent]
    provides: [latent, vq_ids, vq_entropy]
    vq_scheme: !ref <ema_vq>

frontend: !new:recipes.umm2.models.tasks.autoencoder.AE_UMM # BaseStage
    config: !ref <config>
    takes: [audio]
    provides: [audio, mel, latent, vq_ids, vq_entropy] 
    bypasses: [token, tags, type_id]
    loss_weight: null
    lr_ratio: 0.1
    insert_modules:
        12: !ref <vq_module> # at layer 12

mel_head: !name:recipes.umm2.models.tasks.mel_head.Mel_Head # BaseStage
    task: "mel"
    loss_weight: !ref <config[w_loss_mel]>
    config: !ref <config>
    takes: [mel, latent]
    provides: [mel, mel_out]
ctc_head: !name:recipes.umm2.models.tasks.ctc_head.CTC_Head # BaseStage
    task: "ctc"
    loss_weight: !ref <config[w_loss_ctc]>
    config: !ref <config>
    takes: [token, latent]
    provides: [text_ids, ctc_out] 
chroma_head: !name:recipes.umm2.models.tasks.chroma_head.Chroma_Head # BaseStage
    task: "chroma"
    loss_weight: !ref <config[w_loss_chroma]>
    config: !ref <config>
    takes: [audio, latent]
    provides: [chroma, chroma_out] 
tag_head: !name:recipes.umm2.models.tasks.tag_head.TaggingProbingStage
    task: "tagging"
    loss_weight: !ref <config[w_loss_tag]>
    takes: [latent, tags, type_id]
    provides: [tags, tag_pred]
    final_pooling: !ref <config[final_pooling]>
    n_channel: !ref <config[hidden_size]>
    tag_types: !ref <mix_tag_types>
    tag_type_to_id: !ref <tag_type_to_id>
    tag_weights: !ref <tag_loss_weights> # for non-bigmusic

backend: !name:recipes.umm2.models.base.SpanModel
    input_names: [audio, token, mel, latent, tags, type_id]
    output_names: [mel, mel_out, text_ids, ctc_out, tags, tag_pred] 
    bypass_names: [vq_ids, vq_entropy, loss_vq]
    spans:
        mel: !ref <mel_head>
        ctc: !ref <ctc_head>
        chroms: !ref <chroma_head>
        tag: !ref <tag_head>

model: !name:recipes.umm2.models.base.PipelineModel
    input_names: [audio, token, tags, type_id]
    output_names: [mel, mel_out, vq_ids, vq_entropy, text_ids, ctc_out, tags, tag_pred] 
    stages:
        - !ref <frontend>
        - !ref <backend>

required_modules:
    pretrained: 
        #ckpt_path: "hdfs://haruna/home/byte_speech_sv/ju-chiang.wang/logs/umm2_conformer_2255mixedZHEN/stage2_hpss_onset_2255mixedZHEN_optim_mem_bert-base-multilingual-uncased/checkpoints/step=0250000.ckpt"
        #ckpt_path: "hdfs://haruna/home/byte_speech_sv/ju-chiang.wang/logs/umm2_conformer_2255mixedZHEN/stage3_hpss_onset_2255mixedZHEN_2375Speech_optim_mem_bert-base-multilingual-uncased_None32768x32/checkpoints/step=0325000.ckpt"
        ckpt_path: "hdfs://haruna/home/byte_speech_sv/ju-chiang.wang/logs/umm2_conformer_2255mixedZHEN/stage3_reg1_2255mixedZHEN_2375Speech_optim_mem_bert-base-multilingual-uncased_None32768x32/checkpoints/step=0190000.ckpt"
        loader: !name:recipes.umm2.loaders.stage3.ModelLoader
        cache_dir: !ref <run_opts[cache_dir]>

pl_module: !new:recipes.umm2.modules.stages.stage4.Stage4
    config: !ref <config>
    checkpointing: !ref <run_opts[checkpointing]>
    model_cls: !ref <model>
    optimizer_cls: !ref <optimizer_cls>
    scheduler_cls: !ref <scheduler_cls>
    required_modules: !ref <required_modules>
    tag_types: !ref <mix_tag_types>
    #eval_padding: True

logger:
    - !new:pytorch_lightning.loggers.wandb.WandbLogger
      save_dir: !ref <run_opts[hdfs_log_dir]>/<run_opts[log_name]>/<run_opts[version]>
      project: !ref <run_opts[log_name]>
      name: !ref <run_opts[version]>

callbacks:
    - !new:samantha.callbacks.HDFSModelCheckpoint
      hdfs_path: !ref <run_opts[hdfs_log_dir]>/<run_opts[log_name]>/<run_opts[version]>
      monitor: step
      save_top_k: 5
      every_n_train_steps: !ref <run_opts[ckpt_interval]>
      mode: max
      filename: "{step:07d}"
      save_last: True
    - !new:pytorch_lightning.callbacks.LearningRateMonitor
      logging_interval: 'step'

plugins:
    - !new:samantha.plugins.LargeTorchCheckpointIO

trainer: !new:pytorch_lightning.Trainer
    strategy: "ddp_find_unused_parameters_true"
    fast_dev_run: !ref <run_opts[fast_dev_run]>
    logger: !ref <logger>
    accelerator: !ref <run_opts[accelerator]>
    devices: "auto"
    num_nodes: !apply:samantha.utils.envs.getenv_int ["ARNOLD_WORKER_NUM", 1]
    deterministic: False
    enable_model_summary: True
    log_every_n_steps: 100
    max_steps: !ref <run_opts[max_steps]>
    precision: !ref <run_opts[precision]>
    accumulate_grad_batches: 1 # TODO
    gradient_clip_val: !ref <run_opts[gradient_clip_val]>
    val_check_interval: !ref <run_opts[val_check_interval]>
    check_val_every_n_epoch: null
    num_sanity_val_steps: 0
    limit_val_batches: 1000 # will miss some validation examples at random (using max 1020 will cause hanging)
    limit_train_batches: 5000 # 10000 # Consult Colin Wang: forces an epoch to end every 10k steps and prevent OOM # See above comments on why I picked this number
    sync_batchnorm: True
    benchmark: False
    callbacks: !ref <callbacks>
    plugins: !ref <plugins>
