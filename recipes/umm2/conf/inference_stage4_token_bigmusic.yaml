---
################################################################################
##########                       BASIC CONFIGURATION                  ##########
################################################################################

seed: 555
__set_seed: !apply:pytorch_lightning.seed_everything [!ref <seed>]

audio:
  sampling_rate: 24000        # sampling rate for audio
  frame_rate: 25
  sample_len: 50
  hop_len: 50

config: !new:recipes.umm2.models.config.UMMConfig
    feature_cmvn: "recipes/datasets/mcc/data_ids=794.stats.pt" # we need this because original mkii ConformerUMM normalized using these statistics
    sample_rate: !ref <audio[sampling_rate]>
    n_mels: 128
    n_chroma: 12
    n_fft: 2048
    win_length: 2048
    hop_length: 240
    hidden_size: 1024
    intermediate_size: 4096
    num_hidden_layers: 24
    num_attention_heads: 8
    max_source_positions: 1250
    vq_type: null # this will default to EMAVectorQuantizer()
    vq_proj_noise: 10000
    vq_codebook_size: 32768
    vq_codebook_dim: 32
    vq_decay: 0.99
    final_pooling: True
    tokenizer: "bert-base-multilingual-uncased"
    frame_rate: !ref <audio[frame_rate]>
    vocab_size: 105880
    ctc_blank_id: 105879
    ctc_zero_infinity: True
    use_bn: False

mix_tag_types: !apply:recipes.mir2.parquet_dataset.utils.combine_tag_types
    datasets:
        - !apply:recipes.mir2.parquet_dataset.vocab_index.karaoke_tags        # karaoke tag index
        - !apply:recipes.mir2.parquet_dataset.vocab_index.bigmusic_new_tags   # bigmusic tag_info  

ema_vq: !new:recipes.umm2.models.tasks.vq_module.EMAVectorQuantizer
    codebook_size: !ref <config[vq_codebook_size]>
    codebook_dim: !ref <config[vq_codebook_dim]>
    decay: !ref <config[vq_decay]>
    dist: False   # IMPORTANT must set False for inference

vq_module: !new:recipes.umm2.models.tasks.vq_module.VQ  # BaseStage
    task: "vq"
    config: !ref <config>
    takes: [latent]
    provides: [latent, vq_ids]
    vq_scheme: !ref <ema_vq>

# IMPORTANT: autoencoder only appplies to <audio[sample_len]> == <audio[max_duration]>
frontend: !new:recipes.umm2.models.tasks.autoencoder.AE_UMM # BaseStage
    config: !ref <config>
    takes: [audio]
    provides: [latent, vq_ids]
    loss_weight: null
    is_frozen: True
    is_train: False
    insert_modules:
        12: !ref <vq_module> # at layer 12

tag_head: !new:recipes.mir2.models.tagging_mix_dataset.TaggingProbingStage
    task: "tagging"
    takes: [latent]
    provides: [tag_pred]
    is_frozen: True
    loss_weight: null
    final_pooling: !ref <config[final_pooling]>
    n_channel: !ref <config[hidden_size]>
    tag_types: !ref <mix_tag_types>

backend: !new:recipes.umm2.models.base.SpanModel
    input_names: [latent]
    output_names: [tag_pred] 
    bypass_names: [vq_ids]
    spans:
        tag: !ref <tag_head>

model: !new:recipes.umm2.models.base.PipelineModel
    input_names: [audio]
    output_names: [vq_ids, tag_pred] 
    stages:
        - !ref <frontend>
        - !ref <backend>

required_modules:
    pretrained: 
        #ckpt_path: "hdfs://haruna/home/byte_speech_sv/ju-chiang.wang/umm_tag/karaoke/umm_stage4_mel_chroma_ctc_vq/checkpoints/step=0100000.ckpt"
        ckpt_path: "hdfs://haruna/home/byte_speech_sv/ju-chiang.wang/umm_tag/karaoke/umm_stage4_mix_low_bigmusic_mel_chroma_ctc_vq/checkpoints/step=0225000.ckpt"
        loader: !name:recipes.umm2.loaders.stage4.ModelLoader
        cache_dir: ".module_cache/umm"
