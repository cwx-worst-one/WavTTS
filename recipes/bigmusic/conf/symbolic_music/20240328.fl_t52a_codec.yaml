---
################################################################################
##########                       BASIC CONFIGURATION                  ##########
################################################################################

ckpt_path: "last"

seed: 1995
__set_seed: !apply:pytorch_lightning.seed_everything [!ref <seed>]
__set_float32_matmul_precision:
    !apply:torch.set_float32_matmul_precision ["high"]

extra_params:
    sample_rate: 24000
    remi_leadsheet_codebook_size: !ref <remi_leadsheet_codebook_size>
    semantic_codebook_size: 32_768
    semantic_frame_rate: 25
    semantic_type: bestrq
    mulan_embed_dim: 512
    hidden_size: 1536
    intermediate_size: 4352
    num_hidden_layers: 24
    num_attention_heads: 12
    cache_dir: !ref <run_opts[cache_dir]>
    tokenizer_path: "hdfs://haruna/home/byte_speech_sv/zongyu.yin/logs/umm/stage3_music_chroma_vq32768x32/checkpoints/step=0030000.ckpt"
    conditions: "remi_leadsheet_tokens"
    input_embedders: ["remi_leadsheet_tokens"]

# running parameters
run_opts:
    fast_dev_run: False
    arnold_output: !apply:os.getenv ["ARNOLD_OUTPUT", "logs"]
    log_dir: !apply:os.getenv ["LOG_DIR", "logs"]
    version: debug
    cache_dir: .module_cache/bigmusic
    precision: "16"
    num_workers: 24
    accumulate_grad_batches: 1
    accelerator: auto
    audio_key: wav
    max_steps: 200000
    val_check_interval: 2000
    batch_size: 2
    learning_rate: 1.0e-4
    warmup_steps: 2000
    cycle_steps: 30000
    weight_decay: 0.01
    shuffle_buffer: 100
    gradient_clip_val: 1.0
    segment_max_leadsheet_len: 5000
    audio_max_duration: 300
    train_id: 1838
    val_id: 1839

data_config:
    !new:recipes.bigmusic.datasets.symbolic_music.fl_t52a_codec.FLT52ACodec.Config
    leadsheet_seq_len: !ref <run_opts[segment_max_leadsheet_len]>
    audio_max_duration: !ref <run_opts[audio_max_duration]>
    semantic_frame_rate: !ref <extra_params[semantic_frame_rate]>
    sample_rate: !ref <extra_params[sample_rate]>
    audio_key: !ref <run_opts[audio_key]>
    conditions: !ref <extra_params[conditions]>

indexer: !apply:recipes.bigmusic.datasets.symbolic_music.base_codec.get_indexer
    config: !ref <data_config>
remi_leadsheet_codebook_size: !apply:len
    - !ref <indexer>

################################################################################
##########                    TRAINING CONFIGURATION                  ##########
################################################################################

pl_datamodule:
    !apply:recipes.bigmusic.datasets.symbolic_music.fl_t52a_codec.FLT52ACodec.get_datamodule
    config: !ref <data_config>
    train_id: !ref <run_opts[train_id]>
    val_id: !ref <run_opts[val_id]>
    batch_size: !ref <run_opts[batch_size]>
    num_workers: !ref <run_opts[num_workers]>
    shuffle_buffer: !ref <run_opts[shuffle_buffer]>

model_config: !new:transformers.GPT2Config
    vocab_size: 1 # placeholder. Embedding table gets removed on load
    max_position_embeddings: 0
    use_cache: False
    n_positions: 0 # No absolute position embedding
    num_logits: !ref <extra_params[semantic_codebook_size]> + 2 # +2 for EOS
    n_embd: !ref <extra_params[hidden_size]>
    n_layer: !ref <extra_params[num_hidden_layers]>
    n_head: !ref <extra_params[num_attention_heads]>
    n_inner: !ref <extra_params[intermediate_size]>
    use_rms_norm: True
    activation_function: "swiglu"
    resid_pdrop: 0.0
    embd_pdrop: 0.0
    attn_pdrop: 0.0
    layer_norm_epsilon: 1e-6
    initializer_range: 0.02
    rescale_prenorm_residual: False
    rms_norm: True
    rotary_emb_fraction: 1.0
    rotary_emb_interleaved: True
    rotary_emb_compat: "default" #"byteformer"
    tie_word_embeddings: False
    qkv_proj_bias: False
    out_proj_bias: False
    mlp_fc1_bias: False
    mlp_fc2_bias: False
    use_flash_attn: True
    fused_bias_fc: True
    fused_mlp: False
    fused_dropout_add_ln: True
    residual_in_fp32: True

model_cls: !name:samantha.models.ctiga.gpt.GPTLMHeadModel
    config: !ref <model_config>

optimizer_cls: !name:torch.optim.AdamW
    lr: !ref <run_opts[learning_rate]>
    weight_decay: !ref <run_opts[weight_decay]>
    betas: [0.9, 0.96]
    eps: 0.00000001

scheduler_cls:
    !name:recipes.musiclm.optim.lr_scheduler.warmup_cosine_lr.WarmupCosine
    init_lr: !ref <run_opts[learning_rate]>
    warmup_steps: !ref <run_opts[warmup_steps]>
    cycle_steps: !ref <run_opts[cycle_steps]>
    min_lr: !ref <run_opts[learning_rate]> * 0.1

pl_module: !new:recipes.bigmusic.lightning.semantic_modules.SemanticModule
    checkpointing: False
    model_cls: !ref <model_cls>
    optimizer_cls: !ref <optimizer_cls>
    scheduler_cls: !ref <scheduler_cls>
    criterion_cls: !name:recipes.musiclm.lightning.modules.MaskedCrossEntropy
    extra_params: !ref <extra_params>
    required_modules:
        bestrq:
            # US UMM-chroma-Zh stage 3
            hpath: !ref <extra_params[tokenizer_path]>
            initializer:
                !name:recipes.umm.requires.model_initializer.init_stage3
                cache_dir: !ref <run_opts[cache_dir]>

logger:
    - !new:pytorch_lightning.loggers.tensorboard.TensorBoardLogger
      save_dir: !ref <run_opts[arnold_output]>
      name: !ref <run_opts[version]>
      version: "base"
      default_hp_metric: False
    - !new:pytorch_lightning.loggers.wandb.WandbLogger
      save_dir: !ref <run_opts[arnold_output]>
      project: chaonan99
      name: !ref <run_opts[version]>

# log_gradient_scaler: !new:recipes.musiclm.callbacks.loggers.LogGradientScalerCallback

callbacks:
    - !new:samantha.callbacks.HDFSModelCheckpoint
      hdfs_path: !apply:os.path.join
          - !ref <run_opts[log_dir]>
          - !ref <run_opts[version]>
      monitor: step
      save_top_k: 10
      save_last: True
      every_n_train_steps: 1000
      mode: max
      filename: "{step:06d}-{tr_loss:.4f}-{val_loss_0:.4f}"

plugins:
    - !new:samantha.plugins.torch_io.LargeTorchCheckpointIO
      # profiler: !new:pytorch_lightning.profilers.PyTorchProfiler
      #     schedule: !apply:torch.profiler.schedule
      #         wait: 0
      #         warmup: 50
      #         active: 10
      #         repeat: 1
      #         skip_first: 100


trainer: !new:pytorch_lightning.Trainer
    strategy: "ddp_find_unused_parameters_false"
    fast_dev_run: !ref <run_opts[fast_dev_run]>
    logger: !ref <logger>
    accelerator: !ref <run_opts[accelerator]>
    devices: "auto"
    num_nodes: !apply:os.getenv ["ARNOLD_WORKER_NUM", 1]
    deterministic: False
    enable_model_summary: True
    log_every_n_steps: 100
    max_steps: !ref <run_opts[max_steps]>
    precision: !ref <run_opts[precision]>
    accumulate_grad_batches: !ref <run_opts[accumulate_grad_batches]>
    gradient_clip_val: !ref <run_opts[gradient_clip_val]>
    val_check_interval: !ref <run_opts[val_check_interval]>
    check_val_every_n_epoch: null
    num_sanity_val_steps: 0 # skip validation sanity checks so we don't run into hdfs file close errors
    callbacks: !ref <callbacks>
    plugins: !ref <plugins>
    # profiler: !ref <profiler>
