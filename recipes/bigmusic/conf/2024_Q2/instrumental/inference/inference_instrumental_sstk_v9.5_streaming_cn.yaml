---

################################################################################
##########                       BASIC CONFIGURATION                  ##########
################################################################################

seed: 1995
__set_seed: !apply:pytorch_lightning.seed_everything [!ref <seed>]
__set_float32_matmul_precision: !apply:torch.set_float32_matmul_precision ['high']

extra_params:
    beam_size: 4    # set to 1 if not using reranker
    samples_to_save: 1
    save_style_audio: True
    save_mode: wav  # wav|mp3|upload
    save_semantic_tokens: False
    prompt_path: "hdfs://haruna/home/byte_speech_sv/bigmusic/prompts/sstk-prompt100.csv"
    inference_conditions: "style_text,duration"
    max_items: null
    use_reranker: True

    output_dir: sstk_out

    # Semantic model
    semantic_cls_path: recipes.bigmusic.lightning.semantic_modules.SemanticModule
    semantic_ckpt: "hdfs://haruna/home/byte_data_seed/lf_lq/speech/user/lixingxing.cs/models/bigmusic/instrumental/sstk_v9/semantic/rl/step=000550-minimal.ckpt"
    mulan_ckpt: "hdfs://haruna/home/byte_data_seed/lf_lq/speech/user/lixingxing.cs/models/bigmusic/instrumental/sstk_v9/mulan/mulan-step=005000-median_rank_1=61-kaggle-minimal.ckpt"
    mulan_version: "sstkmae_v3"

    # For re-ranking
    rewards:
        style_text: 1
        mulan_temporal: 1
        chroma_temporal: 1.0
        style_audio: 0.0
        qualitative: 0.5
        loudness_sim: 0.0
        audio_metrics: 0.0
        semantic_diversity: 0.5
    positive_phrase: "high quality, catchy, memorable"
    negative_phrase: "noisy, boring, forgettable"

    # CFG
    use_controller_cfg: True
    controller_cfg_gamma: 2
    controller_cfg_label: negative_anchor

    # this is only needed when sample_rate=44100 or 48000, for 24k its bypassed
    # '24k_to_48k_stereo' to use upsampling vocoder
    # '44.1k_sa' to use Stable Audio 44.1k stereo vocoder
    vocoder_version: '44.1k_sa'

    diffusion_params: {}

    # Model Settings
    sample_rate: 44100  # 24000|44100
    duration: 30 # 30|45|60|75|90|105|120
    semantic_temperature: 1.0
    sample_mode: "top_p"
    sample_thresh: 0.8
    token2wav_type: "ar-diffusion-vocoder"
    exclude_eos: True

    normalize_volume: False


run_opts:
    fast_dev_run: False
    precision: 16
    accelerator: auto
    strategy: auto
    cache_dir: .module_cache/musiclm
    batch_size: 1  # set to 28 if not using reranker

token2wav_config: !include:../../../../../../apps/bigmusic/umm/diffusion/conf/infer_generation_25hzConformer_49hzSS_streaming_cn_v9.yaml

################################################################################
##########                    TRAINING CONFIGURATION                  ##########
################################################################################
predict_dataset: !apply:recipes.bigmusic.datasets.inference.inference_dataset_from_prompt
    prompt_path: !ref <extra_params[prompt_path]>
    conditions: !ref <extra_params[inference_conditions]>
    max_items: !ref <extra_params[max_items]>
    batch_size: !ref <run_opts[batch_size]>
    transform_style_text: False
    extra_params: !ref <extra_params>

pl_datamodule: !new:recipes.bigmusic.datasets.lyrics.LyricsDataModule
    predict_dataset: !ref <predict_dataset>
    num_workers: 0

pl_module: !new:recipes.bigmusic.lightning.inference.SemanticInferenceModule
    semantic_cls_path: !ref <extra_params[semantic_cls_path]>
    extra_params: !ref <extra_params>
    required_modules:
        diffusion_modules:
            diffusion:
                hpath: !ref <token2wav_config[diffusion_config]>
                initializer: !name:apps.bigmusic.umm.diffusion.requires.model_initializer.init_diffusion
                    cache_dir: !ref <run_opts[cache_dir]>
        reranker:
            hpath:
                rewards: !ref <extra_params[rewards]>
                required_modules:
                    mulan:
                        hpath: !ref <extra_params[mulan_ckpt]>
                        initializer: !name:recipes.musiclm.requires.model_initializer.init_mulan
                            version: !ref <extra_params[mulan_version]>
            initializer: !name:recipes.bigmusic.utils.reranker.init_reranker
                cache_dir: !ref <run_opts[cache_dir]>
                sample_rate: !ref <extra_params[sample_rate]>

# separating out additional_callbacks so auto_eval can disable metrics
additional_callbacks:
#   - !new:recipes.bigmusic.callbacks.mcs_metrics.MCSMetricsCallback
    - !new:recipes.bigmusic.callbacks.average_metrics.AverageMetricsCallback
#   - !new:recipes.bigmusic.callbacks.save_outputs.SaveVideoCallback
callbacks:
    - !new:recipes.bigmusic.callbacks.save_outputs.SaveOutputsCallback
      beam_size: !ref <extra_params[beam_size]>
      samples_to_save: !ref <extra_params[samples_to_save]>
      save_style_audio: !ref <extra_params[save_style_audio]>
      save_mode: !ref <extra_params[save_mode]>
      save_semantic_tokens: !ref <extra_params[save_semantic_tokens]>
      normalize_volume: !ref <extra_params[normalize_volume]>

trainer: !new:pytorch_lightning.Trainer
    fast_dev_run: !ref <run_opts[fast_dev_run]>
    accelerator: !ref <run_opts[accelerator]>
    devices: 'auto'
    num_nodes: !apply:samantha.utils.envs.getenv_int ["ARNOLD_WORKER_NUM", 1]
    deterministic: False
    enable_model_summary: True
    use_distributed_sampler: False # for multi-gpu inference
    strategy: !ref <run_opts[strategy]>
    precision: !ref <run_opts[precision]>
    callbacks: !apply:operator.add [!ref <additional_callbacks>, !ref <callbacks>]
