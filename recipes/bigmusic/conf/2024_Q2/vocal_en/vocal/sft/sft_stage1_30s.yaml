---

################################################################################
##########                       BASIC CONFIGURATION                  ##########
################################################################################

ckpt_path: 'last'

seed: 1995
__set_seed: !apply:pytorch_lightning.seed_everything [!ref <seed>]
__set_float32_matmul_precision: !apply:torch.set_float32_matmul_precision ['high']

extra_params:
    sample_rate: 24000
    duration: [15, 20, 25, 30]
    lyrics_codebook_size: 400
    lyrics_max_seq_len: 400
    semantic_codebook_size: 32_768
    semantic_frame_rate: 25
    mulan_embed_dim: 512
    hidden_size: 1536
    dataset_types: spotify_sft_billboardv2,spotify_sft_groupa
    dataset_weights: [1, 3]
    valid_dataset_type: val_mcc60m_groupA_cat
    style_category_vocab_size: 4096
    tag_dropout_rate: 0.0
    semantic_type: bestrq
    input_embedders: ["mulan_categorical", "lyrics_tokens"]
    pretrained_path: hdfs:///home/byte_speech_sv/andrew.shaw/checkpoints/bigmusic/mcc60m_vocalB_style_mixed_cat_audio_v8_loss_mask/step=112000-tr_loss=4.5971-val_accu_0=13.87.ckpt # for loading state dicts
    style_category_vocab_path: hdfs://harunava/home/byte_speech_sv/andrew.shaw/data/bigmusic/vocab/spotify_vocab_2024_Q2.json

# running parameters
run_opts:
    fast_dev_run: False
    log_dir: !apply:os.getenv ["ARNOLD_OUTPUT", "logs"]
    # hdfs_log_dir: "hdfs:///home/byte_speech_sv/andrew.shaw/logs"
    hdfs_log_dir: null
    log_name: semantic_model_2024_Q2
    version: v0
    cache_dir: .module_cache/musiclm
    precision: "16-mixed"
    num_workers: 8
    accelerator: auto
    max_steps: 20000
    batch_size: 20
    learning_rate: 1.0e-4
    warmup_steps: 2000
    cycle_steps: 80000
    weight_decay: 0.1
    shuffle_buffer: 0
    gradient_clip_val: 1.0
    val_check_interval: 1000

################################################################################
##########                    TRAINING CONFIGURATION                  ##########
################################################################################

pl_datamodule: !apply:recipes.bigmusic.datasets.lyrics.LyricsDataModule.from_dataset_type
    batch_size: !ref <run_opts[batch_size]>
    sample_rate: !ref <extra_params[sample_rate]>
    sample_duration: !ref <extra_params[duration]>
    shuffle_buffer_size: !ref <run_opts[shuffle_buffer]>
    lyrics_max_seq_len: !ref <extra_params[lyrics_max_seq_len]>
    num_workers: !ref <run_opts[num_workers]>
    pin_memory: True
    dataset_types: !ref <extra_params[dataset_types]>
    dataset_weights: !ref <extra_params[dataset_weights]>
    valid_dataset_type: !ref <extra_params[valid_dataset_type]>

model_config: !new:transformers.GPT2Config
    vocab_size: 1 # placeholder. Embedding table gets removed on load
    max_position_embeddings: 0
    use_cache: False
    n_positions: 0  # No absolute position embedding
    num_logits: !ref <extra_params[semantic_codebook_size]> + 2 # +2 for EOS
    n_embd: !ref <extra_params[hidden_size]>
    n_layer: 24
    n_head: 12
    n_inner: 4352
    use_rms_norm: True
    activation_function: "swiglu"
    resid_pdrop: 0.0
    embd_pdrop: 0.0
    attn_pdrop: 0.0
    layer_norm_epsilon: 1e-6
    initializer_range: 0.02
    rescale_prenorm_residual: False
    rms_norm: True
    rotary_emb_fraction: 1.0
    rotary_emb_interleaved: True
    rotary_emb_compat: "default" #"byteformer"
    tie_word_embeddings: False
    qkv_proj_bias: False
    out_proj_bias: False
    mlp_fc1_bias: False
    mlp_fc2_bias: False
    use_flash_attn: True
    fused_bias_fc: True
    fused_mlp: False
    fused_dropout_add_ln: True
    residual_in_fp32: True

model_cls: !name:samantha.models.ctiga.gpt.GPTLMHeadModel
    config: !ref <model_config>

optimizer_cls: !name:torch.optim.AdamW
    lr: !ref <run_opts[learning_rate]>
    weight_decay: !ref <run_opts[weight_decay]>
    betas: [0.9, 0.96]
    eps: 0.00000001

scheduler_cls: !name:recipes.musiclm.optim.lr_scheduler.warmup_cosine_lr.WarmupCosine
    init_lr: !ref <run_opts[learning_rate]>
    warmup_steps: !ref <run_opts[warmup_steps]>
    cycle_steps: !ref <run_opts[cycle_steps]>
    min_lr: !ref <run_opts[learning_rate]> * 0.1

pl_module: !new:recipes.bigmusic.lightning.semantic_modules.SemanticModule
    checkpointing: False
    model_cls: !ref <model_cls>
    optimizer_cls: !ref <optimizer_cls>
    scheduler_cls: !ref <scheduler_cls>
    criterion_cls: !name:recipes.musiclm.lightning.modules.MaskedCrossEntropy
    extra_params: !ref <extra_params>
    required_modules:
        mulan:
            hpath: hdfs:///home/byte_speech_sv/bigmusic/models/mulan/mulan-step=024600-median_rank_1=110-kaggle-minimal.ckpt # mulan 110
            initializer: !name:recipes.musiclm.requires.model_initializer.init_mulan
                cache_dir: !ref <run_opts[cache_dir]>
                version: "g4"
        bestrq:
            hpath: hdfs:///home/byte_speech_sv/bigmusic/models/umm/umm_stage3_music_chroma_vq32768x32-step=0030000-minimal.ckpt
            initializer: !name:recipes.umm.requires.model_initializer.init_stage3
                cache_dir: !ref <run_opts[cache_dir]>

logger:
    - !new:pytorch_lightning.loggers.tensorboard.TensorBoardLogger
      save_dir: !ref <run_opts[log_dir]>
      name: !ref <run_opts[log_name]>
      version: !ref <run_opts[version]>
      default_hp_metric: False
    - !new:pytorch_lightning.loggers.wandb.WandbLogger
      save_dir: !ref <run_opts[log_dir]>
      project: !ref <run_opts[log_name]>
      name: !ref <run_opts[version]>

