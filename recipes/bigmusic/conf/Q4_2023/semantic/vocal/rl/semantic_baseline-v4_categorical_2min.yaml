---

################################################################################
##########                       BASIC CONFIGURATION                  ##########
################################################################################

ckpt_path: null

seed: 1995
__set_seed: !apply:pytorch_lightning.seed_everything [!ref <seed>]
__set_float32_matmul_precision: !apply:torch.set_float32_matmul_precision ['high']

extra_params:
    sample_rate: 24000
    duration: 120
    lyrics_codebook_size: 400
    lyrics_max_seq_len: null # batching is based off of lyrics + umm lengths. No need to set max length anymore
    semantic_codebook_size: 32_768
    semantic_frame_rate: 25
    mulan_embed_dim: 512
    hidden_size: 1536
    intermediate_size: 4352
    num_hidden_layers: 24
    num_attention_heads: 12
    buckets_in_sec: [40, 60, 80, 100, 120]
    style_category_vocab_size: 4096
    semantic_type: bestrq
    tag_dropout_rate: 0.1
    pretrained_path: hdfs:///home/byte_speech_sv/andrew.shaw/logs/semantic_model_dataset_v4_baseline/SFT_2min_deepchorus_4datasets_v3/checkpoints/step=052000-tr_loss=4.2535-val_loss_0=4.32.ckpt
    input_embedders: ["mulan_categorical", "lyrics_tokens"]
    # Inference params
    semantic_temperature: 1.0
    sample_mode: "top_p"
    beam_size: 2
    decoder_type: "diffusion"
    diffusion_steps: 10
    bf16_portion: 0.0
    # RL training params
    add_ref_to_beam: False
    ce_weight: 0.1
    seq_weight: 10
    positive_phrase: "cd quality, catchy, memorable"
    negative_phrase: "noisy, boring, forgettable"
    use_chord_eos: False
    rewards:
        "mulan_sim": 1.0
        "wer": 0.5
        "style_text_sim": 0.5
        "loudness_sim": 1.0
        "qualitative_sim": 1.0
        # "chord": 1.0
        # "chorus_presence": 0.2
    # Logging params
    log_num_val_samples: 10
    log_num_val_beam_samples: 1

    dataset_types: spotify_sft_artist16,spotify_sft_pop400,spotify_sft_billboardv2,spotify_sft_groupa
    dataset_weights: [10, 1, 350, 700]
    valid_dataset_type: val_mcc60m_groupA_cn

# running parameters
run_opts:
    fast_dev_run: False
    log_dir: !apply:os.getenv ["ARNOLD_OUTPUT", "logs"]
    hdfs_log_dir: "hdfs:///home/byte_speech_sv/andrew.shaw/logs"
    log_name: semantic_model_dataset_v4_baseline
    version: billboard-v2_rl3.0
    cache_dir: .module_cache/musiclm
    precision: "16-mixed"
    num_workers: 4
    accelerator: auto
    max_steps: 5000
    val_check_interval: 50
    batch_size: 1 # semantic variable length module can only handle batch size of 1 for predict and RL
    learning_rate: 5.0e-7
    warmup_steps: 100
    cycle_steps: 2000
    weight_decay: 0.1
    shuffle_buffer: 0
    gradient_clip_val: 1.0
    # Supporting models
    mulan_ckpt: "hdfs:///home/byte_speech_sv/bigmusic/models/mulan/mulan-step=024600-median_rank_1=110-kaggle-minimal.ckpt"
    bestrq_ckpt: "hdfs:///home/byte_speech_sv/bigmusic/models/umm/umm_stage3_music_chroma_vq32768x32-step=0030000-minimal.ckpt"
    diffusion_ckpt: "hdfs:///home/byte_speech_sv/bigmusic/models/diffusion/model_14_120s_finetune-minimal.ckpt"
    vocoder_ckpt: "hdfs:///home/byte_speech_sv/bigmusic/models/diffusion/soundstream-step=374999-val_sdr=12.9557-minimal.ckpt"
    chord_ckpt: "hdfs:///home/byte_speech_sv/bigmusic/models/reranker/semi-sup-chord_epoch=103-step=56300.ckpt"
    chord_lms:
        default: "hdfs:///home/byte_speech_sv/bigmusic/models/reranker/mcc60m_groupA1m_chords/genre_specific/train.arpa"

################################################################################
##########                    TRAINING CONFIGURATION                  ##########
################################################################################

# pl_datamodule: !new:recipes.datasets.billboard.BillboardLyricsDataModule
#     sample_rate: !ref <extra_params[sample_rate]>
#     batch_size: !ref <run_opts[batch_size]>
#     shuffle_buffer_size: !ref <run_opts[shuffle_buffer]>
#     buckets_sec: !ref <extra_params[buckets_in_sec]>
#     num_workers: !ref <run_opts[num_workers]>
#     pin_memory: True


pl_datamodule: !apply:recipes.bigmusic.datasets.lyrics.LyricsDataModule.from_dataset_type
    batch_size: !ref <run_opts[batch_size]>
    sample_rate: !ref <extra_params[sample_rate]>
    sample_duration: !ref <extra_params[buckets_in_sec]>
    shuffle_buffer_size: !ref <run_opts[shuffle_buffer]>
    lyrics_max_seq_len: !ref <extra_params[lyrics_max_seq_len]>
    num_workers: !ref <run_opts[num_workers]>
    pin_memory: True
    dataset_types: !ref <extra_params[dataset_types]>
    dataset_weights: !ref <extra_params[dataset_weights]>
    valid_dataset_type: !ref <extra_params[valid_dataset_type]>

model_config: !new:transformers.GPT2Config
    vocab_size: 1 # placeholder. Embedding table gets removed on load
    max_position_embeddings: 0
    use_cache: False
    n_positions: 0  # No absolute position embedding
    num_logits: !ref <extra_params[semantic_codebook_size]> + 2 # +2 for EOS
    n_embd: !ref <extra_params[hidden_size]>
    n_layer: !ref <extra_params[num_hidden_layers]>
    n_head: !ref <extra_params[num_attention_heads]>
    n_inner: !ref <extra_params[intermediate_size]>
    use_rms_norm: True
    activation_function: "swiglu"
    resid_pdrop: 0.0
    embd_pdrop: 0.0
    attn_pdrop: 0.0
    layer_norm_epsilon: 1e-6
    initializer_range: 0.02
    rescale_prenorm_residual: False
    rms_norm: True
    rotary_emb_fraction: 1.0
    rotary_emb_interleaved: True
    rotary_emb_compat: "default" #"byteformer"
    tie_word_embeddings: False
    qkv_proj_bias: False
    out_proj_bias: False
    mlp_fc1_bias: False
    mlp_fc2_bias: False
    use_flash_attn: True
    fused_bias_fc: True
    fused_mlp: False
    fused_dropout_add_ln: True
    residual_in_fp32: True

model_cls: !name:samantha.models.ctiga.gpt.GPTLMHeadModel
    config: !ref <model_config>

optimizer_cls: !name:torch.optim.AdamW
    lr: !ref <run_opts[learning_rate]>
    weight_decay: !ref <run_opts[weight_decay]>
    betas: [0.9, 0.96]
    eps: 0.00000001

scheduler_cls: !name:recipes.musiclm.optim.lr_scheduler.warmup_cosine_lr.WarmupCosine
    init_lr: !ref <run_opts[learning_rate]>
    warmup_steps: !ref <run_opts[warmup_steps]>
    cycle_steps: !ref <run_opts[cycle_steps]>
    min_lr: !ref <run_opts[learning_rate]> * 0.1

pl_module: !new:recipes.bigmusic.lightning.semantic_varlen_modules.SemanticRLModule
    checkpointing: False
    model_cls: !ref <model_cls>
    optimizer_cls: !ref <optimizer_cls>
    scheduler_cls: !ref <scheduler_cls>
    extra_params: !ref <extra_params>
    required_modules:
        bestrq:
            hpath: !ref <run_opts[bestrq_ckpt]>
            initializer: !name:recipes.umm.requires.model_initializer.init_stage3
                cache_dir: !ref <run_opts[cache_dir]>
        mulan:
            hpath: !ref <run_opts[mulan_ckpt]>
            initializer: !name:recipes.musiclm.requires.model_initializer.init_mulan
                cache_dir: !ref <run_opts[cache_dir]>
                version: "g4"
        sampler:
            hpath: null
            initializer: !name:recipes.diffusion.inference_from_text_lyrics2song.init_sampler
                cache_dir: !ref <run_opts[cache_dir]>
                duration: !ref <extra_params[duration]>
        diffusion:
            hpath: !ref <run_opts[diffusion_ckpt]>
            initializer: !name:recipes.diffusion.models.diffusion_model.utils.init_diffusion
                cache_dir: !ref <run_opts[cache_dir]>
        vocoder:
            hpath: !ref <run_opts[vocoder_ckpt]>
            initializer: !name:recipes.diffusion.models.vocoder_model.utils.init_vocoder
                cache_dir: !ref <run_opts[cache_dir]>
                version: 24k_125hz_dim32_baseline
        # chord:
        #     hpath: !ref <run_opts[chord_ckpt]>
        #     initializer: !name:recipes.chord.requires.model_initializer.init_chord
        #         cache_dir: !ref <run_opts[cache_dir]>
        # chord_lms:
        #     hpath: !ref <run_opts[chord_lms]>
        #     initializer: !name:recipes.chord.requires.model_initializer.init_chord_lms
        #         cache_dir: !ref <run_opts[cache_dir]>
        asr:
            hpath: en_punc
            initializer: !name:recipes.bigmusic.utils.metrics_asr.init_asr
                keep_alive: False

logger:
    - !new:pytorch_lightning.loggers.tensorboard.TensorBoardLogger
      save_dir: !ref <run_opts[log_dir]>
      name: !ref <run_opts[log_name]>
      version: !ref <run_opts[version]>
      default_hp_metric: False
    - !new:pytorch_lightning.loggers.wandb.WandbLogger
      save_dir: !ref <run_opts[log_dir]>
      project: !ref <run_opts[log_name]>
      name: !ref <run_opts[version]>

# log_gradient_scaler: !new:recipes.musiclm.callbacks.loggers.LogGradientScalerCallback


callbacks:
    - !new:pytorch_lightning.callbacks.ModelCheckpoint
      save_top_k: 10
      save_last: True
      monitor: step
      mode: max
      filename: "{step:06d}"
      every_n_train_steps: !ref <run_opts[val_check_interval]>
    - !new:samantha.callbacks.HDFSModelCheckpoint
      hdfs_path: !ref <run_opts[hdfs_log_dir]>/<run_opts[log_name]>/<run_opts[version]>
      monitor: step
      save_top_k: 10
      save_last: True
      every_n_train_steps: !ref <run_opts[val_check_interval]>
      mode: max
      filename: "{step:06d}-{tr_loss:.4f}-{val_loss_0:.2f}"
    # - !new:pytorch_lightning.callbacks.LearningRateMonitor
    #   logging_interval: 'step'

plugins:
    - !new:samantha.plugins.torch_io.LargeTorchCheckpointIO

trainer: !new:pytorch_lightning.Trainer
    strategy: "ddp_find_unused_parameters_true" # with batch size of 1, we may skip nan losses
    fast_dev_run: !ref <run_opts[fast_dev_run]>
    logger: !ref <logger>
    accelerator: !ref <run_opts[accelerator]>
    devices: 'auto'
    num_nodes: !apply:os.getenv ["ARNOLD_WORKER_NUM", 1]
    deterministic: False
    enable_model_summary: True
    log_every_n_steps: 100
    max_steps: !ref <run_opts[max_steps]>
    precision: !ref <run_opts[precision]>
    accumulate_grad_batches: 1
    gradient_clip_val: !ref <run_opts[gradient_clip_val]>
    val_check_interval: !ref <run_opts[val_check_interval]>
    limit_val_batches: 10
    check_val_every_n_epoch: null
    num_sanity_val_steps: 2
    callbacks: !ref <callbacks>
    plugins: !ref <plugins>
