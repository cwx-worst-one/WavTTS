---

################################################################################
##########                       BASIC CONFIGURATION                  ##########
################################################################################

seed: 1995
__set_seed: !apply:pytorch_lightning.seed_everything [!ref <seed>]
__set_float32_matmul_precision: !apply:torch.set_float32_matmul_precision ['high']

extra_params:
    beam_size: 4 # set to 4 if using reranker, 1 without reranker
    inference_conditions: style_text,lyrics_tokens # style_text|style_audio,lyrics_tokens,vocal_audio|vocal_text,chroma
    max_items: null
    run_combinations: False
    use_reranker: True

    output_dir: ./generated_output/conditional

    # Semantic model
    semantic_cls_path: recipes.bigmusic.lightning.semantic_modules.SemanticModule
    semantic_ckpt: "hdfs://haruna/home/byte_speech_sv/andrew.shaw/checkpoints/bigmusic/mcc60m_vocalB_style_mixed_cat_audio_v11_rl/step=000150.ckpt"
    mulan_ckpt: "hdfs:///home/byte_speech_sv/bigmusic/models/mulan/mulan-step=024600-median_rank_1=110-kaggle-minimal.ckpt"

    # Used for reranker, only loaded if use_reranker=True
    mulan_rewards_ckpt: "hdfs://haruna/home/byte_data_seed/lf_lq/speech/user/lixingxing.cs/models/bigmusic/mulan/mulan-step=024600-median_rank_1=110-kaggle-minimal.ckpt"
#    structure_ckpt: "hdfs:///home/byte_speech_sv/bigmusic/models/reranker/structure_epoch=185-step=93000.ckpt"

    ar_params:
        coarse_duration: 10
        fine_duration: 4
        coarse_stride: 5
        fine_stride: 3
        coarse_temperature: 0.9
        fine_temperature: 0.8
    diffusion_params:
        num_chunks: 1
        diffusion_steps: 25
        schedule_slope: 2.5
        guidance_scale: 2.5
        bf16_portion: 0.0

    # Model Settings
    sample_rate: 24000
    duration: 30 # 30
    lyrics_max_seq_len: 400
    semantic_temperature: 1.0
    sample_thresh: 0.9
    sample_mode: "top_p"
    token2wav_type: diffusion

run_opts:
    fast_dev_run: False
    precision: 16-mixed
    accelerator: auto
    strategy: auto
    cache_dir: .module_cache/musiclm
    batch_size: 8  # set to 8 if using reranker, 40 without reranker
    num_workers: 8

################################################################################
##########                    TRAINING CONFIGURATION                  ##########
################################################################################

pl_module: !new:recipes.bigmusic.lightning.inference.SemanticInferenceModule
    semantic_cls_path: !ref <extra_params[semantic_cls_path]>
    extra_params: !ref <extra_params>
    required_modules:
        diffusion_modules:
            diffusion:
                hpath: hdfs:///home/byte_speech_sv/bigmusic/models/diffusion/model_14_30s_finetune-minimal.ckpt
                initializer: !name:recipes.diffusion.models.diffusion_model.utils.init_diffusion
                    cache_dir: !ref <run_opts[cache_dir]>
            sampler:
                hpath: null
                initializer: !name:recipes.diffusion.inference_from_text_lyrics2song.init_sampler
                    cache_dir: !ref <run_opts[cache_dir]>
            vocoder:
                hpath: hdfs:///home/byte_speech_sv/bigmusic/models/diffusion/soundstream-step=374999-val_sdr=12.9557-minimal.ckpt
                initializer: !name:recipes.diffusion.models.vocoder_model.utils.init_vocoder
                    cache_dir: !ref <run_opts[cache_dir]>
                    version: 24k_125hz_dim32_baseline
        reranker:
            hpath:
                rewards:
                    style_text: 1.0
                    qualitative: 1.0
                    wer: 1.0
                    #structure: 1.0
                    #chord: 4.0
                required_modules:
                    mulan:
                        hpath: !ref <extra_params[mulan_rewards_ckpt]>
                        initializer: !name:recipes.musiclm.requires.model_initializer.init_mulan
                            version: "g4"
                    asr:
                        hpath: en_punc
                        initializer: !name:recipes.bigmusic.utils.metrics_asr.init_asr
                    #structure:
                    #    hpath: !ref <extra_params[structure_ckpt]>
                    #    initializer: !name:recipes.structure.requires.model_initializer.init_structure
                    #chord:
                    #    hpath: "hdfs:///home/byte_speech_sv/bigmusic/models/reranker/semi-sup-chord_epoch=103-step=56300.ckpt"
                    #    initializer: !name:recipes.chord.requires.model_initializer.init_chord
                    #chord_lms:
                    #    hpath:
                    #        default: "hdfs:///home/byte_speech_sv/bigmusic/models/reranker/mcc60m_groupA1m_chords/genre_specific/train.arpa"
                    #    initializer: !name:recipes.chord.requires.model_initializer.init_chord_lms
            initializer: !name:recipes.bigmusic.utils.reranker.init_reranker
                cache_dir: !ref <run_opts[cache_dir]>

# separating out additional_callbacks so auto_eval can disable metrics
trainer: !new:pytorch_lightning.Trainer
    fast_dev_run: !ref <run_opts[fast_dev_run]>
    accelerator: !ref <run_opts[accelerator]>
    devices: 'auto'
    num_nodes: !apply:samantha.utils.envs.getenv_int ["ARNOLD_WORKER_NUM", 1]
    deterministic: False
    enable_model_summary: True
    strategy: !ref <run_opts[strategy]>
    precision: !ref <run_opts[precision]>
