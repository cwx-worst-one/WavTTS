---

################################################################################
##########                       BASIC CONFIGURATION                  ##########
################################################################################

seed: 1995
__set_seed: !apply:pytorch_lightning.seed_everything [!ref <seed>]
__set_float32_matmul_precision: !apply:torch.set_float32_matmul_precision ['high']

extra_params:
    beam_size: 4 # set to 4 if using reranker, 1 without reranker
    samples_to_save: 1
    prompt_path: ""
    inference_conditions: style_text,lyrics_tokens # style_text|style_audio,lyrics_tokens,vocal_audio|vocal_text,chroma
    max_items: null
    run_combinations: False
    use_reranker: True
    dataset_mode: truncate_length

    output_dir: ./generated_output/conditional

    # Semantic model
    semantic_cls_path: recipes.bigmusic.lightning.semantic_modules.SemanticModuleDualUMMFullTrack
    semantic_ckpt: ""
    mulan_ckpt: infer_from_semantic_ckpt

    # Used for reranker, only loaded if use_reranker=True
    mulan_rewards_ckpt: "hdfs:///home/byte_speech_sv/jingsong.gao/mulan_ckpt/mulan-step=024600-median_rank_1=110-kaggle.ckpt"
    structure_ckpt: "/mnt/bn/audio-diffusion/ducle/recipes/diffusion/assets/structure_epoch=185-step=93000.ckpt"

    ar_params:
        coarse_duration: 10
        fine_duration: 4
        coarse_stride: 5
        fine_stride: 3
        coarse_temperature: 0.9
        fine_temperature: 0.8
        ar_sample_mode: gumbel
    diffusion_params:
        num_chunks: 1
        diffusion_steps: 25
        schedule_slope: 2.5
        guidance_scale: 2.5
        bf16_portion: 0.0

    # Model Settings
    sample_rate: 24000
    duration: 30 # 30
    lyrics_max_seq_len: 400
    semantic_temperature: 1.0
    sample_mode: "top_p"
    sample_thresh: 0.9
    token2wav_type: dualumm_full

    cache_dir: .module_cache/musiclm
    # dataset settings
    dataset_types: mcc60m_2M_vocal_mixed_text_audio_CN_mss
    valid_dataset_type: mcc60m_2M_vocal_mixed_text_audio_CN_mss_inference

run_opts:
    fast_dev_run: False
    precision: 16-mixed
    accelerator: auto
    strategy: auto
    cache_dir: .module_cache/musiclm
    batch_size: 8  # set to 8 if using reranker, 40 without reranker
    num_workers: 8

################################################################################
##########                    INFERENCE CONFIGURATION                  ##########
################################################################################
#pl_datamodule: !apply:recipes.bigmusic.datasets.lyrics.LyricsDataModule.from_dataset_type
#    batch_size: !ref <run_opts[batch_size]>
#    sample_rate: !ref <extra_params[sample_rate]>
#    sample_duration: !ref <extra_params[duration]>
#    lyrics_max_seq_len: !ref <extra_params[lyrics_max_seq_len]>
#    num_workers: !ref <run_opts[num_workers]>
#    pin_memory: True
#    dataset_types: !ref <extra_params[dataset_types]>
#    valid_dataset_type: !ref <extra_params[valid_dataset_type]>

predict_dataset: !apply:recipes.bigmusic.datasets.lyrics.DefaultDatasets.Batched.default_validation_dataset
    sample_rate: !ref <extra_params[sample_rate]>
    sample_duration: !ref <extra_params[duration]>
    batch_size: !ref <run_opts[batch_size]>
    lyrics_max_seq_len: !ref <extra_params[lyrics_max_seq_len]>
    url2index: hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/mcc/groupA-genrebalanced-val/groupA-genrebalanced-val-url2idx.txt
    style_conditions: style_text,lyrics_tokens
    enable_punctuation: True

pl_datamodule: !new:recipes.bigmusic.datasets.lyrics.LyricsDataModule
    predict_dataset: !ref <predict_dataset>
    num_workers: 0

pl_module: !new:recipes.bigmusic.lightning.inference.SemanticInferenceModuleDualUMMFull
    semantic_cls_path: !ref <extra_params[semantic_cls_path]>
    extra_params: !ref <extra_params>
    required_modules:
        dualumm_modules:
            mel_vocoder:
                hpath: "hdfs://haruna/home/byte_data_seed/lf_lq/speech/user/renyi/samantha_ckpts/voc/v1/checkpoints/last.ckpt"
                initializer: !name:recipes.umm.requires.model_initializer.init_stage3_dual_voc
                    cache_dir: !ref <run_opts[cache_dir]>
        reranker:
            hpath:
                rewards:
                    style_text: 1.0
                    qualitative: 1.0
                    wer: 1.0
                    #structure: 1.0
                    #chord: 4.0
                required_modules:
                    mulan:
                        hpath: !ref <extra_params[mulan_rewards_ckpt]>
                        initializer: !name:recipes.musiclm.requires.model_initializer.init_mulan
                            version: "g4"
                    asr:
                        hpath: en_punc
                        initializer: !name:recipes.bigmusic.utils.metrics_asr.init_asr
                    #structure:
                    #    hpath: !ref <extra_params[structure_ckpt]>
                    #    initializer: !name:recipes.structure.requires.model_initializer.init_structure
                    #chord:
                    #    hpath: "/mnt/bn/audio-diffusion/ducle/recipes/diffusion/assets/semi-sup-chord_epoch=103-step=56300.ckpt"
                    #    initializer: !name:recipes.chord.requires.model_initializer.init_chord
                    #chord_lms:
                    #    hpath:
                    #        default: "/mnt/bn/audio-diffusion/ducle/data/billboard_v1_chords_allsegs_genre_prefix/default/lm.arpa"
                    #    initializer: !name:recipes.chord.requires.model_initializer.init_chord_lms
            initializer: !name:recipes.bigmusic.utils.reranker.init_reranker
                cache_dir: !ref <run_opts[cache_dir]>

# separating out additional_callbacks so auto_eval can disable metrics
additional_callbacks:
    - !new:recipes.bigmusic.callbacks.wer_metrics.WERMetricsCallback
    - !new:recipes.bigmusic.callbacks.mcs_metrics.MCSMetricsCallback
    - !new:recipes.bigmusic.callbacks.save_outputs.AverageMetricsCallback
    - !new:recipes.bigmusic.callbacks.save_outputs.SaveVideoCallback
    - !new:recipes.bigmusic.callbacks.save_outputs.NormVolumeCallback
callbacks:
    - !new:recipes.bigmusic.callbacks.save_outputs.SaveOutputsCallback
      beam_size: !ref <extra_params[beam_size]>
      samples_to_save: !ref <extra_params[samples_to_save]>

trainer: !new:pytorch_lightning.Trainer
    fast_dev_run: !ref <run_opts[fast_dev_run]>
    accelerator: !ref <run_opts[accelerator]>
    devices: 'auto'
    num_nodes: !apply:samantha.utils.envs.getenv_int ["ARNOLD_WORKER_NUM", 1]
    deterministic: False
    enable_model_summary: True
    use_distributed_sampler: False # for multi-gpu inference
    strategy: !ref <run_opts[strategy]>
    precision: !ref <run_opts[precision]>
    callbacks: !apply:operator.add [!ref <callbacks>, !ref <additional_callbacks>]
    limit_predict_batches: 20
