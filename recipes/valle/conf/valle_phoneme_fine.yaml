---

################################################################################
##########                       BASIC CONFIGURATION                  ##########
################################################################################

seed: 42
__set_seed: !apply:pytorch_lightning.seed_everything [!ref <seed>]

################################################################################
##########                    TRAINING CONFIGURATION                  ##########
################################################################################
run_opts:
    log_dir: logs
    fast_dev_run: False
    tensorboard_dir: !ref <run_opts[log_dir]>
    log_name: debug
    version: 0.3
    precision: 32
    accelerator: auto
    strategy: ddp_find_unused_parameters_false
    cache_dir: .module_cache/llm_debug/
    profiler: simple
    flash_attn: null
    num_epochs: 100
    batch_size: 10
    num_workers: 8
    learning_rate: 0.0003
    weight_decay: 0.1
    checkpointing: False

hp:
    max_token_lens: 2048
    audio_tokens_num: 1024
    phone_tokens_num: 200
    mask_input_for_train: false
    mask_input_for_val: true
    lr: !ref <run_opts[learning_rate]>
    weight_decay: 0.1

_checkpointing: !ref <run_opts[checkpointing]>

# gpt hyper-config
nar_config:
    vocab_size: 1227 # audio_tokens_num + phone_tokens_num + 3
    n_positions: 2048
    n_ctx: 2048
    n_embd: 1024
    n_layer: 12
    n_head: 16
    num_res: 6
    audio_token_num: !ref <hp[audio_tokens_num]>
    num_units: !ref <hp[phone_tokens_num]>

train_dataset: !new:recipes.valle.datasets.GPT2TTSDataset
    path: !ref <run_opts[train_meta_lst]>
    hp: !ref <hp>
    return_full_seq: !ref <run_opts[return_full_seq]>

val_dataset: !new:recipes.valle.datasets.GPT2TTSDataset
    path: !ref <run_opts[valid_meta_lst]>
    hp: !ref <hp>
    return_full_seq: !ref <run_opts[return_full_seq]>

collator: !new:recipes.valle.datasets.ValleCollator
    tokenizer_pad: 0

# dataloader configuration
train_dataloader: !new:torch.utils.data.DataLoader
    dataset: !ref <train_dataset>
    batch_size: !ref <run_opts[batch_size]>
    num_workers: !ref <run_opts[num_workers]>
    collate_fn: !ref <collator>
    shuffle: True
    drop_last: True
    pin_memory: True

val_dataloader: !new:torch.utils.data.DataLoader
    dataset: !ref <val_dataset>
    batch_size: !ref <run_opts[batch_size]>
    num_workers: !ref <run_opts[num_workers]>
    collate_fn: !ref <collator>
    shuffle: False
    drop_last: False
    pin_memory: True

# datamodule configuration
pl_datamodule: !new:recipes.valle.lit_modules.DataModule
    train_dataloader: !ref <train_dataloader>
    val_dataloader: !ref <val_dataloader>

# model configuration
model_cls: !name:recipes.valle.modules.VALLENAR
    hp: !ref <nar_config>

# training module configuration
optimizer_cls: !name:torch.optim.AdamW
    lr: !ref <run_opts[learning_rate]>
    weight_decay: !ref <run_opts[weight_decay]>
    betas: [0.9, 0.95]
    eps: 0.00000001

_steps_per_epoch: !apply:operator.length_hint [!ref <train_dataloader>]
_world_size: !apply:recipes.valle.utils.env.getenv_int ["WORLD_SIZE", 1]
scheduler_cls: !name:recipes.valle.lr_schedulers.lr_scheduler.WarmupCosine
    init_lr: !ref <run_opts[learning_rate]>
    warmup_steps: 10000
    cycle_steps: 1000000
    min_lr: !ref <run_opts[learning_rate]> * 0.1

pl_module: !new:recipes.valle.lit_modules.ValleFine
    checkpointing: !ref <run_opts[checkpointing]>
    model_cls: !ref <model_cls>
    optimizer_cls: !ref <optimizer_cls>
    scheduler_cls: !ref <scheduler_cls>
    criterion_cls: !name:recipes.valle.modules.MaskedCrossEntropy
    extra_params: !ref <hp>
    required_modules:

logger: !new:pytorch_lightning.loggers.TensorBoardLogger
    save_dir: !ref <run_opts[tensorboard_dir]>
    name: !ref <run_opts[log_name]>
    version: !ref <run_opts[version]>

callbacks:
    - !new:pytorch_lightning.callbacks.ModelCheckpoint
      every_n_train_steps: 10000
      mode: min
      save_last: True
      save_top_k: 5
      save_on_train_epoch_end: True
      verbose: True
      monitor: "val_loss"
      filename: "{epoch:02d}-{step}-{val_loss:.2f}"
    - !new:pytorch_lightning.callbacks.LearningRateMonitor
      logging_interval: 'step'

trainer: !new:pytorch_lightning.Trainer
    fast_dev_run: !ref <run_opts[fast_dev_run]>
    logger: !ref <logger>
    accelerator: !ref <run_opts[accelerator]>
    devices: 'auto'
    num_nodes: !apply:os.getenv ["ARNOLD_WORKER_NUM", 1]
    deterministic: False  # warning: setting to True can cause slowdowns
    enable_model_summary: True
    log_every_n_steps: 50
    accumulate_grad_batches: 1
    strategy: !ref <run_opts[strategy]>
    max_epochs: !ref <run_opts[num_epochs]>
    precision: !ref <run_opts[precision]>
    profiler: !ref <run_opts[profiler]>
    callbacks: !ref <callbacks>
    gradient_clip_val: 1.0
    track_grad_norm: 2.0
    val_check_interval: 5000

ckpt_path: null
