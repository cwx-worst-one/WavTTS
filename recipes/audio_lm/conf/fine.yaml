---

################################################################################
##########                       BASIC CONFIGURATION                  ##########
################################################################################

hp: !include:hparams.yaml

seed: 42
__set_seed: !apply:pytorch_lightning.seed_everything [!ref <seed>]
################################################################################
##########                    TRAINING CONFIGURATION                  ##########
################################################################################
run_opts:
    log_dir: logs
    fast_dev_run: False
    tensorboard_dir: !ref <run_opts[log_dir]>
    log_name: fine
    version: 0.1
    precision: 32
    accelerator: auto
    strategy: ddp_find_unused_parameters_false
    cache_dir: .module_cache
    profiler: simple
    flash_attn: null
    num_epochs: 100
    batch_size: 2
    num_workers: 8
    learning_rate: 0.0001
    weight_decay: 0.001
    checkpointing: False
_checkpointing: !ref <run_opts[checkpointing]>

# gpt hyper-config
gpt_config: !new:transformers.GPT2Config
    vocab_size: !ref <hp[num_res]> * 1024 + 1
    n_positions: 6000
    n_ctx: 6000
    n_embd: 1024
    n_layer: 20
    n_head: 8
    activation_function: gelu_new
    resid_pdrop: 0.1
    embd_pdrop: 0.1
    attn_pdrop: 0.1
    layer_norm_epsilon: 0.00001
    initializer_range: 0.02
    summary_type: mean
    summary_use_proj: True
    summary_activation: None
    summary_proj_to_labels: True
    summary_first_dropout: 0.1
    bos_token_id: 1225
    eos_token_id: 1225
    use_cache: !apply:operator.not_ [!ref <_checkpointing>]

train_dataset: !new:recipes.audio_lm.datasets.AudioLMDataset
    sample_rate: 24000
    sample_duration: 10
    meta_paths:
        - /mnt/bd/litang-lq-music-npy11/15m_filter_trim.txt
        - /mnt/bn/diff-music-data-b25af381/9M-aed-sieved-metalist.txt

# dataloader configuration
train_dataloader: !new:torch.utils.data.DataLoader
    dataset: !ref <train_dataset>
    batch_size: !ref <run_opts[batch_size]>
    num_workers: !ref <run_opts[num_workers]>
    shuffle: True
    drop_last: True
    pin_memory: True

# datamodule configuration
pl_datamodule: !new:recipes.audio_lm.lit_modules.DataModule
    train_dataloader: !ref <train_dataloader>

# model configuration
model_cls: !name:recipes.audio_lm.modules.LanguageModel
    config: !ref <gpt_config>
    flash_attn: !ref <run_opts[flash_attn]>
    logit_num: !ref <gpt_config[vocab_size]>
    use_cond: False


# training module configuration
optimizer_cls: !name:torch.optim.AdamW
    lr: !ref <run_opts[learning_rate]>
    weight_decay: !ref <run_opts[weight_decay]>

_steps_per_epoch: !apply:operator.length_hint [!ref <train_dataloader>]
_world_size: !apply:recipes.audio_lm.utils.env.getenv_int ["WORLD_SIZE", 1]
scheduler_cls: !name:torch.optim.lr_scheduler.OneCycleLR
    pct_start: 0.005
    max_lr: !ref <run_opts[learning_rate]>
    epochs: !ref <run_opts[num_epochs]>
    steps_per_epoch: !apply:operator.floordiv [!ref <_steps_per_epoch>, !ref <_world_size>]

pl_module: !new:recipes.audio_lm.lit_modules.v1.FineModule
    checkpointing: !ref <run_opts[checkpointing]>
    model_cls: !ref <model_cls>
    optimizer_cls: !ref <optimizer_cls>
    scheduler_cls: !ref <scheduler_cls>
    criterion_cls: !name:recipes.audio_lm.modules.MaskedCrossEntropy
    sample_duration: !ref <train_dataset[sample_duration]>
    extra_params: !ref <hp>
    required_modules:
        sound_stream:
            - hdfs://haruna/home/byte_speech_sv/user/wangxin.colin/pretrained/sound_stream_1000k/
            - !name:recipes.audio_lm.requires.model_initializer.init_sound_stream
              cache_dir: !ref <run_opts[cache_dir]>

logger: !new:pytorch_lightning.loggers.TensorBoardLogger
    save_dir: !ref <run_opts[tensorboard_dir]>
    name: !ref <run_opts[log_name]>
    version: !ref <run_opts[version]>

callbacks:
    - !new:pytorch_lightning.callbacks.ModelCheckpoint
      every_n_train_steps: 1000
      mode: min
      save_last: True
      save_top_k: 1000
      save_on_train_epoch_end: True
      verbose: True
      monitor: tr_loss
      filename: "{epoch:02d}-{step}-{tr_loss:.2f}"
    - !new:pytorch_lightning.callbacks.LearningRateMonitor
      logging_interval: 'step'

trainer: !new:pytorch_lightning.Trainer
    fast_dev_run: !ref <run_opts[fast_dev_run]>
    logger: !ref <logger>
    accelerator: !ref <run_opts[accelerator]>
    devices: 'auto'
    num_nodes: !apply:os.getenv ["ARNOLD_WORKER_NUM", 1]
    deterministic: False  # warning: setting to True can cause slowdowns
    enable_model_summary: True
    log_every_n_steps: 50
    strategy: !ref <run_opts[strategy]>
    max_epochs: !ref <run_opts[num_epochs]>
    precision: !ref <run_opts[precision]>
    profiler: !ref <run_opts[profiler]>
    callbacks: !ref <callbacks>
    gradient_clip_val: 1.0
    track_grad_norm: 2.0

ckpt_path: null
