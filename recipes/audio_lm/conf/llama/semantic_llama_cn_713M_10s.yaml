---

################################################################################
##########                       BASIC CONFIGURATION                  ##########
################################################################################

hp: !include:../hparams_x480.yaml

seed: 42
__set_seed: !apply:pytorch_lightning.seed_everything [!ref <seed>]

################################################################################
##########                    TRAINING CONFIGURATION                  ##########
################################################################################
run_opts:
    log_dir: /mnt/bn/zongyu-lq/logs
    fast_dev_run: False
    tensorboard_dir: !ref <run_opts[log_dir]>
    log_name: semantic_llama
    version: 713M
    precision: 16
    accelerator: auto
    strategy: ddp_find_unused_parameters_false
    cache_dir: .module_cache/musiclm_3ar_1024x12
    profiler: simple
    flash_attn: null
    num_epochs: 100
    batch_size: 54
    num_workers: 8
    learning_rate: 0.0005
    weight_decay: 0.001
    checkpointing: False
    hdfs_path: null
_checkpointing: !ref <run_opts[checkpointing]>

# llama hyper-config
llama_config: !new:transformers.LlamaConfig
    vocab_size: 2049
    hidden_size: 1280
    intermediate_size: 5120
    num_hidden_layers: 27
    num_attention_heads: 20
    max_position_embeddings: 260
    use_cache: !apply:operator.not_ [!ref <_checkpointing>]

train_dataset: !new:recipes.audio_lm.datasets.AudioLMDataset
    sample_rate: 24000
    sample_duration: 10
    meta_paths:
        - /mnt/bd/litang-lq-music-npy11/15m_filter_trim.txt
        - /mnt/bn/diff-music-data-b25af381/9M-aed-sieved-metalist.txt
        - /mnt/bn/audio-diffusion/data/musiccaps/musiccaps_list.txt

# dataloader configuration
train_dataloader: !new:torch.utils.data.DataLoader
    dataset: !ref <train_dataset>
    batch_size: !ref <run_opts[batch_size]>
    num_workers: !ref <run_opts[num_workers]>
    shuffle: True
    drop_last: True
    pin_memory: True

# datamodule configuration
pl_datamodule: !new:recipes.audio_lm.lit_modules.DataModule
    train_dataloader: !ref <train_dataloader>

# model configuration
model_cls: !name:recipes.audio_lm.modules.LlamaForCausalLM
    config: !ref <llama_config>

# training module configuration
optimizer_cls: !name:torch.optim.AdamW
    lr: !ref <run_opts[learning_rate]>
    weight_decay: !ref <run_opts[weight_decay]>
    betas: [0.9, 0.96]
    eps: 0.00000001

_steps_per_epoch: !apply:operator.length_hint [!ref <train_dataloader>]
_world_size: !apply:recipes.audio_lm.utils.env.getenv_int ["WORLD_SIZE", 1]
scheduler_cls: !name:recipes.audio_lm.lr_schedulers.musiclm_lr_scheduler.WarmupCosine
    init_lr: !ref <run_opts[learning_rate]>
    warmup_steps: 2000
    cycle_steps: 1000000
    min_lr: !ref <run_opts[learning_rate]> * 0.1

pl_module: !new:recipes.audio_lm.lit_modules.v3_1.lit_semantic.SemanticModule
    checkpointing: !ref <run_opts[checkpointing]>
    model_cls: !ref <model_cls>
    optimizer_cls: !ref <optimizer_cls>
    scheduler_cls: !ref <scheduler_cls>
    criterion_cls: !name:recipes.audio_lm.modules.MaskedCrossEntropy
    extra_params: !ref <hp>
    required_modules:
        mulan:
            - hdfs://haruna/home/byte_speech_sv/user/dongguo/aigc/musicLM/mulan-191/mulan-step=042400-median_rank_0=191-kaggle.ckpt
            - !name:recipes.audio_lm.requires.model_initializer_new.init_mulan
              cache_dir: !ref <run_opts[cache_dir]>
        mulan_centers:
            - hdfs://haruna/home/byte_speech_sv/user/dongguo/aigc/musicLM/mulan-191/kmeans_minibatch_codebook_mulan_multi_dset_191.npy
            - !name:recipes.audio_lm.requires.model_initializer_new.init_mulan_centers
              cache_dir: !ref <run_opts[cache_dir]>
        w2v:
            - hdfs://haruna/home/byte_speech_sv/user/litang/mulan/2023-03-11_audio_emb_asset6
            - !name:recipes.audio_lm.requires.model_initializer_new.init_w2v
              cache_dir: !ref <run_opts[cache_dir]>

logger: !new:pytorch_lightning.loggers.TensorBoardLogger
    save_dir: !ref <run_opts[tensorboard_dir]>
    name: !ref <run_opts[log_name]>
    version: !ref <run_opts[version]>

callbacks:
    - !new:pytorch_lightning.callbacks.ModelCheckpoint
      every_n_train_steps: 1000
      mode: max
      save_last: True
      save_top_k: 10
      save_on_train_epoch_end: True
      verbose: True
      monitor: accu
      filename: "{epoch:02d}-{step}-{accu:.2f}"
    - !new:pytorch_lightning.callbacks.LearningRateMonitor
      logging_interval: 'step'
    - !new:recipes.audio_lm.callbacks.hdfs_callback.HdfsSavingCallback
      hdfs_path: !ref <run_opts[hdfs_path]>
      save_dir: !ref <run_opts[tensorboard_dir]>
      name: !ref <run_opts[log_name]>
      version: !ref <run_opts[version]>
      n_log: 1000

trainer: !new:pytorch_lightning.Trainer
    fast_dev_run: !ref <run_opts[fast_dev_run]>
    logger: !ref <logger>
    accelerator: !ref <run_opts[accelerator]>
    devices: 'auto'
    num_nodes: !apply:samantha.utils.envs.getenv_int ["ARNOLD_WORKER_NUM", 1]
    deterministic: False  # warning: setting to True can cause slowdowns
    enable_model_summary: True
    log_every_n_steps: 50
    strategy: !ref <run_opts[strategy]>
    max_epochs: !ref <run_opts[num_epochs]>
    precision: !ref <run_opts[precision]>
    profiler: !ref <run_opts[profiler]>
    callbacks: !ref <callbacks>
    gradient_clip_val: 1.0
    track_grad_norm: 2.0

ckpt_path: null
