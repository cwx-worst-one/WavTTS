---

################################################################################
##########                       BASIC CONFIGURATION                  ##########
################################################################################

hp: !include:../hparams_x480.yaml

seed: 1996
__set_seed: !apply:pytorch_lightning.seed_everything [!ref <seed>]

################################################################################
##########                    TRAINING CONFIGURATION                  ##########
################################################################################
run_opts:
    log_dir: /mnt/bn/zongyu-lq/logs
    fast_dev_run: False
    tensorboard_dir: !ref <run_opts[log_dir]>
    log_name: semantic_sparse_gpt_finetune
    version: 429M
    precision: 16
    accelerator: auto
    strategy: ddp_find_unused_parameters_false
    cache_dir: .module_cache/musiclm_3ar_1024x12
    profiler: simple
    flash_attn: null
    num_epochs: 100
    batch_size: 62
    num_workers: 8
    sample_buffer_size: 600
    learning_rate: 0.0001
    weight_decay: 0.1
    checkpointing: False
    mulan_token_sep: True
    hdfs_path: null
_checkpointing: !ref <run_opts[checkpointing]>

# gpt hyper-config
gpt_config: !new:transformers.GPT2Config
    vocab_size: 13313
    n_positions: 288
    n_ctx: 288
    n_embd: 1152
    n_layer: 26
    n_head: 18
    activation_function: gelu_new
    resid_pdrop: 0.0
    embd_pdrop: 0.0
    attn_pdrop: 0.1
    norm_fn: "rms_norm" # layer_norm, rms_norm
    layer_norm_epsilon: 0.00001
    initializer_range: 0.02
    c_attn_bias: False
    pos_type: "rope_attn" # learnable, rope, rope_attn
    qk_bias: False
    # train_len for block sparse attention
    train_len: 288
    layout_fn: "semantic_10s_layout"
    mask_file: "semantic_10s_mask_v4.npy"
    use_cache: !apply:operator.not_ [!ref <_checkpointing>]

mcc_gpt_dataset: !new:recipes.audio_lm.datasets.mcc_gpt.MCCGPTGenDataset
    resampled: True

aed_gpt_dataset: !new:recipes.audio_lm.datasets.mcc_gpt.AEDGPTGenDataset
    resampled: True

mcc_n2m_dataset: !new:recipes.audio_lm.datasets.mcc_gpt.MCCN2MDataset
    resampled: True

train_datasets:
    mcc_gpt: !ref <mcc_gpt_dataset>
    aed_gpt: !ref <aed_gpt_dataset>
    mcc_n2m: !ref <mcc_n2m_dataset>

selected_dataset_names: [mcc_gpt, aed_gpt, mcc_n2m]
weights: [0.3, 0.3, 0.3]

train_dataset: !new:samantha.dataio.dataset.MultiIterableDatasetWithSampling
    datasets: !apply:recipes.audio_lm.datasets.utils.select_datasets
        - !ref <train_datasets>
        - !ref <selected_dataset_names>
    weights: !ref <weights>
    num_samples: 10_000_000
    seed: !ref <seed>

# datamodule configuration
pl_datamodule: !new:recipes.audio_lm.lit_modules.GPTDataModule
    train_dataset: !ref <train_dataset>
    batch_size: !ref <run_opts[batch_size]>
    sample_buffer_size: !ref <run_opts[sample_buffer_size]>

# model configuration
model_cls: !name:recipes.audio_lm.modules.sparse_gpt2.GPT2LMHeadSparseModel
    config: !ref <gpt_config>
    flash_attn: !ref <run_opts[flash_attn]>
    logit_num: !ref <gpt_config[vocab_size]>
    use_cond: False
    cond_dim: 128
    cond_type: linear

# training module configuration
optimizer_cls: !name:torch.optim.AdamW
    lr: !ref <run_opts[learning_rate]>
    weight_decay: !ref <run_opts[weight_decay]>
    betas: [0.9, 0.95]
    eps: 0.00000001

# _steps_per_epoch: !apply:operator.length_hint [!ref <train_dataloader>]
_world_size: !apply:recipes.audio_lm.utils.env.getenv_int ["WORLD_SIZE", 1]
scheduler_cls: !name:recipes.audio_lm.lr_schedulers.musiclm_lr_scheduler.WarmupCosine
    init_lr: !ref <run_opts[learning_rate]>
    warmup_steps: 2000
    cycle_steps: 1000000
    min_lr: !ref <run_opts[learning_rate]> * 0.1

pl_module: !new:recipes.audio_lm.lit_modules.v4_2.lit_semantic.SemanticModule
    checkpointing: !ref <run_opts[checkpointing]>
    model_cls: !ref <model_cls>
    base_model_path: "/mnt/bn/zongyu-lq/ckpts/musiclm/semantic_sparse_mulan247_429M_epoch=24-step=98000-accu=36.86.pt"
    optimizer_cls: !ref <optimizer_cls>
    scheduler_cls: !ref <scheduler_cls>
    criterion_cls: !name:recipes.audio_lm.modules.MaskedCrossEntropy
    extra_params: !ref <hp>
    mulan_token_sep: !ref <run_opts[mulan_token_sep]>
    required_modules:
        mulan:
            - hdfs://harunava/home/byte_speech_sv/dongguo/mulan/gpt_texts/MuLan/MCC-GPT-N2M-0329-128V100/checkpoints/mulan-step=033600-median_rank_0=247-kaggle.ckpt
            - !name:recipes.audio_lm.requires.model_initializer.init_mulan
              cache_dir: !ref <run_opts[cache_dir]>
              version: "247"
        mulan_centers:
            - hdfs://harunava/home/byte_speech_sv/dongguo/mulan/codebook/kmeans_minibatch_codebook-mulan249-1024x12.npy
            - !name:recipes.audio_lm.requires.model_initializer.init_mulan_centers
              cache_dir: !ref <run_opts[cache_dir]>
        w2v:
            - hdfs://harunava/home/byte_speech_sv/zongyu.yin/ckpts/w2v/2.0
            - !name:recipes.audio_lm.requires.model_initializer.init_w2v
              cache_dir: !ref <run_opts[cache_dir]>

logger: !new:pytorch_lightning.loggers.TensorBoardLogger
    save_dir: !ref <run_opts[tensorboard_dir]>
    name: !ref <run_opts[log_name]>
    version: !ref <run_opts[version]>

callbacks:
    - !new:pytorch_lightning.callbacks.ModelCheckpoint
      every_n_train_steps: 1000
      mode: max
      save_last: True
      save_top_k: 10
      save_on_train_epoch_end: True
      verbose: True
      monitor: accu
      filename: "{epoch:02d}-{step}-{accu:.2f}"
    - !new:pytorch_lightning.callbacks.LearningRateMonitor
      logging_interval: 'step'
    - !new:recipes.audio_lm.callbacks.hdfs_callback.HdfsSavingCallback
      hdfs_path: !ref <run_opts[hdfs_path]>
      save_dir: !ref <run_opts[tensorboard_dir]>
      name: !ref <run_opts[log_name]>
      version: !ref <run_opts[version]>
      n_log: 1000

trainer: !new:pytorch_lightning.Trainer
    fast_dev_run: !ref <run_opts[fast_dev_run]>
    logger: !ref <logger>
    accelerator: !ref <run_opts[accelerator]>
    devices: 'auto'
    num_nodes: !apply:os.getenv ["ARNOLD_WORKER_NUM", 1]
    deterministic: False  # warning: setting to True can cause slowdowns
    enable_model_summary: True
    log_every_n_steps: 50
    strategy: !ref <run_opts[strategy]>
    max_epochs: !ref <run_opts[num_epochs]>
    precision: !ref <run_opts[precision]>
    profiler: !ref <run_opts[profiler]>
    callbacks: !ref <callbacks>
    gradient_clip_val: 1.0
    track_grad_norm: 2.0

ckpt_path: null
