---

seed: 42
__set_seed: !apply:pytorch_lightning.seed_everything [!ref <seed>]
ckpt_path: null

num_channels: 1
max_duration: 10
batch_size: 4
num_workers: 16
sample_rate: 44100
log_name: "diff/default"
version: !applyref:samantha.utils.experiment.get_version_name
# log_dir: "/mnt/bn/janne-research-xl/logs"
# hdfs_log_dir: !ref "hdfs://harunava/home/byte_data_seed_us/hdd_va/speech/data/js/logs/<log_name>/<version>"
log_dir: "logs"
hdfs_log_dir: !ref "hdfs://haruna/home/byte_data_seed/lf_lq/speech/data/js/logs/<log_name>/<version>"

# pl_datamodule: !new:recipes.datasets.libritts.LibriTTSWebDataModule
#   sample_rate: !ref <sample_rate>
#   batch_size: !ref <batch_size>
#   shuffle_buffer_size: 100
#   buckets_sec: [2, 5, 10]
#   use_bucket_batcher: True
#   resampled: True
#   shardshuffle: True
#   num_workers: !ref <num_workers>


speech_train: !new:recipes.research.dataset.parquet_dataset.AudioParquetDataset
  data_id: 2656 # US: 201
  sample_rate: !ref <sample_rate>
  shuffle_buffer_size: 10
  channels: !ref <num_channels>
  pad: False
  segment_duration: null
  resampled: True
  shardshuffle: True
  buckets_sec: [5, 6, 8, 10]
  batch_size: !ref <batch_size>

speech_test: !new:recipes.research.dataset.parquet_dataset.AudioParquetDataset
  data_id: 2656 # US: 197
  sample_rate: !ref <sample_rate>
  shuffle_buffer_size: 10
  channels: !ref <num_channels>
  pad: False
  segment_duration: null
  resampled: True
  shardshuffle: True
  buckets_sec: [5, 6, 8, 10]
  batch_size: !ref <batch_size>

pl_datamodule: !new:samantha.data.audio.dataset.AudioFolderDataModule
  train_datasets:
    - !ref <speech_train>
  validation_datasets:
    - !ref <speech_test>
  test_datasets:
    - !ref <speech_test>
  weights: null
  batch_size: !ref <batch_size>
  shuffle: null
  num_workers: !ref <num_workers>

pl_module: !new:recipes.research.diff.DiffLyricsDur
  config: !new:recipes.research.diff.DiffConfig
    sample_rate: !ref <sample_rate>
    max_duration: !ref <max_duration>
    n_embd: 1536
    n_layer: 32
    n_head: 24
    noise_scale_factor: 1.0
    use_text: True

logger:
  - !new:pytorch_lightning.loggers.tensorboard.TensorBoardLogger
    save_dir: !ref <log_dir>
    name: !ref <log_name>
    version: !ref <version>
    default_hp_metric: False
  - !new:pytorch_lightning.loggers.WandbLogger
    save_dir: !ref <log_dir>
    project: !apply:samantha.utils.experiment.wandb_sanitize [!ref <log_name>]
    name: !apply:samantha.utils.experiment.wandb_sanitize [!ref <version>]

checkpoint: !new:samantha.callbacks.HDFSModelCheckpoint
  hdfs_path: !ref <hdfs_log_dir>
  monitor: step
  save_top_k: 100
  save_last: True
  every_n_train_steps: !ref <trainer[val_check_interval]>
  mode: max
  filename: "{step:06d}"

lr_monitor: !new:pytorch_lightning.callbacks.LearningRateMonitor
  logging_interval: 'step'

plugins:
  - !new:samantha.plugins.torch_io.LargeTorchCheckpointIO

trainer: !new:pytorch_lightning.Trainer
  strategy: ddp_find_unused_parameters_false
  sync_batchnorm: True
  logger: !ref <logger>
  num_nodes: !apply:samantha.utils.envs.getenv_int ["ARNOLD_WORKER_NUM", 1]
  enable_model_summary: True
  max_epochs: -1
  max_steps: 1000000
  precision: bf16-mixed
  val_check_interval: 10000
  limit_val_batches: 50
  limit_train_batches: 5000
  check_val_every_n_epoch: null
  gradient_clip_val: 0.2
  callbacks:
    - !ref <checkpoint>
    - !ref <lr_monitor>
  plugins: !ref <plugins>
