billboard_v2_train: !new:recipes.research.dataset.parquet_dataset.AudioParquetDataset
  data_id: 2741
  sample_rate: !ref <sample_rate>
  shuffle_buffer_size: 10
  channels: !ref <num_channels>
  pad: True
  segment_duration: !ref <max_duration>
  min_audio_duration: !ref <min_duration>
  max_audio_duration: !ref <max_duration>
  resampled: True
  shardshuffle: True
  use_lyrics: True

billboard_v2_test: !new:recipes.research.dataset.parquet_dataset.AudioParquetDataset
  data_id: 2741
  sample_rate: !ref <sample_rate>
  shuffle_buffer_size: 10
  channels: !ref <num_channels>
  pad: True
  segment_duration: !ref <max_duration>
  min_audio_duration: !ref <min_duration>
  max_audio_duration: !ref <max_duration>
  resampled: True
  shardshuffle: True
  use_lyrics: True

pl_datamodule: !new:samantha.data.audio.dataset.AudioFolderDataModule
  train_datasets:
    - !ref <billboard_v2_train>
  validation_datasets:
    - !ref <billboard_v2_test>
  test_datasets:
    - !ref <billboard_v2_test>
  weights: null
  batch_size: !ref <batch_size>
  shuffle: null
  num_workers: !ref <num_workers>

pl_module: !new:recipes.research.diff.DiffLyrics
  config: !new:recipes.research.diff.DiffConfig
    sample_rate: !ref <sample_rate>
    max_duration: !ref <max_duration>
    n_embd: 1536
    n_layer: 32
    n_head: 24
    noise_scale_factor: 1.0

logger:
  - !new:pytorch_lightning.loggers.tensorboard.TensorBoardLogger
    save_dir: !ref <log_dir>
    name: !ref <log_name>
    version: !ref <version>
    default_hp_metric: False
  - !new:pytorch_lightning.loggers.WandbLogger
    save_dir: !ref <log_dir>
    project: !apply:samantha.utils.experiment.wandb_sanitize [!ref <log_name>]
    name: !apply:samantha.utils.experiment.wandb_sanitize [!ref <version>]

checkpoint: !new:samantha.callbacks.HDFSModelCheckpoint
  hdfs_path: !ref <hdfs_log_dir>
  monitor: step
  save_top_k: 100
  save_last: True
  every_n_train_steps: !ref <trainer[val_check_interval]>
  mode: max
  filename: "{step:06d}"

# audio_demo: !new:recipes.research.diff.callback.LyricsSampleCallback
#   n_batches: 2

lr_monitor: !new:pytorch_lightning.callbacks.LearningRateMonitor
  logging_interval: 'step'

plugins:
  - !new:samantha.plugins.torch_io.LargeTorchCheckpointIO

trainer: !new:pytorch_lightning.Trainer
  strategy: ddp_find_unused_parameters_false
  sync_batchnorm: True
  logger: !ref <logger>
  num_nodes: !apply:samantha.utils.envs.getenv_int ["ARNOLD_WORKER_NUM", 1]
  enable_model_summary: True
  max_epochs: -1
  max_steps: 1000000
  precision: bf16-mixed
  val_check_interval: 10000
  limit_val_batches: 50
  limit_train_batches: 5000 # TODO: quick patch to avoid memleak
  check_val_every_n_epoch: null
  gradient_clip_val: 0.2
  callbacks:
    - !ref <checkpoint>
    - !ref <lr_monitor>
    # - !ref <audio_demo>
  plugins: !ref <plugins>
