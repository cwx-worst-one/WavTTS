---

################################################################################
##########                       BASIC CONFIGURATION                  ##########
################################################################################

seed: 1995
__set_seed: !apply:pytorch_lightning.seed_everything [!ref <seed>]
__set_float32_matmul_precision: !apply:torch.set_float32_matmul_precision ['high']

extra_params:
    output_dir: ./generated_output/conditional
    # Vocal - Mulan Latest Vocals - Mixture only - partial 60m
    # coarse_ckpt: "/mnt/bn/lyrics-to-song/ashaw/logs/l2s/coarse/mulan_phoneme_coarse_conditional/embed_mulan_coarse_vocal_v2/checkpoints/last.ckpt"
    # Vocal - 300M params
    coarse_ckpt: "/mnt/bn/audio-diffusion/ashaw/logs/l2v_semantic/mulan_phoneme_coarse_conditional/300m_vocal_mulan_rank180/checkpoints/last.ckpt"
    # Fine - partial 60m balanced
    fine_ckpt: "/mnt/bn/lyrics-to-song/ashaw/logs/l2s/fine/fine_flash_llama_mcc_vocals/vocal_finetune_60m/checkpoints/last.ckpt"


    coarse_duration: 10
    fine_duration: 4
    coarse_stride: 5
    fine_stride: 3

    num_rounds: 1
    max_items: 16
    coarse_temperature: 0.9
    fine_temperature: 0.8
    sample_mode: "gumbel"
    inference_type: audio_prompt
    prompt_path: null
    conditions: audio_prompt,lyrics # text_prompt|audio_prompt,lyrics,mulan_vocals|soundstream_vocals,chroma
    use_continuous_embedding: True

    # Model Settings
    sample_rate: 24000
    duration: 10
    lyrics_max_seq_len: 150
    soundstream_codebook_size: 1024
    soundstream_frame_rate: 50
    num_coarse: 4
    num_fine: 8

run_opts:
    fast_dev_run: False
    precision: 32
    accelerator: auto
    strategy: auto
    cache_dir: .module_cache/musiclm/mulan_phoneme
    batch_size: 16
    num_workers: 8

################################################################################
##########                    TRAINING CONFIGURATION                  ##########
################################################################################

lyrics_tokenizer: !new:recipes.l2v.datasets.tokenizers.phoneme_tokenizer.PhonemeTokenizer
    allow_unknown: False

lyrics_collator: !new:recipes.l2v.datasets.lyrics.LyricsCollator
    lyrics_padding_value: !ref <lyrics_tokenizer.pad_id>
    lyrics_max_seq_len: !ref <extra_params[lyrics_max_seq_len]>
    audio_max_seq_len: !ref <extra_params[duration]> * <extra_params[sample_rate]>

predict_dataset: !apply:recipes.l2v.datasets.inference_dataset.CoarseInferenceDataset.default_dataset
    inference_type: !ref <extra_params[inference_type]>
    prompt_path: !ref <extra_params[prompt_path]>
    max_items: !ref <extra_params[max_items]>

pl_datamodule: !apply:recipes.l2v.datasets.inference_dataset.create_datamodule
    predict_dataset: !ref <predict_dataset>
    batch_size: !ref <run_opts[batch_size]>

pl_module: !new:recipes.l2v.lightning.inference.ConditionalMulanPhonemeInferenceModule
    extra_params: !ref <extra_params>
    required_modules:
        # mulan v1.3
        # mulan:
        #     - hdfs://harunava/home/byte_speech_sv/weitsung.lu/mulan_exp/MuLan_large/gpt_all/checkpoints/mulan-step=036000-median_rank_0=127-kaggle.ckpt
        #     - !name:recipes.musiclm.requires.model_initializer.init_mulan
        #       cache_dir: !ref <run_opts[cache_dir]>
        #       version: "g4"
        mulan_centers:
            hpath: hdfs://harunava/home/byte_speech_sv/dongguo/mulan/codebook/kmeans_minibatch_codebook-mulan1b_g4_mix_127-1024x12.npy
            initializer: !name:recipes.musiclm.requires.model_initializer.init_mulan_centers
                cache_dir: !ref <run_opts[cache_dir]>
        # Mulan latest vocal - rank 180
        mulan:
            hpath: /mnt/bn/audio-diffusion/mulan_exp/MuLan_large/mulan_0705_mmme/checkpoints/mulan-step=005000-median_rank_0=180-kaggle.ckpt
            initializer: !name:recipes.musiclm.requires.model_initializer.init_mulan
                cache_dir: !ref <run_opts[cache_dir]>
                version: "g4"
        soundstream_dec:
            hpath: hdfs://harunava/home/byte_speech_sv/zongyu.yin/ckpts/soundstream/190k
            initializer: !name:recipes.musiclm.requires.model_initializer.init_soundstream_decoder
                cache_dir: !ref <run_opts[cache_dir]>

trainer: !new:pytorch_lightning.Trainer
    fast_dev_run: !ref <run_opts[fast_dev_run]>
    accelerator: !ref <run_opts[accelerator]>
    devices: 'auto'
    num_nodes: !apply:os.getenv ["ARNOLD_WORKER_NUM", 1]
    deterministic: False
    enable_model_summary: True
    strategy: !ref <run_opts[strategy]>
    precision: !ref <run_opts[precision]>
