---

################################################################################
##########                       BASIC CONFIGURATION                  ##########
################################################################################

ckpt_path: null

seed: 555
__set_seed: !apply:pytorch_lightning.seed_everything [!ref <seed>]
__set_float32_matmul_precision: !apply:torch.set_float32_matmul_precision ['high']
_checkpointing: False

extra_params:
    sample_rate: 24000
    duration: 10
    soundstream_codebook_size: 1024
    soundstream_frame_rate: 50
    wav2vec_frame_rate: 25
    lyrics_max_seq_len: 1000
    num_coarse: 4
    semantic_type: best_rq
    semantic_layer_idx: 12
    use_cross_attn: False

# running parameters
run_opts:
    fast_dev_run: False
    log_dir: !apply:os.getenv ["ARNOLD_OUTPUT", "logs"]
    log_name: coarse_flash_gpt2_cross_attn
    version: karaoke_best_rq
    cache_dir: .module_cache/musiclm
    precision: 32
    num_workers: 16
    accelerator: auto
    val_check_interval: 2000
    max_steps: 1000000
    batch_size: 2
    learning_rate: 3.0e-4
    warmup_steps: 10000
    cycle_steps: 500000
    weight_decay: 0.01
    min_volume_threshold: 0.05
    shuffle_buffer: 50
    gradient_clip_val: 1.0

################################################################################
##########                    TRAINING CONFIGURATION                  ##########
################################################################################

pl_datamodule: !apply:recipes.l2v.datasets.lyrics.LyricsDataModule.wav_dataset
    batch_size: !ref <run_opts[batch_size]>
    sample_rate: !ref <extra_params[sample_rate]>
    sample_duration: !ref <extra_params[duration]>
    shuffle_buffer_size: !ref <run_opts[shuffle_buffer]>
    num_workers: !ref <run_opts[num_workers]>

# TODO: Update llama support by using inputs_embeds instead of encoder_hidden_states
# model_config: !new:transformers.LlamaConfig
#     vocab_size: !ref <extra_params[num_coarse]> * <extra_params[soundstream_codebook_size]> + 1
#     hidden_size: 1024
#     intermediate_size: 3072
#     num_hidden_layers: 16
#     num_attention_heads: 16
#     hidden_act: "silu"
#     max_position_embeddings: !ref <extra_params[wav2vec_frame_rate]> * <extra_params[duration]> + <extra_params[soundstream_frame_rate]> * <extra_params[num_coarse]> * <extra_params[duration]> + 1
#     initializer_range: 0.02
#     rms_norm_eps: 1e-6
#     use_cache: False
#     num_logits: !ref <extra_params[num_coarse]> * <extra_params[soundstream_codebook_size]> + 1

# model_cls: !name:samantha.models.flash_llama.LlamaForCausalLM
#     config: !ref <model_config>

# For GPT2 Comparison
model_config: !new:transformers.GPT2Config
    vocab_size: !ref <extra_params[num_coarse]> * <extra_params[soundstream_codebook_size]> + 1
    n_positions: !ref <extra_params[wav2vec_frame_rate]> * <extra_params[duration]> + <extra_params[soundstream_frame_rate]> * <extra_params[num_coarse]> * <extra_params[duration]> + 1
    n_embd: 1024
    n_layer: 16
    n_head: 16
    activation_function: gelu_new
    resid_pdrop: 0.0
    embd_pdrop: 0.0
    attn_pdrop: 0.0
    layer_norm_epsilon: 0.00001
    initializer_range: 0.02
    add_cross_attention: True
    use_cache: !apply:operator.not_ [!ref <_checkpointing>]
    tie_word_embeddings: False

model_cls: !name:samantha.models.flash_gpt2.GPT2LMHeadModel
    config: !ref <model_config>

optimizer_cls: !name:torch.optim.AdamW
    lr: !ref <run_opts[learning_rate]>
    weight_decay: !ref <run_opts[weight_decay]>
    betas: [0.9, 0.96]
    eps: 0.00000001

scheduler_cls: !name:recipes.musiclm.optim.lr_scheduler.warmup_cosine_lr.WarmupCosine
    init_lr: !ref <run_opts[learning_rate]>
    warmup_steps: !ref <run_opts[warmup_steps]>
    cycle_steps: !ref <run_opts[cycle_steps]>
    min_lr: !ref <run_opts[learning_rate]> * 0.1

pl_module: !new:recipes.musiclm.lightning.modules.CoarseCrossAttnModule
    checkpointing: !ref <_checkpointing>
    model_cls: !ref <model_cls>
    optimizer_cls: !ref <optimizer_cls>
    scheduler_cls: !ref <scheduler_cls>
    criterion_cls: !name:recipes.musiclm.lightning.modules.MaskedCrossEntropy
    extra_params: !ref <extra_params>
    required_modules:
        # best_rq:
        #     - /mnt/bn/audio-diffusion/ckpts/best_rq/step=055000.pt
        #     - !name:recipes.musiclm.requires.model_initializer.init_best_rq
        #       cache_dir: !ref <run_opts[cache_dir]>
        best_rq:
            - null
            - !name:recipes.musiclm.requires.model_initializer.init_best_rq_minz
              cache_dir: null
        # wav2vec:
        #     - hdfs://harunava/home/byte_speech_sv/zongyu.yin/ckpts/w2v/2.1/semantic.jit.pt
        #     - !name:recipes.musiclm.requires.model_initializer.init_wav2vec
        #       cache_dir: !ref <run_opts[cache_dir]>
        soundstream:
            - hdfs://harunava/home/byte_speech_sv/zongyu.yin/ckpts/soundstream/190k
            - !name:recipes.musiclm.requires.model_initializer.init_soundstream
              cache_dir: !ref <run_opts[cache_dir]>

logger:
    - !new:pytorch_lightning.loggers.tensorboard.TensorBoardLogger
      save_dir: !ref <run_opts[log_dir]>
      name: !ref <run_opts[log_name]>
      version: !ref <run_opts[version]>
      default_hp_metric: False

callbacks:
    - !new:pytorch_lightning.callbacks.ModelCheckpoint
      monitor: step
      save_top_k: 10
      every_n_train_steps: !ref <run_opts[val_check_interval]>
      mode: max
      filename: "{step:06d}-{tr_loss:.4f}-{val_loss_0:.4f}"
    - !new:pytorch_lightning.callbacks.LearningRateMonitor
      logging_interval: 'step'

plugins:
    - !new:samantha.plugins.torch_io.LargeTorchCheckpointIO

trainer: !new:pytorch_lightning.Trainer
    strategy: "ddp_find_unused_parameters_true"
    fast_dev_run: !ref <run_opts[fast_dev_run]>
    logger: !ref <logger>
    accelerator: !ref <run_opts[accelerator]>
    devices: 'auto'
    num_nodes: !apply:os.getenv ["ARNOLD_WORKER_NUM", 1]
    deterministic: False
    enable_model_summary: True
    log_every_n_steps: 50
    max_steps: !ref <run_opts[max_steps]>
    precision: !ref <run_opts[precision]>
    accumulate_grad_batches: 1
    gradient_clip_val: !ref <run_opts[gradient_clip_val]>
    val_check_interval: !ref <run_opts[val_check_interval]>
    check_val_every_n_epoch: null
    num_sanity_val_steps: 2
    callbacks: !ref <callbacks>
    plugins: !ref <plugins>
