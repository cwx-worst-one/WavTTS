---
run_opts:
    num_workers: 1

item_transform_a: !new:recipes.test_lite_dataloader.test.FakeItemTransformA

item_transform_b: !new:recipes.test_lite_dataloader.test.FakeItemTransformB

batch_item_transform_a: !new:recipes.test_lite_dataloader.test.FakeBatchItemTransformA

item_composer: !new:samantha.dataio.lite.compose.Compose
    transforms: [!ref <item_transform_a>, !ref <item_transform_b>]

batch_item_composer: !new:samantha.dataio.lite.compose.BatchCompose
    transforms: !ref <batch_item_transforms>

batcher: !new:samantha.dataio.batching.SimpleBatching
    max_batch_size: 2

dataset: !new:recipes.test_lite_dataloader.test.FakeDataset
    item_transform: !ref <item_composer>

train_dataloader: !new:cruise.data_module.lite.dataloader.LiteCruiseDataLoader
    dataset: !ref <dataset>
    batcher: !ref <batcher>
    batch_transform: !ref <batch_item_composer>
    num_workers: !ref <run_opts[num_workers]>
    pin_memory: True
    drop_last: False

pl_datamodule: !new:samantha.dataio.lite.lite_datamodule.LiteDataModule
    train_dataloader: !ref <train_dataloader>
