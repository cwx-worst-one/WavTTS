---

################################################################################
##########                       BASIC CONFIGURATION                  ##########
################################################################################

data_params:
    sample_rate: 24000
    n_audio_samples: 240000

# training parameters
training_params:
    max_steps: 1000000
    batch_size: 56 # 10 for v100, 24 for A100
    base_lr: 4.0e-4
    warmup_steps: 3000
    hold_steps: 30000
    decay_steps: 3000000
    weight_decay: 0.01
    betas: (0.9, 0.98)
    shuffle_buffer: 1000
    gradient_clip_val: 1.0

ckpt_path: null

# running parameters
log_dir: !apply:os.getenv ["ARNOLD_OUTPUT", "logs"]
run_opts:
    fast_dev_run: False
    tensorboard_dir: !ref <log_dir>
    log_name: soundstorm
    version: mcc40m_conservative_filtered
    precision: bf16-mixed
    num_workers: 8
    accelerator: auto
    val_check_interval: 2000

seed: 0
__set_seed: !apply:pytorch_lightning.seed_everything [!ref <seed>]

################################################################################
##########                    TRAINING CONFIGURATION                  ##########
################################################################################

ar_filtering: !new:recipes.musiclm.transforms.musiclm.ARFiltering
    genre_stats_fname: "/mnt/bn/audio-diffusion/data/non_vocal_mcc_npy.filtered+audio_metrics_good/genre_quantile_stats.pkl"
    semantic_diversity_range: (10, 90)
    semantic_probs_range: (10, 90)

train_dataset: !new:recipes.musiclm.datasets.mcc.WrappedMCC40MDataset
    url2index_list:
        - "/mnt/bn/audio-diffusion/data/non_vocal_mcc_npy.filtered+audio_metrics_good/mega_index.with_ar_scores+vad/genre_specific/npy_url2idx.txt.alternative-hip-hop+chinese-style+others"
        - "/mnt/bn/audio-diffusion/data/non_vocal_mcc_npy.filtered+audio_metrics_good/mega_index.with_ar_scores+vad/genre_specific/npy_url2idx.txt.blues+childhood+country+devotional+k-pop+soundtrack+trance+world-music"
        - "/mnt/bn/audio-diffusion/data/non_vocal_mcc_npy.filtered+audio_metrics_good/mega_index.with_ar_scores+vad/genre_specific/npy_url2idx.txt.classical"
        - "/mnt/bn/audio-diffusion/data/non_vocal_mcc_npy.filtered+audio_metrics_good/mega_index.with_ar_scores+vad/genre_specific/npy_url2idx.txt.easy-listening"
        - "/mnt/bn/audio-diffusion/data/non_vocal_mcc_npy.filtered+audio_metrics_good/mega_index.with_ar_scores+vad/genre_specific/npy_url2idx.txt.electronic+techno"
        - "/mnt/bn/audio-diffusion/data/non_vocal_mcc_npy.filtered+audio_metrics_good/mega_index.with_ar_scores+vad/genre_specific/npy_url2idx.txt.folk+indie-folk"
        - "/mnt/bn/audio-diffusion/data/non_vocal_mcc_npy.filtered+audio_metrics_good/mega_index.with_ar_scores+vad/genre_specific/npy_url2idx.txt.hip-hop-rap"
        - "/mnt/bn/audio-diffusion/data/non_vocal_mcc_npy.filtered+audio_metrics_good/mega_index.with_ar_scores+vad/genre_specific/npy_url2idx.txt.jazz"
        - "/mnt/bn/audio-diffusion/data/non_vocal_mcc_npy.filtered+audio_metrics_good/mega_index.with_ar_scores+vad/genre_specific/npy_url2idx.txt.new-age"
        - "/mnt/bn/audio-diffusion/data/non_vocal_mcc_npy.filtered+audio_metrics_good/mega_index.with_ar_scores+vad/genre_specific/npy_url2idx.txt.pop"
        - "/mnt/bn/audio-diffusion/data/non_vocal_mcc_npy.filtered+audio_metrics_good/mega_index.with_ar_scores+vad/genre_specific/npy_url2idx.txt.rock"
    weights:
        - 1.0
        - 2.0
        - 4.0
        - 1.0
        - 2.0
        - 2.0
        - 2.0
        - 4.0
        - 2.0
        - 4.0
        - 2.0
    sample_rate: !ref <data_params[sample_rate]>
    duration: !ref <data_params[n_audio_samples]> / <data_params[sample_rate]>
    audio_key: "audio.npy"
    min_volume_threshold: 0.05
    loudness_ratio_threshold: 0.2
    ar_filtering: !ref <ar_filtering>
    max_num_crops: 6
    avoid_vocal: True
    max_vocal_threshold: 0.5
    resampled: True
    shardshuffle: True
    seed: !ref <seed>

validation_dataset: !new:recipes.musiclm.datasets.karaoke.KaraokeDataset
    urls: "pipe:hdfs dfs -cat hdfs://harunava/home/byte_speech_sv/data/karaoke_for_singsong/shards-0131.tar"
    nodesplitter: !name:recipes.musiclm.datamodules.webdataset.return_self
    sample_rate: !ref <data_params[sample_rate]>
    duration: !ref <data_params[n_audio_samples]> / <data_params[sample_rate]>

pl_datamodule: !new:recipes.musiclm.datamodules.webdataset.DataModule
    train_dataset: !ref <train_dataset>
    validation_dataset: !ref <validation_dataset>
    batch_size: !ref <training_params[batch_size]>
    num_workers: !ref <run_opts[num_workers]>
    shuffle_buffer_size: !ref <training_params[shuffle_buffer]>
    pin_memory: True

# training module configuration
optimizer_class: !name:torch.optim.AdamW
    lr: !ref <training_params[base_lr]>
    weight_decay: !ref <training_params[weight_decay]>
    betas: !ref <training_params[betas]>
    fused: False

scheduler_class: !name:recipes.musiclm.optim.lr_scheduler.TriStageLR
    warmup_steps: !ref <training_params[warmup_steps]>
    hold_steps: !ref <training_params[hold_steps]>
    decay_steps: !ref <training_params[decay_steps]>

# masking_scheme: !new:recipes.soundstorm.lightning.masking_scheme.SoundStormMaskingScheme
#     sample_q_uniformly: True
#     sample_t: True

masking_scheme: !new:recipes.soundstorm.lightning.masking_scheme.DucMaskingScheme
    coarse_layers: 4
    mask_all_fine: False
    coarse_prob: null

pl_module: !new:recipes.soundstorm.lightning.soundstorm.SoundStorm
    sample_rate: !ref <data_params[sample_rate]>
    n_embd: 1536
    n_head: 12
    n_layer: 18
    conv_kernel_size: 5
    n_audio_samples: !ref <data_params[n_audio_samples]>
    audio_prompting: False
    masking_scheme: !ref <masking_scheme>
    fine_quantizer_embedding_dropout: True
    frontend: "sum"
    conditioning_dropout: 0.0
    attention_kwargs:
        enable_flash: True
        enable_mem_efficient: True  # only for V100
    optimizer_class: !ref <optimizer_class>
    scheduler_class: !ref <scheduler_class>

logger: !new:pytorch_lightning.loggers.TensorBoardLogger
    save_dir: !ref <run_opts[tensorboard_dir]>
    name: !ref <run_opts[log_name]>
    version: !ref <run_opts[version]>
    default_hp_metric: False

checkpoint: !new:pytorch_lightning.callbacks.ModelCheckpoint
    monitor: step
    save_top_k: 50
    every_n_train_steps: !ref <run_opts[val_check_interval]>
    mode: max
    filename: "{step:06d}-{loss:.4f}"

lr_monitor: !new:pytorch_lightning.callbacks.LearningRateMonitor
    logging_interval: 'step'

audio_demo: !new:recipes.soundstorm.callbacks.audio_demo.AudioDemo
    sample_rate: !ref <data_params[sample_rate]>
    max_demos_per_step: 1

# total_tokens: !new:recipes.musiclm.callbacks.loggers.LogTotalTokensCallback
# log_gradient_scaler: !new:recipes.musiclm.callbacks.loggers.LogGradientScalerCallback

plugins:
    - !new:samantha.plugins.torch_io.LargeTorchCheckpointIO

trainer: !new:pytorch_lightning.Trainer
    strategy: "ddp_find_unused_parameters_true"
    fast_dev_run: !ref <run_opts[fast_dev_run]>
    logger: !ref <logger>
    accelerator: !ref <run_opts[accelerator]>
    devices: 'auto'
    num_nodes: !apply:samantha.utils.envs.getenv_int ["ARNOLD_WORKER_NUM", 1]
    deterministic: False
    enable_model_summary: True
    log_every_n_steps: 50
    max_steps: !ref <training_params[max_steps]>
    precision: !ref <run_opts[precision]>
    accumulate_grad_batches: 1
    gradient_clip_val: !ref <training_params[gradient_clip_val]>
    val_check_interval: !ref <run_opts[val_check_interval]>
    check_val_every_n_epoch: null  # required now that we use an IterableDataset
    num_sanity_val_steps: 0
    callbacks:
        - !ref <checkpoint>
        - !ref <lr_monitor>
        - !ref <audio_demo>
        # - !ref <total_tokens>
        # - !ref <log_gradient_scaler>
    plugins: !ref <plugins>

################################################################################
##########                    PREDICTION CONFIGURATION                ##########
################################################################################
