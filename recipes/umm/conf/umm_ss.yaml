---

################################################################################
##########                       BASIC CONFIGURATION                  ##########
################################################################################

ckpt_path: null

seed: 555
__set_seed: !apply:pytorch_lightning.seed_everything [!ref <seed>]
__set_float32_matmul_precision: !apply:torch.set_float32_matmul_precision ['high']

extra_params:
    sample_rate: 24000
    frame_rate: 25
    n_mels: 120
    n_chroma: 12
    n_fft: 2048
    win_length: 1920
    hop_length: 960
    feature_cmvn: "recipes/datasets/mcc/BigTTS_data_id=225_usm.stats.pt"
    tokenizer: "wordpiece"
    version: "v1"

# running parameters
run_opts:
    fast_dev_run: False
    cache_dir: .module_cache/umm
    hdfs_log_dir: "hdfs://haruna/home/byte_speech_sv/user/litang/umm_ar"
    log_dir: logs
    log_name: umm_ss
    version: "wvae_limit_receptive_filed"
    precision: "32"
    num_workers: 3
    accelerator: auto
    warmup_steps: 2000
    max_steps: 2000000
    ckpt_interval: 5000
    batch_size: 1
    learning_rate: 2e-4
    cycle_steps: 400000
    weight_decay: 0.1
    shuffle_buffer: 8000
    gradient_clip_val: 1.0

################################################################################
##########                    TRAINING CONFIGURATION                  ##########
################################################################################

pl_datamodule: !new:recipes.datasets.mcc.mix.ParquetDataModule
    shuffle_buffer_size: !ref <run_opts[shuffle_buffer]>
    sample_rate: !ref <extra_params[sample_rate]>
    batch_size: !ref <run_opts[batch_size]> * <pl_datamodule[max_duration]> * <extra_params[sample_rate]>
    num_workers: !ref <run_opts[num_workers]>
    region: "CN"
    weights: [1, 20, 1]
    max_num_crops: null
    min_duration: 1
    max_duration: 90
    normalize_audio: False
    use_pipe: False
    tokenizer: !ref <extra_params[tokenizer]>
    frame_rate: !ref <extra_params[frame_rate]>
    data_id: 305

optimizer_cls: !name:deepspeed.ops.adam.FusedAdam #torch.optim.AdamW
    lr: !ref <run_opts[learning_rate]>
    weight_decay: !ref <run_opts[weight_decay]>
    betas: [0.9, 0.96] # TODO
    eps: 0.00000001

scheduler_cls: !name:recipes.umm.modules.lr_scheduler.WarmupCosine
    init_lr: !ref <run_opts[learning_rate]>
    warmup_steps: !ref <run_opts[warmup_steps]>
    cycle_steps: !ref <run_opts[cycle_steps]>
    min_lr: !ref <run_opts[learning_rate]> * 0.1

hp:
    upsample_rates: [5, 4, 4, 3, 2, 2]
    upsample_initial_channel: 1536
    resblock_kernel_sizes: [3, 7, 11]
    resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
    activation: snakebeta
    snake_logscale: true
    resolutions: [[1024, 120, 600], [2048, 240, 1200], [512, 50, 240]]
    mpd_reshapes: [2, 3, 5, 7, 11]
    use_spectral_norm: false
    discriminator_channel_mult: 1
    segment_size: !ref <extra_params[hop_length]> * 64
    num_mels: 64
    n_fft: !ref <extra_params[n_fft]>
    hop_size: !ref <extra_params[hop_length]>
    win_size: !ref <extra_params[win_length]>
    max_bs: 8

g_model_cls: !name:recipes.umm.vocoder.wvae.WaveformVAE
    hp: !ref <hp>
    sd_channels: !ref <hp[num_mels]>
    hidden_channels: 256

d_model_cls: !name:recipes.umm.vocoder.discriminator_v1.MultiScaleSTFTDiscriminator
    filters: 32
    pretrain: true

pl_module: !new:recipes.umm.modules.lit_module_ss.UMMSSModule
    g_model_cls: !ref <g_model_cls>
    d_model_cls: !ref <d_model_cls>
    scheduler_cls: !ref <scheduler_cls>
    extra_params: !ref <extra_params>
    required_modules: null

logger:
    - !new:pytorch_lightning.loggers.wandb.WandbLogger
      save_dir: !ref <run_opts[log_dir]>
      project: !ref <run_opts[log_name]>
      name: !ref <run_opts[version]>

callbacks:
    - !new:pytorch_lightning.callbacks.ModelCheckpoint
      dirpath: !ref <run_opts[log_dir]>/<run_opts[log_name]>/<run_opts[version]>
      monitor: step
      save_top_k: 500
      every_n_train_steps: !ref <run_opts[ckpt_interval]>
      mode: max
      filename: "{step:06d}"
    - !new:samantha.callbacks.HDFSModelCheckpoint
      hdfs_path: !ref <run_opts[hdfs_log_dir]>/<run_opts[log_name]>/<run_opts[version]>
      monitor: step
      save_top_k: 500
      every_n_train_steps: !ref <run_opts[ckpt_interval]>
      mode: max
      filename: "{step:06d}"
    - !new:pytorch_lightning.callbacks.LearningRateMonitor
      logging_interval: 'step'
    - !new:recipes.umm.callbacks.log_spectrogram.LogSpectrogram
      n_examples: 3

plugins:
    - !new:samantha.plugins.LargeTorchCheckpointIO

trainer: !new:pytorch_lightning.Trainer
    strategy: "ddp_find_unused_parameters_true"
    fast_dev_run: !ref <run_opts[fast_dev_run]>
    logger: !ref <logger>
    accelerator: !ref <run_opts[accelerator]>
    devices: "auto"
    num_nodes: !apply:samantha.utils.envs.getenv_int ["ARNOLD_WORKER_NUM", 1]
    deterministic: False
    enable_model_summary: True
    log_every_n_steps: 10
    max_steps: !ref <run_opts[max_steps]>
    precision: !ref <run_opts[precision]>
    sync_batchnorm: True
    benchmark: False
    callbacks: !ref <callbacks>
    plugins: !ref <plugins>
