---

################################################################################
##########                       BASIC CONFIGURATION                  ##########
################################################################################

ckpt_path: null

seed: 555
__set_seed: !apply:pytorch_lightning.seed_everything [!ref <seed>]
__set_float32_matmul_precision: !apply:torch.set_float32_matmul_precision ['high']

extra_params:
    sample_rate: 16000
    frame_rate: 25
    n_mels: 80
    n_chroma: 50
    n_fft: 2048
    win_length: 2048
    hop_length: 160
    feature_cmvn: "recipes/datasets/mcc/BigTTS_data_id=225_usm.stats.pt"
    tokenizer: "wordpiece"

# running parameters
run_opts:
    fast_dev_run: False
    cache_dir: .module_cache/umm
    hdfs_log_dir: "hdfs://haruna/home/byte_speech_sv/user/litang/umm_ar/usm_25hz"
    log_dir: logs
    log_name: usm_umm
    version: !ref usm_stage2_<extra_params[tokenizer]>_chroma<extra_params[n_chroma]>
    precision: "bf16-mixed"
    num_workers: 3
    accelerator: auto
    max_steps: 1000000
    val_check_interval: 5000
    ckpt_interval: 5000
    batch_size: 1
    learning_rate: 1.0e-4
    cycle_steps: 30000
    weight_decay: 0.1
    shuffle_buffer: 8000
    gradient_clip_val: 1.0
    checkpointing: False

################################################################################
##########                    TRAINING CONFIGURATION                  ##########
################################################################################

pl_datamodule: !new:recipes.datasets.mcc.mix.ParquetDataModule
    shuffle_buffer_size: !ref <run_opts[shuffle_buffer]>
    sample_rate: !ref <extra_params[sample_rate]>
    batch_size: !ref <run_opts[batch_size]> * <pl_datamodule[max_duration]> * <extra_params[sample_rate]>
    num_workers: !ref <run_opts[num_workers]>
    region: "CN"
    weights: [1, 20, 1]
    max_num_crops: null
    min_duration: 1
    max_duration: 90
    normalize_audio: False
    use_pipe: False
    tokenizer: !ref <extra_params[tokenizer]>
    frame_rate: !ref <extra_params[frame_rate]>

optimizer_cls: !name:torch.optim.AdamW
    lr: !ref <run_opts[learning_rate]>
    weight_decay: !ref <run_opts[weight_decay]>
    betas: [0.9, 0.96] # TODO
    eps: 0.00000001

scheduler_cls: !name:recipes.umm.modules.lr_scheduler.DecayCosine
    init_lr: !ref <run_opts[learning_rate]>
    cycle_steps: !ref <run_opts[cycle_steps]>
    min_lr: !ref <run_opts[learning_rate]> / 2

usm_config:
  network:
    # front_end
    front_end_type: 'Conv2dPooling'
    front_end_conv0_ch: 256
    front_end_conv1_ch: 256
    front_end_padding: 1
    downsampling_size: 4
    acoustic_backbone_type: 'ConformerBackbone'
    conformer_normalize_before: True
    conformer_attention_heads: 16
    conformer_linear_units: 6144
    conformer_num_blocks: 32
    conformer_dropout_rate: 0.1
    conformer_positional_dropout_rate: 0.1
    conformer_attention_dropout_rate: 0.1
    conformer_positionwise_layer_type: 'linear'
    conformer_activation_fn: 'gelu'
    conformer_positionwise_conv_kernel_size: 1
    conformer_macaron_style: 1
    conformer_pos_enc_layer_type: 'fix_rel_pos'
    conformer_selfattention_layer_type: 'rel_selfattn'
    conformer_layer_order: 'mhsa_before_conv'
    conformer_use_cnn_module: 1
    conformer_cnn_module: 'ConvolutionModule'
    conformer_cnn_module_kernel: '5'
    conformer_cnn_norm_type: 'layer_norm'
    conformer_layernorm_interval: 0
    conformer_weight_scale: 1.0
    conformer_half_pooling: 0
    backbone_memory_size: 1536
    dropout: 0.1
    flash_attn: true

config: !new:recipes.umm.models.config.UMMConfig
    feature_cmvn: !ref <extra_params[feature_cmvn]>
    sample_rate: !ref <extra_params[sample_rate]>
    n_mels: !ref <extra_params[n_mels]>
    add_chroma: True
    n_chroma: !ref <extra_params[n_chroma]>
    n_fft: !ref <extra_params[n_fft]>
    win_length: !ref <extra_params[win_length]>
    hop_length: !ref <extra_params[hop_length]>
    hidden_size: 1536
    add_vq: False
    vq_codebook_size: 16384
    vq_codebook_dim: 32
    vq_decay: 0.99
    w_loss_mel: 1.0
    w_loss_chroma: 1.0
    w_loss_vq: 1.0
    w_loss_ctc: 1.0
    tokenizer: !ref <extra_params[tokenizer]>
    frame_rate: !ref <extra_params[frame_rate]>
    vocab_size: 30523
    ctc_blank_id: 30522
    usm_config: !ref <usm_config>

model_cls: !name:recipes.umm.models.umm_mk3.USMStage2
    config: !ref <config>

pl_module: !new:recipes.umm.modules.lit_module_mk3.USMStage2
    checkpointing: !ref <run_opts[checkpointing]>
    model_cls: !ref <model_cls>
    optimizer_cls: !ref <optimizer_cls>
    scheduler_cls: !ref <scheduler_cls>
    criterion_cls: !name:recipes.umm.modules.criterion.UMMLoss
        config: !ref <config>
    extra_params: !ref <extra_params>
    required_modules:
        pretrained:
            ckpt_path: "hdfs://haruna/home/byte_speech_sv/user/litang/umm_asr/usm_asr_ft.ckpt"
            init_fn: !name:recipes.umm.requires.model_initializer.init_pretrained
            cache_dir: !ref <run_opts[cache_dir]>

logger:
    - !new:pytorch_lightning.loggers.wandb.WandbLogger
      save_dir: !ref <run_opts[log_dir]>
      project: !ref <run_opts[log_name]>
      name: !ref <run_opts[version]>

callbacks:
    - !new:pytorch_lightning.callbacks.ModelCheckpoint
      dirpath: !ref <run_opts[log_dir]>/<run_opts[log_name]>/<run_opts[version]>
      monitor: step
      save_top_k: 500
      every_n_train_steps: !ref <run_opts[ckpt_interval]>
      mode: max
      filename: "{step:06d}"
    - !new:samantha.callbacks.HDFSModelCheckpoint
      hdfs_path: !ref <run_opts[hdfs_log_dir]>/<run_opts[log_name]>/<run_opts[version]>
      monitor: step
      save_top_k: 500
      every_n_train_steps: !ref <run_opts[ckpt_interval]>
      mode: max
      filename: "{step:06d}"
    - !new:pytorch_lightning.callbacks.LearningRateMonitor
      logging_interval: 'step'
    - !new:recipes.umm.callbacks.log_spectrogram.LogSpectrogram
      n_examples: 3

plugins:
    - !new:samantha.plugins.LargeTorchCheckpointIO

trainer: !new:pytorch_lightning.Trainer
    strategy: "ddp_find_unused_parameters_false"
    fast_dev_run: !ref <run_opts[fast_dev_run]>
    logger: !ref <logger>
    accelerator: !ref <run_opts[accelerator]>
    devices: "auto"
    num_nodes: !apply:os.getenv ["ARNOLD_WORKER_NUM", 1]
    deterministic: False
    enable_model_summary: True
    log_every_n_steps: 100
    max_steps: !ref <run_opts[max_steps]>
    precision: !ref <run_opts[precision]>
    accumulate_grad_batches: 1
    gradient_clip_val: !ref <run_opts[gradient_clip_val]>
    val_check_interval: !ref <run_opts[val_check_interval]>
    check_val_every_n_epoch: null
    num_sanity_val_steps: 2
    limit_val_batches: 1
    sync_batchnorm: True
    benchmark: False
    callbacks: !ref <callbacks>
    plugins: !ref <plugins>
