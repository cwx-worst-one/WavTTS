---
################################################################################
##########                       BASIC CONFIGURATION                  ##########
################################################################################

seed: 0
__set_seed: !apply:pytorch_lightning.seed_everything [!ref <seed>]
__set_float32_matmul_precision: !apply:torch.set_float32_matmul_precision ['high']

extra_params:
  final_pooling: True
  tag_types: ['genres', 'year', 'key', 'tempo', 'instruments']
  tag_loss_weights: [0.3, 0.1, 0.1, 0.1, 1.0]
  tag_map: !apply:recipes.mir2.parquet_dataset.vocab_index.karaoke_tags


################################################################################
##########                    TASK CONFIGURATION                  ##########
################################################################################

audio:
  sampling_rate: 24000        # sampling rate for audio
  sample_len: 30.0            # duration for finetuning tagging tasks
  max_duration: 30            # duration for pretraining audio encoder
  frame_rate: 25

################################################################################
##########                      MODEL CONFIGURATION                   ##########
################################################################################

config: !new:recipes.umm2.models.config.UMMConfig
  feature_cmvn: "recipes/datasets/mcc/data_ids=794.stats.pt"
  sample_rate: !ref <audio[sampling_rate]>
  n_mels: 128
  n_chroma: 12
  n_fft: 2048
  win_length: 2048
  hop_length: 240
  hidden_size: 1024
  intermediate_size: 4096
  num_hidden_layers: 24
  num_attention_heads: 8
  max_source_positions: 2500
  vq_type: null # this will default to EMAVectorQuantizer()
  vq_proj_noise: 10000
  vq_codebook_size: 32768
  vq_codebook_dim: 32
  vq_decay: 0.99
  tokenizer: null
  frame_rate: 25
  use_bn: False
  w_loss_mel: 1.0
  w_loss_chroma: 0.5
  w_loss_vq: 0.5
  w_loss_tag: 0.8

ema_vq: !new:recipes.umm2.models.tasks.vq_module.EMAVectorQuantizer
  codebook_size: !ref <config[vq_codebook_size]>
  codebook_dim: !ref <config[vq_codebook_dim]>
  decay: !ref <config[vq_decay]>
  dist: False

vq_module: !new:recipes.umm2.models.tasks.vq_module.VQ  # BaseStage
  task: "vq"
  config: !ref <config>
  takes: [latent]
  provides: [latent, vq_ids]
  vq_scheme: !ref <ema_vq>

# IMPORTANT: autoencoder only appplies to <audio[sample_len]> == <audio[max_duration]>
frontend: !new:recipes.umm2.models.tasks.autoencoder.AE_UMM # BaseStage
  config: !ref <config>
  takes: [audio]
  provides: [mel, latent, vq_ids]
  loss_weight: null
  is_frozen: True
  is_train: False
  insert_modules:
    12: !ref <vq_module> # at layer 12

tag_head: !new:recipes.mir2.models.tagging_umm2.TaggingProbingStage
  task: "tagging"
  takes: [latent]
  provides: [tag_pred]
  is_frozen: True
  loss_weight: null
  final_pooling: !ref <extra_params[final_pooling]>
  n_channel: !ref <config[hidden_size]>
  tag_map: !ref <extra_params[tag_map]>
  tag_types: !ref <extra_params[tag_types]>

mel_head: !new:recipes.umm2.models.tasks.mel_head.Mel_Head # BaseStage
  task: "mel"
  config: !ref <config>
  takes: [mel, latent]
  provides: [mel_out]
  loss_weight: null
  is_frozen: True

backend: !new:recipes.umm2.models.base.SpanModel
  input_names: [mel, latent]
  output_names: [tag_pred]
  bypass_names: [vq_ids]
  spans:
    mel: !ref <mel_head>
    tag: !ref <tag_head>

model: !new:recipes.umm2.models.base.PipelineModel
  input_names: [audio]
  output_names: [mel_out, vq_ids, tag_pred]
  stages:
    - !ref <frontend>
    - !ref <backend>


required_modules:
  pretrained:
    ckpt_path: "hdfs://haruna/home/byte_speech_sv/ju-chiang.wang/umm_tag/karaoke/umm_stage3_mel_chroma_prevq/checkpoints/step=0070000.ckpt"
    loader: !name:recipes.umm2.loaders.stage3_tagging.ModelLoader
    cache_dir: ".module_cache/umm"
    initializer: !name:recipes.umm2.requires.model_initializer.init_stage3
