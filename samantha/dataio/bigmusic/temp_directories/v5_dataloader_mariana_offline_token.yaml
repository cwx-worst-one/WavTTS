data:
  save_ckpt_interval: 2000 # keep same with model checkpoint save interval
  train_dataset_ids: [12100]
  train_dataset_weights: [1]
  data_key_in_source_urls: "umm_token_music_1.18"
  # train_dataset_ids: [11245]
  # train_dataset_weights: [1]
  # data_key_in_source_urls: "umm_token_music_1.1"
  val_dataset_ids: [4423]
  val_dataset_weights: [1.0]

  train_batcher:
    type: "TokenBucketBatcher"
    dynamic_batch: True
    bucket_schedule_key: "num_total_tokens"
    maximum_bucket_size: 20000 # 240 seconds * (50: audio_token:25 + text_token:25) * 3 full song

  val_batcher:
    type: "TokenBucketBatcher"
    dynamic_batch: True
    bucket_schedule_key: "num_total_tokens"
    maximum_bucket_size: 100000 # 240 seconds * (50: audio_token:25 + text_token:25) * 3 full song

  train_item_transform:
    - type: "ConvertMetaToDict"
    - type: 'TokenParser'
      in_key: "umm_token"
      out_key: "umm_token"
      min_len: 2
      max_len: 800
    # Meta data parsing
    - type: "StructureParser"
      confidence_threshold: 0.45
    - type: "TempoParser"
      dropout_rate: 0.1
    - type: "KeyModeParser"
      dropout_rate: 0.1
    - type: "InstParser"
      dropout_rate: 0.1
    - type: "StyleTagParser"
      dropout_rate: 0.1
    - type: "StyleTagFilter"
    - type: "StyleTagTokenizer"
      vocab: "v0"
    - type: "FreeformTextParser"
      keyword_dropout_rate: 0.1
      dropout_rate: 0.1
    - type: "UtteranceParser"
    - type: "MusicMetaRWTransform"
      in_key: "meta.mir_service.vocal2midi"
      out_key: "vocal2midi"
      allow_empty_in: true
    # Split parsed data into multple song slices with style tags and freeform text tucked in
    - type: "SongSliceSplit"
      max_duration: 240.0
      line_break_dropout_rate: 0.1
      slice_mode: section  # section | full
    # (Optional) Remove redundant data after the split
    - type: "MusicMetaRWTransform"
      in_key: ["utterances", "style_tags", "style_input_ids", "freeform_text", "structure", "vocal2midi"]
      out_key: null
      remove_in_key: true

    # -------------------------------------------------
    # A series of operations on individual song slices
    # -------------------------------------------------
    - type: "SongSliceMapFilter"
      duration_range: [20, 240]
      lyrics_confidence: 0.6
    # Randomly sample n_items song slices
    - type: "RandomSampleFromList"
      in_key: "song_slices"
      out_key: "song_slices"
      n_items: 32
      p_full: 0.0
    # reformat -> sequentialize -> tokenize phonemes with interleaved tags (section, singer, etc.)
    - type: "SongSliceMapSequentialize"
      note_dropout_rate: 0.1
    - type: "SongSliceMapTokenize"
      vocab: "v0"
      section_tag_dropout_rate: 0.1
      slice_duration_dropout_rate: 0.1
      singer_tag_dropout_rate: 0.1
    - type: "SongSliceTokenMatch"
      in_key: "song_slices"
      token_key: "umm_token"
    # Take song slices out, became list of song slices (dict)
    - type: "MusicMetaRWTransform"
      in_key: "song_slices"
      out_key: null
      overwrite_item: true
      maybe_return_list_output: true
    # -------------------------------------------------

    - type: SpeakerIdParser
      in_key: "style_tags.vocal_gender"
      out_key: "speaker_id"

    - type: "RenameKey"
      in_key_list: ["umm_token"]
      out_key_list: ["target_token_ids"]
      in_place: true

    - type: "SanityCheck"
      keys: ['uttid', 'target_token_ids', 'phrases', 'style_tags', 'style_input_ids', 'freeform_text', 'phoneme_tokens', 'duration', 'speaker_id']

    - type: "CalculateTokenV2"
      audio_length_out_key: 'target_tokens_length'
      lyrics_length_out_key: 'lyrics_tokens_length'
      total_token_length: 'num_total_tokens'

    - type: "ConvertDictToList"
      in_key: style_tags
      out_key: style_text
      list_order: ["genre", "genre_extra", "extra", "mood", "scene", "vocal_gender", "vocal_timbre", "language", "is_sinking", "instrument", "tempo", "key", "mode"]

    - type: "AddField"
      key: conditions
      value: "style_category,speaker_id,freeform_text,lyrics_tokens"

    # - type: "ConvertDictToList"
    #   in_key: style_tags
    #   out_key: style_text
    #   list_order: ["genre", "genre_extra", "extra", "mood", "scene", "speaker", "voice", "lang", "sinking", "instrument", "tempo", "key", "mode"]
    - type: "CaptureWorkerInfo"

  train_batch_transform:
    - type: WorkerInfoCollate

    - type: TokenCollate
      in_key: "target_token_ids"
      length_key: "target_tokens_length"
      pad_value: 0
      to_tensor: True

    #phoneme_tokens: tokens(str), input_ids(int id), coffs(float)
    - type: TokenCoffCollate
      in_key: "phoneme_tokens"
      token_key: "input_ids"
      coff_key: "coffs"
      token_output_key: "lyrics_tokens"
      coff_output_key: "lyrics_coffs"
      max_phone_len: 4000

    - type: NestListCollate
      key_list:
        [
          "uttid",
          "style_tags",
          "style_text",
          "style_input_ids",
          "freeform_text",
          "phoneme_tokens.tokens",
          "conditions",
        ]
      to_tensor: False

    - type: NestListCollate
      key_list:
        [
          "lyrics_tokens_length",
          "target_tokens_length",
          "num_total_tokens",
          "speaker_id",
          "tempo",
        ]
      to_tensor: True

  val_item_transform:
    - type: "ConvertMetaToDict"
    - type: "MusicParser"
      in_key: "audio"
      out_key: "audio"
      max_len: 800.0 #second
    - type: "WavResample"
      key: "audio"
      sample_rate: 24000
    - type: "NormalizeAudioToFloat32"
      in_key: "audio"
      out_key: "audio"
    # Meta data parsing
    - type: "StructureParser"
      confidence_threshold: 0.45
    - type: "TempoParser"
      dropout_rate: 0.1
    - type: "KeyModeParser"
      dropout_rate: 0.1
    - type: "InstParser"
      dropout_rate: 0.1
    - type: "StyleTagParser"
      dropout_rate: 0.1
    - type: "StyleTagFilter"
    - type: "StyleTagTokenizer"
      vocab: "v0"
    - type: "FreeformTextParser"
      keyword_dropout_rate: 0.1
      dropout_rate: 0.1
    - type: "UtteranceParser"
    - type: "MusicMetaRWTransform"
      in_key: "meta.mir_service.vocal2midi"
      out_key: "vocal2midi"
      allow_empty_in: true
    # Split parsed data into multple song slices with style tags and freeform text tucked in
    - type: "SongSliceSplit"
      max_duration: 240.0
      line_break_dropout_rate: 0.1
      slice_mode: section # section | full
    # (Optional) Remove redundant data after the split
    - type: "MusicMetaRWTransform"
      in_key:
        [
          "utterances",
          "style_tags",
          "style_input_ids",
          "freeform_text",
          "structure",
          "vocal2midi",
        ]
      out_key: null
      remove_in_key: true

    # -------------------------------------------------
    # A series of operations on individual song slices
    # -------------------------------------------------
    - type: "SongSliceMapFilter"
      duration_range: [20, 240]
      lyrics_confidence: 0.6
    # Randomly sample n_items song slices
    - type: "RandomSampleFromList"
      in_key: "song_slices"
      out_key: "song_slices"
      n_items: 10
      p_full: 0.0
    # reformat -> sequentialize -> tokenize phonemes with interleaved tags (section, singer, etc.)
    - type: "SongSliceMapSequentialize"
      note_dropout_rate: 0.1
    - type: "SongSliceMapTokenize"
      vocab: "v0"
      section_tag_dropout_rate: 0.1
      slice_duration_dropout_rate: 0.1
      singer_tag_dropout_rate: 0.1
    - type: "SongSliceAudioCut"
      in_key: "song_slices"
      audio_key: "audio"
    # Take song slices out, became list of song slices (dict)
    - type: "MusicMetaRWTransform"
      in_key: "song_slices"
      out_key: null
      overwrite_item: true
      maybe_return_list_output: true
    # -------------------------------------------------

    - type: SpeakerIdParser
      in_key: "style_tags.vocal_gender"
      out_key: "speaker_id"

    - type: "SanityCheck"
      keys:
        [
          "uttid",
          "audio",
          "phrases",
          "style_tags",
          "style_input_ids",
          "freeform_text",
          "phoneme_tokens",
          "duration",
          "speaker_id",
        ]

    - type: "CalculateToken"
      token_rate: 25
      audio_length_out_key: "target_tokens_length"
      lyrics_length_out_key: "lyrics_tokens_length"
      total_token_length: "num_total_tokens"
      sample_rate: 24000

    - type: "ConvertDictToList"
      in_key: style_tags
      out_key: style_text
      list_order:
        [
          "genre",
          "genre_extra",
          "extra",
          "mood",
          "scene",
          "vocal_gender",
          "vocal_timbre",
          "language",
          "is_sinking",
          "instrument",
          "tempo",
          "key",
          "mode",
        ]

    - type: "AddField"
      key: conditions
      value: "style_category,speaker_id,freeform_text,lyrics_tokens"

    - type: "RenameKey"
      in_key_list: ["audio"]
      out_key_list: ["target_audio"]
      in_place: true

    # - type: "ConvertDictToList"
    #   in_key: style_tags
    #   out_key: style_text
    #   list_order: ["genre", "genre_extra", "extra", "mood", "scene", "speaker", "voice", "lang", "sinking", "instrument", "tempo", "key", "mode"]

  val_batch_transform:
    - type: AudioCollate
      in_key: "target_audio"
      length_key: "audio_length"
      pad_value: 0.0

    #phoneme_tokens: tokens(str), input_ids(int id), coffs(float)
    - type: TokenCoffCollate
      in_key: "phoneme_tokens"
      token_key: "input_ids"
      coff_key: "coffs"
      token_output_key: "lyrics_tokens"
      coff_output_key: "lyrics_coffs"
      max_phone_len: 4000

    - type: NestListCollate
      key_list:
        [
          "uttid",
          "style_tags",
          "style_text",
          "style_input_ids",
          "freeform_text",
          "phoneme_tokens.tokens",
          "conditions",
        ]
      to_tensor: False

    - type: NestListCollate
      key_list:
        [
          "lyrics_tokens_length",
          "target_tokens_length",
          "num_total_tokens",
          "speaker_id",
          "tempo",
        ]
      to_tensor: True
