[build-system]
requires = ["setuptools >= 61.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "f5-tts"
version = "1.1.10"
description = "F5-TTS: A Fairytaler that Fakes Fluent and Faithful Speech with Flow Matching"
readme = "README.md"
license = {text = "MIT License"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "accelerate>=0.33.0",
    "bitsandbytes>0.37.0; platform_machine!='arm64' and platform_system!='Darwin'",
    "cached_path",
    "click",
    "datasets>=4.8.4",
    "einops>=0.8.2",
    "ema_pytorch>=0.5.2",
    "huggingface_hub>=1.7.2,<1.15.0",
    "hydra-core>=1.3.2",
    "librosa>=0.11.0",
    "matplotlib",
    "numpy>=2.4.3; python_version>='3.11'",
    "numpy<=1.26.4; python_version<='3.10'",
    "pandas>=3.0.1",
    "protobuf>=6.33.6,<7.0.0",
    "pyarrow>=23.0.1",
    "pydantic<=2.10.6",
    "pydub",
    "pypinyin>=0.55.0",
    "rjieba>=0.2.0",
    "safetensors>=0.7.0",
    "soundfile>=0.13.1",
    "tomli>=2.4.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "torchcodec>=0.9.1",
    "torchdiffeq>=0.2.5",
    "tqdm>=4.65.0",
    "transformers>=5.3.0,<5.8.0",
    "transformers-stream-generator>=0.0.5",
    "unidecode",
    "vocos>=0.1.0",
    "wandb",
    "x-transformers>=2.17.7,<2.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
eval = [
    "faster_whisper==0.10.1",
    "funasr",
    "jiwer",
    "modelscope",
    "zhconv",
    "zhon",
]

[project.urls]
Homepage = "https://github.com/SWivid/F5-TTS"

[project.scripts]
"f5-tts_infer-cli" = "f5_tts.infer.infer_cli:main"
"f5-tts_finetune-cli" = "f5_tts.train.finetune_cli:main"
