[tool.black]
line-length = 88
color = true
skip-magic-trailing-comma = true
target-version = ['py38']
exclude = '''
(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.mypy_cache
    | \.tox
    | \.venv
  )/
)
'''

[tool.isort]
profile = "black"
line_length = 88
