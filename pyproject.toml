[build-system]
requires = ["setuptools >= 61.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wavtts"
version = "1.1.10"
description = "WavTTS: Towards High-Fidelity Zero-Shot TTS via Direct Raw Waveform Modeling"
readme = "README.md"
license = {text = "MIT License"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "accelerate>=0.33.0",
    "bitsandbytes>0.37.0; platform_machine!='arm64' and platform_system!='Darwin'",
    "cached_path",
    "click",
    "datasets",
    "einops>=0.8.2",
    "ema_pytorch>=0.5.2",
    "hydra-core>=1.3.2",
    "librosa",
    "matplotlib",
    "numpy>=2.4.3; python_version>='3.11'",
    "numpy<=1.26.4; python_version<='3.10'",
    "pydantic<=2.10.6",
    "pydub",
    "pypinyin",
    "rjieba",
    "safetensors",
    "soundfile>=0.13.1",
    "tomli",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "torchcodec",
    "torchdiffeq",
    "tqdm",
    "transformers>=4.45.0,<4.50.0",
    "transformers-stream-generator",
    "unidecode",
    "wandb",
    "x-transformers>=1.31.14",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
eval = [
    "faster_whisper",
    "funasr",
    "jiwer==3.1.0",
    "modelscope",
    "zhconv",
    "zhon",
]

[project.urls]
Homepage = "https://github.com/cwx-worst-one/WavTTS"

[project.scripts]
"wavtts_infer-cli" = "wavtts.infer.infer_cli:main"
