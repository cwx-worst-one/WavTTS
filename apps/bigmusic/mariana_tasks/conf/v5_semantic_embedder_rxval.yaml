required_modules:
    bestrq:
        # US UMM-chroma-Zh stage 3
        hpath: "hdfs://haruna/home/byte_data_seed/lf_lq/speech/user/hanoi.hantrakul/logs/umm_conformer_unified_tts_rope/umm_stage3_unified_tts_rope_bert-base-multilingual-uncased_EMAEntropy32768x32/checkpoints/step=220000.ckpt"
        initializer: !name:recipes.umm.requires.model_initializer.init_stage3
            cache_dir: !ref <extra_params[cache_dir]>
    mulan:
        hpath: "hdfs://haruna/home/byte_data_seed/lf_lq/speech/user/zhangshuo/bigmusic/assets/mulan/mulan-step=024600-median_rank_1=110-kaggle-minimal.ckpt"
        initializer: !name:recipes.musiclm.requires.model_initializer.init_mulan
            cache_dir: !ref <extra_params[cache_dir]>
            version: g4

