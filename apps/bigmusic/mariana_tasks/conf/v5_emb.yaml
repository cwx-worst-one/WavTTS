---

################################################################################
##########                       BASIC CONFIGURATION                  ##########
################################################################################


extra_params:
    sample_rate: 24000
    lyrics_codebook_size: 4000
    speaker_codebook_size: 100
    semantic_codebook_size: 32_768
    text_codebook_size: 0
    semantic_frame_rate: 25
    semantic_type: bestrq
    train_conditions: "style_category,speaker_id,tempo,freeform_text,lyrics_tokens"         # style_audio
    prepare_input_types: []
    input_embedders: [multitags_categorical, speaker_id, tempo, mulan_music, mulan_text, lyrics_tokens_v2] # t5_text_embedder | mulan
    varlen_lyrics_prefix: True
    lyrics_tokenizer: "sami_phoneme_v4" # sami_phoneme_legacy | sami_phoneme_v2 | sami_phoneme_v3 | sami_phoneme_v4
    tag_taxonomy_lang: "Mix_unified_v4"
    tag_dropout_rate: 0.1               # categorical tag dropout rate (read in SemanticModule)
    text_emb_max_len: 50
    mulan_use_hidden_state: True        # For mulan text encoder, hidden_state_dim=1536, pooled output dim=512
    mulan_embed_dim: 1024               # If using pooled audio / text encoder, set False and 512
    mulan_add_cfg: True
    mulan_crop: True                    # Random crop style_audio to 10s
    mulan_music_dropout_rate: 0.3
    mulan_path: "hdfs://haruna/home/byte_data_seed/lf_lq/speech/user/zhangshuo/bigmusic/assets/mulan/mulan-step=024600-median_rank_1=110-kaggle-minimal.ckpt"
    mulan_version: "g4"
    bpe_tokenizer_path: ""

    # LM params
    hidden_size: 1152 # 1536
    intermediate_size: 4352
    num_hidden_layers: 24
    num_attention_heads: 12
    num_kv_heads: 3
    pretrained_path: null
    # tokenizer
    tokenizer_path: !apply:os.getenv ["tokenizer_path", "hdfs://haruna/home/byte_data_seed/lf_lq/speech/user/hanoi.hantrakul/logs/umm_conformer_unified_tts_rope/umm_stage3_unified_tts_rope_bert-base-multilingual-uncased_EMAEntropy32768x32/checkpoints/step=220000.ckpt"]
    tokenizer_chunk_duration: !apply:samantha.utils.envs.getenv_int ["tokenizer_chunk_duration", 60]
    token_slice_method: !apply:os.getenv ["token_slice_method", "even"]

    # Multi-token prediction
    # multi_token_pattern: delay
    # multi_token_num: 2
    # null_placeholder: true
    # multi_token_encoder: fc
    # multi_token_decoder:
    #     model_type: fc
    # semantic_token_depth: 1

    # multi-path CFG
    group_dropout_rate: 0
    style_text_categorical_format: 13_cat
    style_text_cfg_targets: [genre, genre_extra, extra, mood, speaker, scene, voice, lang, sinking, instrument, tempo, key, mode] # to align with inference, the cfg targets should be specified here
    group_controller_cfg_label: [["style_text","freeform_text","speaker_id","mir"],["lyrics"]]

    cache_dir: .module_cache/bigmusic

    mulan_tokenizer_path: 'hdfs://haruna/home/byte_data_seed/lf_lq/speech/user/rui.xia/bigmusic/token_files/bert-large-uncased/'


required_modules:
    bestrq:
        # US UMM-chroma-Zh stage 3
        hpath: !ref <extra_params[tokenizer_path]>
        initializer: !name:recipes.umm.requires.model_initializer.init_stage3
            cache_dir: !ref <extra_params[cache_dir]>
    mulan:
        hpath: !ref <extra_params[mulan_path]>
        initializer: !name:recipes.musiclm.requires.model_initializer.init_mulan
            cache_dir: !ref <extra_params[cache_dir]>
            version: !ref <extra_params[mulan_version]>
