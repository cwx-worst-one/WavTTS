---

################################################################################
##########                       BASIC CONFIGURATION                  ##########
################################################################################


extra_params:
    varlen_lyrics_prefix: true

    # LM params
    embedding_dim: 1152  # hidden_size
    pretrained_path: null

    # tokenizer
    tokenizer_path: !apply:os.getenv ["tokenizer_path", "hdfs://haruna/home/byte_data_seed/lf_lq/speech/user/qinxin.025/logs/RVQ/RVQ_RP_4x16384_lr3e-5_30k_bs5_a100/checkpoints/step=0200000.ckpt"]
    tokenizer_chunk_duration: !apply:samantha.utils.envs.getenv_int ["tokenizer_chunk_duration", 60]
    token_slice_method: !apply:os.getenv ["token_slice_method", "even"]

    semantic_frame_rate: 25  # UMM frame rate

    # Multi-token prediction & multi-path CFG
    group_dropout_rate: 0
    group_controller_cfg_label: [["style_text","freeform_text","speaker_id","mir"],["lyrics"]]
    style_text_categorical_format: 13_cat

    cache_dir: .module_cache/bigmusic


input_embedders:
    # add_sos/add_eos: Add SOS or EOS token to the internal embedding table
    # with_sos/with_eos: Prepend SOS token or append EOS token to the embedding sequence

    multitags_categorical: !new:apps.bigmusic.mariana_tasks.embedding_modules.MultiTagsCategoricalEmbedder
        embedding_dim: !ref <extra_params[embedding_dim]>
        add_sos: true
        add_eos: true
        with_sos: true
        id_key: style_input_ids

    speaker_id: !new:apps.bigmusic.mariana_tasks.embedding_modules.TokenEmbedder
        vocab_size: 100  # speaker_codebook_size
        embedding_dim: !ref <extra_params[embedding_dim]>
        add_sos: true
        add_eos: true
        id_key: speaker_id

    tempo: !new:apps.bigmusic.mariana_tasks.embedding_modules.XValEmbedder
        embedding_dim: !ref <extra_params[embedding_dim]>
        max_value: 200
        norm_max_value: 5
        item_key: tempo

    mulan_text: !new:apps.bigmusic.mariana_tasks.embedding_modules.MulanEmbedder
        input_dim: 768  # mulan_embed_dim
        embedding_dim: !ref <extra_params[embedding_dim]>
        add_sos: true
        add_eos: true
        with_sos: true
        mulan_crop: true
        dropout: 0.3  # tag_dropout_rate  0.1 -> 0.0
        add_none: true  # mulan_add_cfg
        text_emb_max_len: 200  # mulan_text_emb_max_len
        return_hidden_state: true  # mulan_use_hidden_state
        text_key: freeform_text

    # lyrics: !new:apps.bigmusic.mariana_tasks.embedding_modules.TokenXvalEmbedder
    #     vocab_size: 4000  # lyrics_codebook_size
    #     embedding_dim: !ref <extra_params[embedding_dim]>
    #     add_sos: true
    #     add_eos: true
    #     with_sos: true
    #     is_varlen: !ref <extra_params[varlen_lyrics_prefix]>
    #     id_key: lyrics_tokens
    #     length_key: lyrics_tokens_length
    #     coff_key: lyrics_coffs

    lyrics: !new:apps.bigmusic.mariana_tasks.embedding_modules.TokenRotaryXvalPosEmbedder
        vocab_size: 4000  # lyrics_codebook_size
        embedding_dim: !ref <extra_params[embedding_dim]>
        add_sos: true
        add_eos: true
        with_sos: true
        is_varlen: !ref <extra_params[varlen_lyrics_prefix]>
        id_key: lyrics_tokens
        length_key: lyrics_tokens_length
        coff_key: lyrics_coffs
        pos_key: lyrics_pos
        mode: concat
        max_value: 10.0  # The same value used by _normalize_duration in sami_phoneme_tokenizer


# RVQ target embedder
target_embedder: !new:apps.bigmusic.mariana_tasks.embedding_modules.BestRQHierarchicalTokenEmbedder
    vocab_size: 16_384  # semantic_codebook_size
    embedding_dim: !ref <extra_params[embedding_dim]>
    add_sos: true
    add_eos: true
    with_sos: true
    with_eos: true
    sample_rate: 24000
    slice_method: !ref <extra_params[token_slice_method]>
    chunk_dur: !ref <extra_params[tokenizer_chunk_duration]>
    item_key: target_audio
    length_key: target_tokens_length
    varlen: False
    codebook_tie: true
    codebook_depth: [2, 2]
    token_embed_dim: 32
    null_placeholder: true
    


required_modules:
    bestrq:
        # US UMM-chroma-Zh stage 3
        hpath: !ref <extra_params[tokenizer_path]>
        initializer: !name:recipes.umm2.requires.model_initializer.init_umm2
            cache_dir: !ref <extra_params[cache_dir]>
    mulan:
        hpath: "hdfs://haruna/home/byte_data_seed/lf_lq/speech/user/bochen/mulan/mulan-step=002500-median_rank_1=89-kaggle.ckpt"
        initializer: !name:recipes.musiclm.requires.model_initializer.init_mulan
            cache_dir: !ref <extra_params[cache_dir]>
            version: sstkmae_v3

