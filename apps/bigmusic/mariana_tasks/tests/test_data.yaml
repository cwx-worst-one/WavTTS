# yaml file only used in CI test.

data:
  save_ckpt_interval: -1
  train_dataset_ids: [3520]
  train_dataset_weights: [1]
  val_dataset_ids: [3520]
  val_dataset_weights: [1]
  predict_dataset_ids: [3520]
  predict_dataset_weights: [1]

  train_batcher:
    type: "TokenBucketBatcher"
    dynamic_batch: True
    bucket_schedule_key: "num_total_tokens"
    maximum_bucket_size: 5000

  val_batcher:
    type: "SimpleBatcher"
    batch_size: 1

  predict_batcher:
    type: "SimpleBatcher"
    batch_size: 1

  train_item_transform:
    - type: "ConvertMetaToDict"
    - type: "MusicParser"
      in_key: "audio"
      out_key: "audio"
      max_len: 800.0 # second
    - type: "WavResample"
      key: "audio"
      sample_rate: 24000
    - type: "NormalizeAudioToFloat32"
      in_key: "audio"
      out_key: "audio"
    # Meta data parsing
    - type: "StructureParser"
      confidence_threshold: 0.0
    - type: "TempoParser"
      dropout_rate: 0.0
    - type: "KeyModeParser"
      dropout_rate: 0.0
    - type: "InstParser"
      dropout_rate: 0.0
    - type: "StyleTagParser"
      dropout_rate: 0.0
    - type: "StyleTagFilter"
    - type: "StyleTagTokenizer"
      vocab: "v3"
    - type: "FreeformTextParser"
      keyword_dropout_rate: 0.0
      dropout_rate: 0.0
    - type: "UtteranceParser"
    - type: "MusicMetaRWTransform"
      in_key: "meta.mir_service.vocal2midi"
      out_key: "vocal2midi"
      allow_empty_in: true
    # Split parsed data into multple song slices with style tags and freeform text tucked in
    - type: "SongSliceSplit"
      max_duration: 240.0
      line_break_dropout_rate: 0.0
      slice_mode: section # section | full
      out_key: song_slices
    # (Optional) Remove redundant data after the split
    - type: "MusicMetaRWTransform"
      in_key:
        [
          "utterances",
          "style_tags",
          "style_input_ids",
          "freeform_text",
          "structure",
          "vocal2midi",
        ]
      out_key: null
      remove_in_key: true

    # -------------------------------------------------
    # A series of operations on individual song slices
    # -------------------------------------------------
    - type: "SongSliceMapFilter"
      duration_range: [20, 240]
      lyrics_confidence: 0.1
    # Randomly sample n_items song slices
    - type: "RandomSampleFromList"
      in_key: "song_slices"
      out_key: "song_slices"
      n_items: 10
      p_full: 0.0
    # reformat -> sequentialize -> tokenize phonemes with interleaved tags (section, singer, etc.)
    - type: "SongSliceMapSequentialize"
      note_dropout_rate: 1.0
    - type: "SongSliceMapTokenize"
      vocab: "v1"
      section_tag_dropout_rate: 0.1
      slice_duration_dropout_rate: 0.0
      singer_tag_dropout_rate: 0.1
    - type: "SongSliceAudioCut"
      in_key: "song_slices"
      audio_key: "audio"
    # Take song slices out, became list of song slices (dict)
    - type: "MusicMetaRWTransform"
      in_key: "song_slices"
      out_key: null
      overwrite_item: true
      maybe_return_list_output: true
    # -------------------------------------------------

    - type: SpeakerIdParser
      in_key: "style_tags.vocal_gender"
      out_key: "speaker_id"

    - type: "SanityCheck"
      keys:
        [
          "uttid",
          "audio",
          "phrases",
          "style_tags",
          "style_input_ids",
          "freeform_text",
          "phoneme_tokens",
          "duration",
          "speaker_id",
        ]

    - type: "CalculateToken"
      token_rate: 25
      audio_length_out_key: "target_tokens_length"
      lyrics_length_out_key: "lyrics_tokens_length"
      total_token_length: "num_total_tokens"
      sample_rate: 24000

    - type: "ConvertDictToList"
      in_key: style_tags
      out_key: style_text
      list_order:
        [
          "genre",
          "genre_extra",
          "extra",
          "mood",
          "scene",
          "vocal_gender",
          "vocal_timbre",
          "language",
          "is_sinking",
          "instrument",
          "tempo",
          "key",
          "mode",
        ]

    - type: "ConvertDictToList"
      in_key: style_input_ids
      out_key: style_input_ids
      list_order:
        [
          "genre",
          "genre_extra",
          "extra",
          "mood",
          "scene",
          "vocal_gender",
          "vocal_timbre",
          "language",
          "is_sinking",
          "instrument",
          "tempo",
          "key",
          "mode",
        ]

    - type: "AddField"
      key: conditions
      value: "style_category,speaker_id,freeform_text,lyrics_tokens"

    - type: "RenameKey"
      in_key_list: ["audio"]
      out_key_list: ["target_audio"]
      in_place: true

  train_batch_transform:
    #- type: WorkerInfoCollate
    - type: AudioCollate
      in_key: "target_audio"
      length_key: "audio_length"
      pad_value: 0.0

    #phoneme_tokens: tokens(str), input_ids(int id), coffs(float)
    - type: TokenCoffCollate
      in_key: "phoneme_tokens"
      token_key: "input_ids"
      coff_key: "coffs"
      token_output_key: "lyrics_tokens"
      coff_output_key: "lyrics_coffs"
      max_phone_len: 4000

    - type: NestListCollate
      key_list:
        [
          "uttid",
          "style_tags",
          "style_text",
          "style_input_ids",
          "freeform_text",
          "phoneme_tokens.tokens",
          "conditions",
        ]
      to_tensor: False

    - type: NestListCollate
      key_list:
        [
          "lyrics_tokens_length",
          "target_tokens_length",
          "num_total_tokens",
          "speaker_id",
          "tempo",
        ]
      to_tensor: True

  predict_item_transform: &predict_item_transform
    - type: ConvertMetaToDict

  predict_batch_transform: &predict_batch_transform
    - type: mariana.data.audio.collates.SimpleListCollate

  val_item_transform: *predict_item_transform
  val_batch_transform: *predict_batch_transform