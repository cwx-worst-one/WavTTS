    wvae_encoder_win_size: 1200
    wav_norm: False
    vocoder_model: !name:recipes.diffusion.models.vocoder_model.utils.init_vocoder
        checkpoint_path: hdfs://haruna/home/byte_data_seed/lf_lq/speech/user/yangyifeng.jervint/features_extraction/vc_vocoder_emb_bigmusic_v1.4/soundstream-step=374999-val_sdr=12.9557.ckpt
        version: 24k_125hz_dim32_baseline
        cache_dir: ".module_cache"
        sample_rate: !ref <mel_config[sampling_rate]>


mel_config: # ibigvgan config.
    n_fft: 4096
    num_mels: 100
    hop_size: 600
    win_size: 2400
    fmin: 0
    fmax: 12000
    sampling_rate: 24000
    mel_norm_mean: -4
    mel_norm_std: 7.5
    mel_mask_value: -5


diffusion_config:
    diffusion_ckpt_path: !ref <run_opts[diffusion_ckpt_path]>
    umm_ckpt_path: !ref <run_opts[umm_ckpt_path]>
    vocoder_ckpt_path: !ref <run_opts[vocoder_ckpt_path]>
    output_dir: !ref <run_opts[output_dir]>
    infer_type: !ref <run_opts[infer_type]>
    umm_frame_rate: !ref <run_opts[umm_frame_rate]>
    mel_frame_rate: !ref <run_opts[mel_frame_rate]>
    mel_config: !ref <mel_config>
    seed: !ref <run_opts[seed]>
    diffusion_precision: "bf16"
    diffusion_nfe: 4
    diffusion_sampler: "consistency"
    text_cfg_w: 1
    use_wvae_vocoder: !ref <run_opts[use_wvae_vocoder]>
    bn_config: !ref <bn_config>
    umm_type: "UMM"
    token_chunk_size: !ref <run_opts[token_chunk_size]>
    token_chunk_overlap: !ref <run_opts[token_chunk_overlap]>
    without_prefix: True

