run_opts:
    precision: 32
    strategy: ddp
    ckpt_path: ""
    output_dir: output_wavs
    meta_lst: ""
    num_workers: 4
    seed: 1996
    diffusion_ckpt_path: "hdfs://haruna/home/byte_data_seed/lf_lq/speech/user/zhangshuo/bigmusic/unified_diffusion/unified_diffusion/h800_ds1614_prompt_16xH800_25hzUMM_40hzSS_streaming_chunk320_0301/checkpoints/epoch=00-step=480000-loss=0.20.ckpt"
    umm_ckpt_path: "/mnt/bn/data-storage-hl/user/zhangshuo/data/assets/umm/umm_stage3_zh_dw1-1-0_wordpiece_vq32768x16-layer12/step=070000.ckpt"
    vocoder_ckpt_path: ""
    umm_frame_rate: 25
