---

run_opts:
    precision: 32
    strategy: ddp
    ckpt_path: ""
    output_dir: output_wavs
    meta_lst: ""
    num_workers: 4
    seed: 1996
    diffusion_ckpt_path: ""
    infer_type: diffusion-vocoder
    use_wvae_vocoder: True
    lang: en
    token_chunk_size: 200
    token_chunk_overlap: 1
    without_prefix: True
    batch_size: 4
    vocoder_version: ""
    tokenizer_version: ""
    sampler: ""

seed: !ref <run_opts[seed]>
__set_seed: !apply:pytorch_lightning.seed_everything [!ref <seed>]

predict_dataset: !new:apps.bigtts.umm.diffusion.datasets.meta_based_dataset.MetaBasedUnit2WavDataset
    meta_lst: !ref <run_opts[meta_lst]>
    lang: !ref <run_opts[lang]>

dataloader: !new:torch.utils.data.DataLoader
    dataset: !ref <predict_dataset>
    num_workers: !ref <run_opts[num_workers]>
    batch_size: !ref <run_opts[batch_size]>
    drop_last: False
    collate_fn: !apply:eval ['lambda x: x'] 
    
pl_datamodule: !new:recipes.text2semantic.lit_modules.lit_data.DataModule
    predict_dataloader: !ref <dataloader>


bn_config: !applyref:operator.getitem 
    - !include:vocoder_config.yaml
    - !ref <run_opts[vocoder_version]>

tokenizer_config: !applyref:operator.getitem 
    - !include:tokenizer_config.yaml
    - !ref <run_opts[tokenizer_version]>

sampler_config: !applyref:operator.getitem 
    - !include:sampler_config.yaml
    - !ref <run_opts[sampler]>

mel_config:
    n_fft: 4096
    num_mels: 100
    hop_size: 600
    win_size: 2400
    fmin: 0
    fmax: 12000
    sampling_rate: !ref <bn_config[sample_rate]>
    mel_norm_mean: -4
    mel_norm_std: 7.5
    mel_mask_value: -5


pl_module: !new:apps.bigmusic.umm.diffusion.lit_modules.lit_diffusion_reconstruct.ChunkInfer
    diffusion_ckpt_path: !ref <run_opts[diffusion_ckpt_path]>
    umm_ckpt_path: !ref <tokenizer_config[ckpt_path]>
    vocoder_ckpt_path: ""
    output_dir: !ref <run_opts[output_dir]>
    infer_type: !ref <run_opts[infer_type]>
    umm_frame_rate: !ref <tokenizer_config[frame_rate]>
    mel_frame_rate: !ref <bn_config[frame_rate]>
    mel_config: !ref <mel_config>
    seed: !ref <run_opts[seed]>
    diffusion_nfe: !ref <sampler_config[nfe]>
    diffusion_sampler: !ref <run_opts[sampler]>
    text_cfg_w: !ref <sampler_config[text_cfg_w]>
    use_wvae_vocoder: !ref <run_opts[use_wvae_vocoder]>
    bn_config: !ref <bn_config>
    umm_type: !ref <tokenizer_config[umm_type]>
    token_chunk_size: !ref <run_opts[token_chunk_size]>
    token_chunk_overlap: !ref <run_opts[token_chunk_overlap]>
    without_prefix: !ref <run_opts[without_prefix]>

trainer: !new:pytorch_lightning.Trainer
    accelerator: "auto"
    devices: "auto"
    num_nodes: !apply:samantha.utils.envs.getenv_int ["ARNOLD_WORKER_NUM", 1]
    deterministic: False
    enable_model_summary: True
    strategy: !ref <run_opts[strategy]>
    precision: !ref <run_opts[precision]>
    max_epochs: 1
