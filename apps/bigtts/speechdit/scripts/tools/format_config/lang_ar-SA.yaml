sub_map:
# Mapping "alif with hamza" -> "alif without hamza". Be careful, I observed the rules are read from right to left for ar-SA. 
# To be safe, I use unicode rule. Here '\u0625' is "إ", \u0623' is 'أ' and '\u0627' is 'ا'
  "\u0625": "\u0627"
  "\u0623": "\u0627"
