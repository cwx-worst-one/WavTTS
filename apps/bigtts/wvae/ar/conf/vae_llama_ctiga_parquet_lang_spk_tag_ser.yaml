---

################################################################################
##########                       BASIC CONFIGURATION                  ##########
################################################################################

seed: 1996
__set_seed: !apply:pytorch_lightning.seed_everything [!ref <seed>]

################################################################################
##########                    TRAINING CONFIGURATION                  ##########
################################################################################
run_opts:
    log_dir: logs
    hdfs_path: None
    fast_dev_run: False
    tensorboard_dir: !ref <run_opts[log_dir]>
    log_name: semantic
    version: 1.0
    precision: bf16
    accelerator: auto
    strategy: ddp # deepspeed_stage_2_offload, ddp_find_unused_parameters_false
    cache_dir: ./.cache_dir
    profiler: simple
    flash_attn: null
    num_epochs: 100
    batch_size: 16
    num_workers: 8
    learning_rate: 0.0003
    weight_decay: 0.1
    checkpointing: False
    n_step_save: 5000
    batch_total_tokens: 5000
    urls: null
    data_id: null
    accumulate_grad_batches: 5
    max_len: 6000
    stop_token_loss_weight: 1.0
    use_lang_id: False
    lang_tokens_num: 200
    lang2id: 'apps/bigtts/wvae/ar/resources/lang2id.json'
    use_spk_id: True
    spk_tokens_num: 16384
    spk2id: 'apps/bigtts/wvae/ar/resources/spk2id.json'
    resume_ckpt_path: null
    use_code_switch_data: True
    get_lang_by_tacolab: False
    en_foreigner_list: null
    tag_vocab_size: 10
    use_bpe: True
    use_extra_tag: True
    spk2tag: 'apps/bigtts/wvae/ar/resources/spk2tag.json'
    text_encoder_type: 'flan-T5-large'
    text_encoder_path: 'resource/models/flan-T5-large'
    use_phoneme_loss: True
    use_ctc_loss: False
    use_url_lst: False
    freeze_text_encoder: True
    spk_type: 'concat'
    input_type: '2dim'
    spk_cfg_rate: 0.0
    lang_cfg_rate: 0.0
    use_ser_tag: False
    use_ser_tag_loss: False
    use_ref_enc: False
    use_sp: True
    refenc_cfg_rate: 0.0
    shuffle_buffer: 2048

################################################################################
##########                   DATAMODULE CONFIGURATION                 ##########
################################################################################

# item_transform configuration
item_transform: !new:apps.bigtts.wvae.ar.data.transform.ContinuousTTSLangSpkSerTransform
    use_lang_id: !ref <run_opts[use_lang_id]>
    lang2id: !ref <run_opts[lang2id]>
    use_spk_id: !ref <run_opts[use_spk_id]>
    spk2id: !ref <run_opts[spk2id]>
    use_code_switch_data: !ref <run_opts[use_code_switch_data]>
    get_lang_by_tacolab: !ref <run_opts[get_lang_by_tacolab]>
    en_foreigner_list: !ref <run_opts[en_foreigner_list]>
    bpe_dir: !ref <run_opts[text_encoder_path]>
    max_length: !ref <run_opts[max_len]>
    use_bpe: !ref <run_opts[use_bpe]>
    use_extra_tag: !ref <run_opts[use_extra_tag]>
    spk2tag: !ref <run_opts[spk2tag]>
    tokenizer_type: !ref <run_opts[text_encoder_type]>
    input_type: !ref <run_opts[input_type]>
    spk_cfg_rate: !ref <run_opts[spk_cfg_rate]>
    lang_cfg_rate: !ref <run_opts[lang_cfg_rate]>
    use_sp: !ref <run_opts[use_sp]>
    refenc_cfg_rate: !ref <run_opts[refenc_cfg_rate]>

# batch_transform configuration
batch_transform: !new:samantha.dataio.lite.compose.BatchCompose
    transforms:
        - !new:apps.bigtts.wvae.ar.data.collate.ContinuousCollator
            tokenizer_pad: 0
            use_bpe: !ref <run_opts[use_bpe]>
            use_extra_tag: !ref <run_opts[use_extra_tag]>

# dataset configuration
train_dataset: !new:samantha.dataio.parquet.parquet_dataset.ParquetDataset
    data_id: !ref <run_opts[data_id]>
    resampled: True
    # shardshuffle: True
    sample_shuffle_buffer_size: !ref <run_opts[shuffle_buffer]>
    item_transform: !ref <item_transform>
    batch_size_in_worker: 16
    yield_state: True

# batcher configuration
bucket_batcher: !new:samantha.dataio.batching.BucketBatcher
    buckets: !apply:eval ["list(range(0, 6000, 100))"]  # [0, 100, 200 ... 4000] 4000以上的可以先丢掉
    dynamic_batch: True
    maximum_bucket_size: !ref <run_opts[batch_total_tokens]>
    length_fn: !apply:eval ["lambda x: x[\"stop_token\"].shape[0]"]  # seq.shape

# dataloader configuration
train_dataloader: !new:cruise.data_module.lite.dataloader.LiteCruiseDataLoader
    dataset: !ref <train_dataset>
    batcher: !ref <bucket_batcher>
    batch_transform: !ref <batch_transform>
    num_workers: !ref <run_opts[num_workers]>
    pin_memory: True
    drop_last: False
    prefetch_factor: 32
    persistent_workers: False

# datamodule configuration
pl_datamodule: !new:samantha.dataio.lite.lite_datamodule.LiteDataModule
    train_dataloader: !ref <train_dataloader>
    val_dataloader: [] # skip_validation=true


llama_config: !new:.samantha.models.wfvae_ctiga_llama.VAELLaMaModelArgs
    dim: 1536
    n_layers: 30
    n_heads: 24
    cross_attention_n_heads: 24
    out_dim: 32
    multiple_of: 256
    norm_eps: 0.000001
    max_batch_size: 32
    max_seq_len: !ref <run_opts[max_len]>
    attn_pdrop: 0.0
    resid_pdrop: 0.0
    pos_pdrop: 0.1
    sparse: false
    checkpointing: !ref <run_opts[checkpointing]>
    lang_vocab_size: !ref <run_opts[lang_tokens_num]>
    spk_vocab_size: !ref <run_opts[spk_tokens_num]>
    tag_vocab_size: !ref <run_opts[tag_vocab_size]>
    n_phonetone: 30000
    ser_tag_vocab_size: 100
    use_ref_enc: !ref <run_opts[use_ref_enc]>

# model configuration
model_cls: !name:samantha.models.wfvae_ctiga_llama.VAELLaMaLangSpkSer
    params: !ref <llama_config>
    provider: ctiga
    use_lang_id: !ref <run_opts[use_lang_id]>
    use_spk_id: !ref <run_opts[use_spk_id]>
    text_encoder_type: !ref <run_opts[text_encoder_type]>
    text_encoder_path: !ref <run_opts[text_encoder_path]>
    use_extra_tag: !ref <run_opts[use_extra_tag]>
    use_phoneme_loss: !ref <run_opts[use_phoneme_loss]>
    attn_type: mha
    spk_type: !ref <run_opts[spk_type]>
    input_type: !ref <run_opts[input_type]>
    use_ser_tag: !ref <run_opts[use_ser_tag]>
    use_ser_tag_loss: !ref <run_opts[use_ser_tag_loss]>

# training module configuration
#optimizer_cls: !name:torch.optim.AdamW
optimizer_cls: !name:deepspeed.ops.adam.FusedAdam # FusedAdam, DeepSpeedCPUAdam
    lr: !ref <run_opts[learning_rate]>
    weight_decay: !ref <run_opts[weight_decay]>
    betas: [0.9, 0.95]
    eps: 0.00000001

_steps_per_epoch: !apply:operator.length_hint [!ref <train_dataloader>]
_world_size: !apply:samantha.utils.envs.getenv_int ["WORLD_SIZE", 1]
scheduler_cls: !name:samantha.optim.lr_scheduler.warmup_cosine_lr.WarmupCosine
    init_lr: !ref <run_opts[learning_rate]>
    warmup_steps: 2000
    cycle_steps: 400000
    min_lr: !ref <run_opts[learning_rate]> * 0.1

# lightning model setting
pl_module: !new:apps.bigtts.wvae.ar.lit_vae_t2s_ctiga_lang_spk_ser.VAET2SLangSpkSerModule
    model_cls: !ref <model_cls>
    optimizer_cls: !ref <optimizer_cls>
    scheduler_cls: !ref <scheduler_cls>
    logits_criterion_cls: !name:samantha.criterion.masked_loss.MaskedCrossEntropy
    dense_criterion_cls: !name:samantha.criterion.masked_loss.MaskedKLLossPP
    checkpointing: !ref <run_opts[checkpointing]>
    required_modules:
        ser_tag:
            - hdfs://haruna/home/byte_data_seed/lf_lq/speech/user/huangzhiying.92/resource/models/SAMI_SER
            - !name:samantha.models.wfvae_ctiga_llama.init_sami_ser
              cache_dir: !ref <run_opts[cache_dir]>
    stop_token_loss_weight: !ref <run_opts[stop_token_loss_weight]>
    use_lang_id: !ref <run_opts[use_lang_id]>
    use_spk_id: !ref <run_opts[use_spk_id]>
    use_phoneme_loss: !ref <run_opts[use_phoneme_loss]>
    use_ctc_loss: !ref <run_opts[use_ctc_loss]>
    freeze_text_encoder: !ref <run_opts[freeze_text_encoder]>
    spk_type: !ref <run_opts[spk_type]>
    resume_ckpt_path: !ref <run_opts[resume_ckpt_path]>
    input_type: !ref <run_opts[input_type]>
    use_ser_tag: !ref <run_opts[use_ser_tag]>
    use_ser_tag_loss: !ref <run_opts[use_ser_tag_loss]>
    use_ref_enc: !ref <run_opts[use_ref_enc]>

logger:
    - !new:pytorch_lightning.loggers.TensorBoardLogger
      save_dir: !ref <run_opts[tensorboard_dir]>
      name: !ref <run_opts[log_name]>
      version: !ref <run_opts[version]>
    - !new:pytorch_lightning.loggers.wandb.WandbLogger
      save_dir: !ref <run_opts[tensorboard_dir]>
      project: !ref <run_opts[log_name]>
      name: !ref <run_opts[version]>

callbacks:
    - !new:samantha.callbacks.HDFSModelCheckpoint
      hdfs_path: !ref <run_opts[hdfs_path]>
      every_n_train_steps: !ref <run_opts[n_step_save]>
      mode: min
      save_last: True
      save_top_k: 100
      save_on_train_epoch_end: True
      verbose: True
      monitor: kl_loss
      filename: "{epoch:02d}-{step}-{kl_loss:.2f}"
    - !new:pytorch_lightning.callbacks.LearningRateMonitor
      logging_interval: 'step'
    - !new:samantha.callbacks.timer.Timer

plugins:
    - !new:samantha.plugins.LargeTorchCheckpointIO

trainer: !new:pytorch_lightning.Trainer
    fast_dev_run: !ref <run_opts[fast_dev_run]>
    logger: !ref <logger>
    accelerator: !ref <run_opts[accelerator]>
    devices: 'auto'
    num_nodes: !apply:os.getenv ["ARNOLD_WORKER_NUM", 1]
    deterministic: False  # warning: setting to True can cause slowdowns
    enable_model_summary: True
    log_every_n_steps: 100
    strategy: !ref <run_opts[strategy]>
    max_epochs: !ref <run_opts[num_epochs]>
    precision: !ref <run_opts[precision]>
    profiler: !ref <run_opts[profiler]>
    callbacks: !ref <callbacks>
    gradient_clip_val: 1.0
    benchmark: true
    accumulate_grad_batches: !ref <run_opts[accumulate_grad_batches]>
    plugins: !ref <plugins>

ckpt_path: null
